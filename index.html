<style>
:root{
  color-scheme:light;
  /* 계명스튜던트포털(STORY+) 역량 대시보드 색을 따름 */
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EEF4FC; --surface-3:#F8FAFC;
  --border:#E6E9ED; --text:#22303F; --text-muted:#79828C; --text-faint:#9AA3AC;
  --primary:#2F62D9; --primary-dark:#1F4BB5; --primary-contrast:#FFFFFF;
  --banner:linear-gradient(90deg,#4159D0,#5FC5F2);
  --grad-1:#4A63E0; --grad-2:#5FB6EE;
  --amber:#B57A08; --amber-bg:#FDF8EC; --amber-border:#F6E3B8;
  --danger:#D32027; --danger-bg:#FDF1F1; --danger-border:#F7CFD1;
  --success:#12805A; --success-bg:#E8F6F0;
  --overlay:rgba(20,28,38,.5);
  --radius-s:8px; --radius-m:14px; --radius-l:18px;
  --shadow-card:0 1px 2px rgba(34,48,63,.05), 0 8px 22px -14px rgba(34,48,63,.2);
  --font-display:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-body:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'JetBrains Mono','SFMono-Regular',monospace;
  --face-f:#F02027; --face-f-soft:#FDF1F1; --face-f-chip:#FCE0E1;
  --face-a:#F9B213; --face-a-soft:#FDF8EC; --face-a-chip:#FBEBCB;
  --face-c:#17B3E8; --face-c-soft:#F1FAFE; --face-c-chip:#D9F0FB;
  --face-e:#8E5FD3; --face-e-soft:#F8F5FD; --face-e-chip:#EAE0F8;
  --face-f-ink:#D3181F; --face-a-ink:#B57A08; --face-c-ink:#0E88B5; --face-e-ink:#7A4BC0;
  --pyr-r:#E0524A; --pyr-a:#0E9595; --pyr-t:#6A5FC4; --pyr-s:#2F7FD1;
  --pill-r:#E0524A; --pill-a:#0E9595; --pill-t:#6A5FC4; --pill-s:#2F7FD1;
  --g-r:linear-gradient(100deg,#E0524A,#F08277); --g-a:linear-gradient(100deg,#0E9595,#40CFCB);
  --g-t:linear-gradient(100deg,#6A5FC4,#8B7FE0); --g-s:linear-gradient(100deg,#2F7FD1,#5FB6EE);
  --track:#EAEDF1;
  --gold:#B57A08; --gold-soft:#FDF8EC;
}
*{box-sizing:border-box;}
html{background:var(--bg);}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); padding:28px 16px 64px; min-height:100vh;}
h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0; font-weight:800; letter-spacing:-.01em;}
.dashbanner{background:var(--banner); color:#fff; font-size:17px; font-weight:800; text-align:center; padding:13px 16px; border-radius:var(--radius-s); margin-bottom:18px;}
.markline{background:linear-gradient(transparent 58%, var(--face-c-chip) 58%); padding:0 2px;}
button{font-family:inherit;}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
::selection{background:var(--primary); color:var(--primary-contrast);}

.page{max-width:1080px; margin:0 auto; display:flex; flex-direction:column; align-items:center; gap:18px;}
.topbar{width:100%; max-width:460px; display:flex; align-items:center; justify-content:space-between;
  gap:16px; flex-wrap:wrap; padding:20px 22px; border-radius:16px; color:#fff;
  background:linear-gradient(100deg, var(--grad-1), var(--grad-2)); box-shadow:var(--shadow-card);}
.topbar-actions{display:flex; gap:6px; margin-left:auto; flex-wrap:wrap; justify-content:flex-end;}
.share-toast{width:100%; max-width:460px; text-align:right; font-size:12px; font-weight:700;
  color:var(--success); margin-top:-10px;}
.page.wide .share-toast{max-width:1000px;}
.install-steps{counter-reset:step; display:flex; flex-direction:column; gap:10px; margin:0; padding:0; list-style:none;}
.install-steps li{position:relative; padding-left:30px; font-size:13px; line-height:1.6;}
.install-steps li::before{counter-increment:step; content:counter(step); position:absolute; left:0; top:1px;
  width:21px; height:21px; border-radius:50%; background:var(--primary); color:#fff;
  font-size:11.5px; font-weight:800; display:flex; align-items:center; justify-content:center;}
.plat-title{font-size:13px; font-weight:800; margin:16px 0 8px; display:flex; align-items:center; gap:6px;}
.plat-title:first-of-type{margin-top:6px;}
.page.wide .topbar, .page.wide .roletabs{max-width:1000px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:38px; height:38px; border-radius:11px; background:var(--primary); color:var(--primary-contrast); display:flex; align-items:center; justify-content:center; font-size:18px; flex:none;}
.brand svg{flex:none;}
.brand-text strong{display:block; font-size:19px; font-weight:900; letter-spacing:-.01em; color:#fff;}
.brand-text span{display:block; font-size:11.5px; color:rgba(255,255,255,.86); margin-top:2px; line-height:1.4; word-break:keep-all;}
.guide-link{border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.16); color:#fff;
  font-size:12.5px; font-weight:600; padding:8px 12px; border-radius:8px; cursor:pointer; white-space:nowrap;}
.guide-link:hover{background:rgba(255,255,255,.28); border-color:rgba(255,255,255,.65);}

.roletabs{width:100%; max-width:460px; display:flex; gap:8px; background:var(--surface-2); padding:5px; border-radius:999px;}
.roletab{flex:1; border:none; background:transparent; padding:9px 0; border-radius:999px; font-size:13.5px; font-weight:600; color:var(--text-muted); cursor:pointer;}
.roletab.active{background:var(--surface); color:var(--primary); box-shadow:var(--shadow-card);}

.phone{width:100%; max-width:460px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); box-shadow:var(--shadow-card); padding:24px 20px; position:relative; min-height:420px;}
.page.wide .phone{max-width:1000px;}
.eyebrow{font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint);}
.screen-title{font-size:22px; margin-top:6px; margin-bottom:4px; word-break:keep-all;}
.screen-sub{font-size:13px; color:var(--text-muted); margin-bottom:18px;}

.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
.field label{font-size:12.5px; font-weight:600; color:var(--text-muted);}
.field textarea{min-height:200px;resize:vertical;line-height:1.5;font-size:13px;}
.field input, .field select, .field textarea{border:1px solid var(--border); background:var(--surface-3); color:var(--text); border-radius:var(--radius-s); padding:11px 13px; font-size:14px; font-family:var(--font-body); width:100%;}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--primary); outline-offset:1px; background:var(--surface);}
.field .hint{font-size:11.5px; color:var(--text-faint); line-height:1.5;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.checkrow{display:flex; flex-wrap:wrap; gap:12px; margin:2px 0 16px;}
.checkrow label{display:flex; align-items:center; gap:6px; font-size:13px;}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:var(--radius-s); border:1px solid transparent; font-weight:700; font-size:14.5px; padding:12px 16px; cursor:pointer; width:100%;}
.btn-primary{background:var(--primary); color:var(--primary-contrast);}
.btn-primary:hover{background:var(--primary-dark);}
.btn-ghost{background:var(--surface-2); color:var(--primary); border-color:var(--border);}
.btn-ghost:hover{border-color:var(--primary);}
.btn-line{background:transparent; color:var(--text-muted); border:1px dashed var(--border);}
.btn-danger{background:var(--danger-bg); color:var(--danger); border-color:var(--danger-border);}
.btn-small{width:auto; padding:8px 12px; font-size:12.5px;}
.linklike{background:none; border:none; color:var(--primary); font-weight:600; font-size:12.5px; cursor:pointer; padding:0; white-space:nowrap;}
.row{display:flex; align-items:center; gap:10px;}
.row-between{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px;}
.stack{display:flex; flex-direction:column; gap:10px;}

.notice-box{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-m); padding:13px 15px; font-size:12.5px; color:var(--text-muted); line-height:1.55; margin-bottom:16px;}
.errbox{background:var(--danger-bg); border:1px solid var(--danger-border); color:var(--danger); border-radius:var(--radius-s); padding:10px 13px; font-size:12.5px; margin-bottom:14px; font-weight:600;}
.okbox{background:var(--success-bg); border:1px solid var(--border); color:var(--success); border-radius:var(--radius-s); padding:10px 13px; font-size:12.5px; margin-bottom:14px; font-weight:600;}
.empty-state{text-align:center; padding:36px 12px; color:var(--text-faint); font-size:13px;}

/* K-STAR analysis blocks */
.certrow{display:flex; align-items:center; gap:9px; margin-bottom:12px;}
.certrow .clabel{font-size:11.5px; color:var(--text-muted);}
.certbadges{display:flex; gap:5px;}
.certbadge{position:relative; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; border:2px solid var(--track); color:var(--text-faint); background:var(--surface);}
.certbadge.on{border-color:transparent; color:#fff;}
.certbadge.on.R{background:var(--pill-r);} .certbadge.on.A{background:var(--pill-a);}
.certbadge.on.T{background:var(--pill-t);} .certbadge.on.S{background:var(--pill-s);}
.rrow{display:flex; gap:6px; margin-bottom:12px;}
.rchip{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; text-align:center; padding:7px 2px; border-radius:9px; background:var(--danger-bg);}
.rchip .rlabel{font-size:11px; color:var(--text-muted);}
.rchip .rstatus{font-size:11px; font-weight:800; color:var(--danger);}
.rchip.done{background:var(--success-bg);}
.rchip.done .rlabel{color:var(--text);}
.rchip.done .rstatus{color:var(--success);}
.totalline{font-size:12px; color:var(--text-muted); margin-bottom:10px;}
.totalline b{color:var(--text);}
.facebars{display:flex; flex-direction:column; gap:9px; margin-bottom:14px;}
.facebar{display:grid; grid-template-columns:22px 1fr auto; align-items:center; gap:10px;
  border:1.5px solid transparent; border-radius:10px; padding:4px 5px;}
.facebar.rank1{background:var(--gold-soft); border-color:var(--gold); padding:9px 10px;}
.facebar.rank2{background:var(--surface-2); border-color:var(--primary); border-style:dashed; padding:9px 10px;}
.facebar .code{font-weight:800; font-size:12px; text-align:center; width:22px; height:22px;
  line-height:22px; border-radius:50%;}
.facebar .code.F{color:var(--face-f-ink); background:var(--face-f-chip);}
.facebar .code.A{color:var(--face-a-ink); background:var(--face-a-chip);}
.facebar .code.C{color:var(--face-c-ink); background:var(--face-c-chip);}
.facebar .code.E{color:var(--face-e-ink); background:var(--face-e-chip);}
.trackbar{position:relative; height:9px; border-radius:5px; background:var(--track); overflow:hidden;}
.fill{position:absolute; left:0; top:0; bottom:0; border-radius:5px;}
.fill.F{background:var(--face-f);} .fill.A{background:var(--face-a);}
.fill.C{background:var(--face-c);} .fill.E{background:var(--face-e);}
.facebar .score{font-size:11px; color:var(--text-muted); text-align:right;
  display:flex; flex-direction:column; align-items:flex-end; line-height:1.3; min-width:76px;}
.facebar .score .num{font-size:13.5px; font-weight:800; color:var(--text); font-family:var(--font-mono);}
.facebar .score .gap{font-size:12.5px; font-weight:800; color:var(--danger);}
.facebar .score .gap.met{color:var(--success);}
.facebar.rank1 .score .gap{color:var(--gold);}
.facebar.rank2 .score .gap{color:var(--primary);}
.closest{grid-column:1/-1; font-size:11.5px; font-weight:800; margin-top:1px;}
.closest.rank1{color:var(--gold);} .closest.rank2{color:var(--primary);}
.schol{display:flex; flex-direction:column; gap:8px; background:var(--gold-soft); border:1px solid var(--gold); border-radius:var(--radius-m); padding:11px 14px; margin-bottom:12px;}
.schol-row{display:flex; align-items:center; gap:11px;}
.schol-row.cmp{opacity:.65; padding-top:6px; border-top:1px dashed var(--gold);}
.schol .emo{font-size:22px; flex:none;}
.schol-row.cmp .emo{font-size:15px;}
.schol .amt{font-size:16px; font-weight:900; color:var(--gold); font-family:var(--font-mono);}
.schol-row.cmp .amt{font-size:12.5px;}
.schol .snote{font-size:11px; color:var(--gold); opacity:.9; margin-top:1px;}
/* 다음 목표 — 학생이 가장 먼저 보고 무엇을 할지 알아야 하는 칸 */
.reco{border:2px solid var(--primary); border-radius:var(--radius-m); overflow:hidden;
  background:var(--surface); color:var(--text); box-shadow:var(--shadow-card);}
.reco .rbar{display:flex; align-items:center; gap:9px; padding:12px 14px; color:#fff;
  background:var(--primary); font-size:16px; font-weight:800; letter-spacing:-.01em;
  word-break:keep-all; line-height:1.3;}
.reco .rmark{width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,.3);
  display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:900; flex:none;}
.reco .rbody{padding:13px 14px 15px;}
.reco.st-R{border-color:var(--pill-r);}  .reco.st-R .rbar{background:var(--g-r);}
.reco.st-A{border-color:var(--pill-a);}  .reco.st-A .rbar{background:var(--g-a);}
.reco.st-T{border-color:var(--pill-t);}  .reco.st-T .rbar{background:var(--g-t);}
.reco.st-S{border-color:var(--pill-s);}  .reco.st-S .rbar{background:var(--g-s);}
.reco.st-R b{color:var(--pill-r);} .reco.st-A b{color:var(--pill-a);}
.reco.st-T b{color:var(--pill-t);} .reco.st-S b{color:var(--pill-s);}
.reco.ok{border-color:var(--gold);}
.reco.ok .rbar{background:linear-gradient(100deg,#D9A73D,#E8BE66);}
.reco.ok b{color:var(--gold);}
.reco .rsub{display:block; font-weight:800; font-size:12px; margin:15px 0 7px;
  color:var(--text-muted); letter-spacing:.02em;}
.reco ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px;}
.reco li{position:relative; padding:10px 12px 10px 29px; border-radius:9px;
  background:var(--surface-3); font-size:13.5px; line-height:1.6; word-break:keep-all;}
.reco li::before{content:"→"; position:absolute; left:10px; top:10px; font-weight:900; opacity:.5;}
.reco .rfoot{display:block; margin-top:12px; font-size:12px; color:var(--text-muted); line-height:1.55;}
.stagepill{font-size:11.5px; font-weight:700; padding:4px 11px; border-radius:999px; white-space:nowrap; color:#fff;}
.curpill{display:inline-block; font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:999px;
  margin-left:6px; color:#fff; vertical-align:middle; white-space:nowrap; letter-spacing:-.01em;}
.curpill.R{background:var(--pill-r);} .curpill.A{background:var(--pill-a);}
.curpill.T{background:var(--pill-t);} .curpill.S{background:var(--pill-s);}
.curpill.none{background:var(--surface-3); color:var(--text-faint); border:1px solid var(--border);}
.stagepill.R{background:var(--pill-r);} .stagepill.A{background:var(--pill-a);}
.stagepill.T{background:var(--pill-t);} .stagepill.S{background:var(--pill-s);}

/* admin board */
.summary{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px;}
.tile{background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden;
  box-shadow:var(--shadow-card); cursor:pointer; text-align:left; padding:0; font:inherit; color:inherit;
  border-width:2px; transition:transform .08s ease;}
.tile:hover{transform:translateY(-1px);}
.tile.on{border-color:var(--text); box-shadow:0 0 0 3px rgba(34,48,63,.12), var(--shadow-card);}
.tile .pick{display:block; font-size:10.5px; font-weight:700; color:var(--text-faint); margin-top:7px;}
.tile.on .pick{color:var(--primary);}
.tile .band{padding:8px 14px; color:#fff; font-size:11.5px; font-weight:700; letter-spacing:.01em;}
.tile .body{padding:14px 16px 16px;}
.tile .num{font-size:30px; font-weight:700; font-family:var(--font-mono); line-height:1;}
.tile .lbl{color:var(--text-muted); font-size:11.5px; margin-top:6px; line-height:1.4;}
.tile.t-indigo .band{background:linear-gradient(100deg,#3E52CE,#6B80EE);} .tile.t-indigo .num{color:#3E52CE;}
.tile.t-red .band{background:var(--g-r);}    .tile.t-red .num{color:#E0524A;}
.tile.t-teal .band{background:var(--g-a);}   .tile.t-teal .num{color:#0E9595;}
.tile.t-purple .band{background:var(--g-t);} .tile.t-purple .num{color:#6A5FC4;}
.tile.t-blue .band{background:var(--g-s);}   .tile.t-blue .num{color:#2F7FD1;}
.tile.t-gold .band{background:linear-gradient(100deg,#D9A73D,#E8BE66);}   .tile.t-gold .num{color:#D9A73D;}
.controls{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.controls input, .controls select{border:1px solid var(--border); background:var(--surface-3); color:var(--text); border-radius:var(--radius-s); padding:9px 12px; font-size:13px; font-family:var(--font-body);}
.controls input{flex:1; min-width:150px;}
.board{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; align-items:start;}
@media (max-width:900px){ .board{grid-template-columns:repeat(2,minmax(0,1fr));} }
@media (max-width:560px){ .board{grid-template-columns:1fr;} }
.col h3{display:flex; align-items:center; gap:10px; font-family:var(--font-body); margin-bottom:11px;
  border-radius:var(--radius-s); padding:10px 13px; color:#fff; min-height:66px;}
.col h3 > div{flex:1; min-width:0;}
.col h3 .st-name{display:block; font-size:14px; font-weight:800; line-height:1.2;}
.col h3 .st-name, .col h3 .st-desc{word-break:keep-all;}
.col h3 .st-desc{display:block; font-size:10.5px; font-weight:500; opacity:.85; margin-top:2px;}

function saveFallback(){
  try{ localStorage.setItem('kstar_store', JSON.stringify(fallbackData)); }catch(e){}
}
async function storeGet(col, id){
  if(apiMode){ var r = await apiCall('get', {collection:col, id:id}); return r.doc || null; }
  if(db){ var s = await db.doc(col+'/'+id).get(); return s.exists ? Object.assign({id:s.id}, s.data()) : null; }
  var d = (fallbackData[col]||{})[id];
  return d ? Object.assign({id:id}, d) : null;
}
async function storeSet(col, id, data){
  if(apiMode){ await apiCall('set', {collection:col, id:id, data:data}); return; }
  if(db){ await db.doc(col+'/'+id).set(data); return; }
  fallbackData[col] = fallbackData[col]||{}; fallbackData[col][id] = data; saveFallback();
}
async function storeUpdate(col, id, data){
  if(apiMode){ await apiCall('update', {collection:col, id:id, data:data}); return; }
  if(db){ await db.doc(col+'/'+id).update(data); return; }
  fallbackData[col] = fallbackData[col]||{};
  fallbackData[col][id] = Object.assign({}, fallbackData[col][id]||{}, data);
  saveFallback();
}
async function storeDelete(col, id){
  if(apiMode){ await apiCall('delete', {collection:col, id:id}); return; }
  if(db){ await db.doc(col+'/'+id).delete(); return; }
  if(fallbackData[col]) delete fallbackData[col][id];
  saveFallback();
}
async function storeAll(col){
  if(apiMode){ var r = await apiCall('all', {collection:col}); return r.docs || []; }
  if(db){ var snap = await db.collection(col).get(); return snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); }
  var all = fallbackData[col]||{};
  return Object.keys(all).map(function(id){ return Object.assign({id:id}, all[id]); });
}

function analyze(s){
  var gaps = {}, achieved = {};
  AREAS.forEach(function(a){ gaps[a] = THRESHOLDS[a] - num(s[a]); achieved[a] = gaps[a] <= 0; });
  return {
    gaps: gaps, achieved: achieved,
    achievedCount: AREAS.filter(function(a){ return achieved[a]; }).length,
    rDone: !!(s.r1 && s.r2 && s.r3)
  };
}
function bestGapArea(a){
  var best = null, bv = Infinity;
  AREAS.forEach(function(x){ if(a.gaps[x] < bv){ bv = a.gaps[x]; best = x; } });
  return { area:best, gap:bv };
}
/* S단계 장학금은 최대 2개 영역까지만 나온다. 그 뒤로는 채워도 금액이 늘지 않는다. */

function bestUnmetArea(a){
  var un = AREAS.filter(function(x){ return !a.achieved[x]; })
                .sort(function(x,y){ return a.gaps[x]-a.gaps[y]; });
  return un.length ? { area:un[0], gap:a.gaps[un[0]] } : null;
}
function pickSuggestions(area){
  return FACE_GROUPS[area].rows.filter(function(r){ return r[1] !== '성적'; })
    .slice().sort(function(a,b){ return b[3]-a[3]; }).slice(0,2);
}
function actionLines(area, gap){
  return pickSuggestions(area).map(function(r){
    var guide = ACTION_GUIDE[r[0]] || r[1];
    if(HOURLY_CODES.indexOf(r[0])>-1){
      var hours = Math.max(2, Math.ceil(gap)*2);
      return guide + ' — 약 ' + hours + '시간 정도면 채울 수 있어요';
    }
    return guide;
  });
}
function stageOf(s, a){
  var stage = !a.rDone ? 'R' : (a.achievedCount>=1 ? 'S' : (num(s.year)<=2 ? 'A' : 'T'));
  // 이미 인증받은 단계를 다시 "다음 목표"로 내밀지 않는다.
  var certed = { R:a.rDone, A:!!s.certA, T:!!s.certT, S:!!s.certS };
  var next = stage;
  if(certed[stage]) next = 'S';
  if(next==='S' && a.achievedCount===0) next = 'S0';   // S를 향하지만 아직 FACE 미달
  if(s.certS) next = 'S';
  var label = stage==='R' ? 'R단계 준비중' : stage==='S' ? 'S단계 도전 가능'
            : stage==='A' ? '다음 목표: A단계' : '다음 목표: T단계';
  return { stage:stage, next:next, label:label };
}

var boardSeenAt = null;        // 이번에 화면을 연 시점의 기준 시각

function boardSeen(){
  if(boardSeenAt !== null) return boardSeenAt;
  var prev = null;
  try{ prev = localStorage.getItem(SEEN_KEY); }catch(e){}
  // 처음 쓰는 기기라면 지금부터 — 전원에게 배지가 붙는 일을 막는다
  boardSeenAt = prev || nowIso();
  try{ localStorage.setItem(SEEN_KEY, nowIso()); }catch(e){}
  return boardSeenAt;
}
function markAllSeen(){
  boardSeenAt = nowIso();
  try{ localStorage.setItem(SEEN_KEY, boardSeenAt); }catch(e){}
}
function isFresh(s){
  if(!s || !s.updatedAt) return false;
  var t = new Date(s.updatedAt).getTime();
  var base = new Date(boardSeen()).getTime();
  return isFinite(t) && isFinite(base) && t > base;
}
function isToday(s){
  if(!s || !s.updatedAt) return false;
  var d = new Date(s.updatedAt), n = new Date();
  return d.getFullYear() === n.getFullYear() &&
         d.getMonth()    === n.getMonth()    &&
         d.getDate()     === n.getDate();
}
function daysSince(iso){
  if(!iso) return null;
  var t = new Date(iso).getTime();
  if(!isFinite(t)) return null;
  return Math.floor((Date.now() - t) / 86400000);
}
function freshWhen(s){
  if(!isFresh(s)) return '';
  var d = daysSince(s.updatedAt);
  return d <= 0 ? '오늘' : d === 1 ? '어제' : d + '일 전';
}
function freshBadge(s){
  var w = freshWhen(s);
  return w ? '<span class="fresh">' + w + ' 갱신</span>' : '';
}

function updatedThisMonth(s){
  if(!s || !s.updatedAt) return false;
  var d = new Date(s.updatedAt), n = new Date();
  return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth();
}
function monthlyNudge(s){
  if(updatedThisMonth(s)) return '';
  var last = s && s.updatedAt ? new Date(s.updatedAt) : null;
  return '<div class="monthly">' +
    '<b>이번 달 점수를 아직 안 올렸어요</b>' +
    '<span>계명스튜던트포털(STORY+) → 역량관리 → 역량 대시보드를 열고, ' +
    '화면에 나온 숫자를 그대로 옮겨 적어 주세요. 1분이면 됩니다.</span>' +
    '<span class="last">' + (last
      ? '마지막으로 올린 날: ' + last.getFullYear() + '. ' + (last.getMonth()+1) + '. ' + last.getDate() + '.'
      : '아직 한 번도 올린 적이 없어요.') + '</span>' +
    '<button data-action="goto-scores">지금 입력하기</button>' +
  '</div>';
}

];
var PYR_NEXT = {

function pyramidHtml(s, a){
  var done = { R:a.rDone, A:!!s.certA, T:!!s.certT, S:!!s.certS };
  var cur = currentStage(s, a);
  var body = PYR_TIERS.map(function(t){
    var on = done[t.k];
    var fill = on ? t.color : '#DFE4EC';
    var ink  = on ? '#FFFFFF' : '#9AA3AC';
    return '<polygon points="'+t.pts+'" fill="'+fill+'"'+(on?'':' opacity=".9"')+'/>' +
      '<text x="'+t.lx+'" y="'+t.ly+'" font-size="15" font-weight="800" fill="'+ink+'"' +
        ' text-anchor="middle" dominant-baseline="central"' +
        ' transform="rotate('+t.rot+' '+t.lx+' '+t.ly+')">'+t.k+'</text>' +
      '<line x1="44" y1="'+t.sy+'" x2="'+t.lineTo+'" y2="'+t.sy+'" stroke="'+(on?t.color:'#DFE4EC')+'" stroke-width="1.4"/>' +
      (on
        ? '<g transform="rotate(-12 24 '+t.sy+')">' +
            '<circle cx="24" cy="'+t.sy+'" r="17" fill="#E0524A"/>' +
            '<circle cx="24" cy="'+t.sy+'" r="13.5" fill="none" stroke="#fff" stroke-width="1.2" stroke-opacity=".75"/>' +
            '<text x="24" y="'+(t.sy+0.5)+'" font-size="10" font-weight="800" fill="#fff"' +
              ' text-anchor="middle" dominant-baseline="central">인증</text>' +
          '</g>'
        : '<circle cx="24" cy="'+t.sy+'" r="17" fill="none" stroke="#DFE4EC" stroke-width="2.4"/>' +
          '<circle cx="24" cy="'+t.sy+'" r="3.2" fill="#DFE4EC"/>');

  var nxt = stageOf(s, a).next;
  var foot = s.certS ? '<b style="color:var(--text);">S단계 인증 완료 — 최고 단계입니다</b>'
    : cur ? '<b style="color:var(--text);">'+cur+'단계 인증 완료</b> · 다음은 ' + PYR_NEXT[nxt]
    : '아직 인증받은 단계가 없습니다 · 먼저 ' + PYR_NEXT.R;

  var letter = nxt.charAt(0);
  var nextPanel = s.certS
    ? '<div class="nx st-S"><span class="nx-mark">S</span>' +
        '<span class="nx-lab">최고 단계</span>' +
        '<span class="nx-name">S단계 인증 완료</span>' +
        '<span class="nx-desc">더 오를 단계가 없습니다</span></div>'
    : '<div class="nx st-'+letter+'"><span class="nx-mark">'+letter+'</span>' +
        '<span class="nx-lab">다음 단계</span>' +
        '<span class="nx-name">'+STAGE_TITLE[nxt]+'</span>' +
        '<span class="nx-desc">'+STAGE_DESC[nxt]+'</span></div>';

    '<div class="pyr-head"><b>K-STAR 인증 현황</b>' +

function analysisHtml(s, o){
  var a = analyze(s), reco = recommendation(s,a);
  var certs = [['S',!!s.certS],['T',!!s.certT],['A',!!s.certA],['R',a.rDone]];
  var mark = reco.mark || 'S';
  var recoBlock =
    '<div class="reco st-'+mark+(reco.ok?' ok':'')+'">' +
      '<div class="rbar"><span class="rmark">'+mark+'</span><span>'+esc(reco.head||'다음 목표')+'</span></div>' +
      '<div class="rbody">'+reco.html+'</div>' +
    '</div>';
  var ranked = AREAS.filter(function(x){ return !a.achieved[x]; }).sort(function(x,y){ return a.gaps[x]-a.gaps[y]; });
  // 장학금이 나오는 영역은 최대 2개. 이미 채운 만큼 빼고 남은 자리만 짚어 준다.
  var slots = Math.max(0, S_MAX_AREAS - a.achievedCount);
  var r1 = slots>=1 ? (ranked[0]||null) : null;
  var r2 = slots>=2 ? (ranked[1]||null) : null;
  var oneMore = a.achievedCount===1 && r1;   // 한 영역만 더 채우면 최대치
  return (
    ((o && o.recoTop) ? recoBlock + '<div style="height:14px;"></div>' : '') +
    ((o && o.noCerts) ? '' :
      '<div class="certrow"><span class="clabel">현재 인증 단계</span><div class="certbadges">' +
      certs.map(function(c){ return '<span class="certbadge '+(c[1]?'on '+c[0]:'')+'">'+c[0]+'</span>'; }).join('') +
      '</div></div>') +
    '<div class="rrow">' +
      [['r1','자기소개서'],['r2','학업계획서'],['r3','교수상담']].map(function(p){
        var done = !!s[p[0]];
        return '<div class="rchip '+(done?'done':'')+'"><span class="rlabel">'+p[1]+'</span>' +
               '<span class="rstatus">'+(done?'✓ 완료':'✕ 미완료')+'</span></div>';
      }).join('') +
    '</div>' +
    '<div class="totalline">COMpass K 총점(한도적용) <b class="mono">'+num(s.total)+'</b>점</div>' +
    '<div class="facebars">' +
      AREAS.map(function(x){
        var score = num(s[x]), th = THRESHOLDS[x];
        var pct = Math.min(100, Math.round(score/th*100));
        var met = a.achieved[x];
        var cls = x===r1 ? 'rank1' : x===r2 ? 'rank2' : '';
        return '<div class="facebar '+cls+'">' +
          '<div class="code '+x+'">'+x+'</div>' +
          '<div class="trackbar"><div class="fill '+x+'" style="width:'+pct+'%"></div></div>' +
          '<div class="score">' +
            '<div class="num">'+score+'/'+th+'</div>' +
            '<div class="gap '+(met?'met':'')+'">'+(met ? '달성 ✓' : a.gaps[x]+'점 남음')+'</div>' +
          '</div>' +
          (x===r1 ? '<div class="closest rank1">' +
              (oneMore ? '🥇 여기만 채우면 2개 영역 — 500만원' : '🥇 1순위로 가까움') + '</div>' : '') +
          (x===r2 ? '<div class="closest rank2">🥈 2순위로 가까움</div>' : '') +
        '</div>';
      }).join('') +
    '</div>' +
    (a.achievedCount>=S_MAX_AREAS ?
      '<div class="notice-box" style="margin:-2px 0 12px;border-color:var(--gold);background:var(--gold-soft);color:var(--gold);">' +
      '<b>2개 영역 달성 — S단계 장학금 최대치입니다.</b><br>' +
      '영역을 더 채워도 장학금은 늘지 않습니다. 이제 포트폴리오와 면접에 집중하세요.</div>' : '') +
    '<div class="schol">' +
      '<div class="schol-row"><span class="emo">🎓</span><div>' +
        (a.achievedCount>=S_MAX_AREAS
          ? '<div class="amt">5,000,000원</div><div class="snote">2개 영역 달성 — S단계 인증 시 받을 수 있는 최대 금액</div>'
          : oneMore
            ? '<div class="amt">2,500,000원 → 5,000,000원</div>' +
              '<div class="snote">지금 1개 영역 · <b>'+r1+'영역</b>을 '+a.gaps[r1]+'점 더 채우면 2배</div>'
            : '<div class="amt">'+SCHOLARSHIP.S.amount+'</div><div class="snote">'+SCHOLARSHIP.S.note+'</div>') +
        '</div></div>' +
      ((reco.target==='A'||reco.target==='T') ?
        '<div class="schol-row cmp"><span class="emo">📎</span><div>' +
        '<div class="amt">'+SCHOLARSHIP[reco.target].amount+'</div>' +
        '<div class="snote">'+SCHOLARSHIP[reco.target].note+'</div></div></div>' : '') +
    '</div>' +
    (o && o.recoTop ? '' : recoBlock) +
    (s.note ? '<div class="notice-box" style="margin:12px 0 0;">메모: '+esc(s.note)+'</div>' : '')
  );
}

  studentSession:null, adminSession:null,
  formError:'', formOk:'', modal:null,
  detailId:null, search:'', certSearch:'', yearFilter:'', tileFilter:'', regBusy:false, slideDir:null, installMsg:'', apiError:'', loading:false, previewMode:false, shotMsg:'', shotBusy:false, importResult:'', importBusy:false, importProgress:'', sessionLost:false, updFilter:'', newVersion:'', shareToast:''
};
var cache = { roster:[], me:null };

function session(){ return state.role==='student' ? state.studentSession : state.adminSession; }
function authToken(){ var s = session(); return (s && s.token) || ''; }
function setSession(role, sess){
  if(role==='student') state.studentSession = sess; else state.adminSession = sess;
  try{ localStorage.setItem('kstar_sess_'+role, sess ? JSON.stringify(sess) : ''); }catch(e){}

function restoreSessions(){
  ['student','admin'].forEach(function(role){
    try{
      var raw = localStorage.getItem('kstar_sess_'+role);
      if(raw){ if(role==='student') state.studentSession = JSON.parse(raw); else state.adminSession = JSON.parse(raw); }
    }catch(e){}
  });

var root = document.getElementById('app');
function render(){
  root.innerHTML = (state.mode==='guide' ? renderGuide() : renderApp()) + updateBar();
}

/* ---- 홈 화면 앱으로 설치 ---- */
var installPrompt = null;
function isStandalone(){
  try{
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }catch(e){ return false; }
}
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function inFrame(){
  try{ return window.self !== window.top; }catch(e){ return true; }
}
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  installPrompt = e;
  render();
});
window.addEventListener('appinstalled', function(){ installPrompt = null; render(); });

// 브라우저에서 다시 열었을 때 설치 화면이 바로 뜨도록 표시를 붙인 주소
function installUrl(){
  try{
    var u = new URL(location.href);
    u.searchParams.set('install', '1');
    return u.toString();
  }catch(e){ return location.href; }
}
function installNow(){
  if(!installPrompt) return;
  var p = installPrompt;
  installPrompt = null;
  p.prompt();
  var done = function(){ state.modal = null; state.installMsg = ''; render(); };
  if(p.userChoice && p.userChoice.then) p.userChoice.then(done, done); else done();
}
/* ---- 링크 공유 ----
   휴대폰에서는 카카오톡 등으로 바로 보내고, 그게 안 되면 주소를 복사한다. */
var shareToastTimer = null;
function showShareToast(msg){
  state.shareToast = msg;
  render();
  if(shareToastTimer) clearTimeout(shareToastTimer);
  shareToastTimer = setTimeout(function(){ state.shareToast = ''; render(); }, 3000);
}
function shareLink(){
  // 새로고침용으로 붙은 표시(?v=...)는 빼고 깔끔한 주소만 보낸다
  var url;
  try{ url = location.origin + location.pathname; }catch(e){ url = location.href; }

  if(navigator.share){
    navigator.share({
      title: 'K-STAR 현황판',
      text: '계명대학교 태권도 시범단 역량관리 — 내 K-STAR 단계와 다음 목표를 확인하세요.',
      url: url
    }).catch(function(){ /* 사용자가 취소한 경우 */ });
    return;
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){
      showShareToast('링크를 복사했어요. 단톡방에 붙여넣어 주세요.');
    }, function(){
      window.prompt('아래 주소를 복사해 주세요', url);
    });
    return;
  }
  window.prompt('아래 주소를 복사해 주세요', url);
}

function copyInstallUrl(){
  var url = installUrl();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){
      state.installMsg = '주소를 복사했습니다. 크롬(또는 사파리) 주소창에 붙여넣어 주세요.';
      render();
    }).catch(function(){ window.prompt('아래 주소를 복사해 브라우저에 붙여넣어 주세요', url); });
  } else {
    window.prompt('아래 주소를 복사해 브라우저에 붙여넣어 주세요', url);
  }
}
function openInBrowser(){
  var w = null;
  try{ w = window.open(installUrl(), '_blank', 'noopener'); }catch(e){}
  if(w) return;
  state.installMsg = '새 창이 막혀 있어 주소를 복사합니다.';
  copyInstallUrl();
}
function doInstall(){
  if(installPrompt){ installNow(); return; }
  navGo(function(){ state.modal = { type:'install' }; state.installMsg = ''; });
}

/* ---- 새 버전 확인 ----
   앱을 홈 화면에 설치해 두면 기기가 옛 화면을 계속 들고 있는 경우가 있다.
   서버에 올라온 판 번호를 직접 확인해서, 다르면 새로고침 띠를 띄운다. */
async function checkForUpdate(){
  try{
    var res = await fetch('index.html?_=' + Date.now(), { cache:'no-store' });
    if(!res.ok) return;
    var text = await res.text();
    var m = text.match(/var APP_VERSION = '([^']*)'/);
    if(m && m[1] && m[1] !== APP_VERSION && state.newVersion !== m[1]){
      state.newVersion = m[1];
      render();
    }
  }catch(e){ /* 인터넷이 없으면 그냥 넘어간다 */ }
}
function reloadForUpdate(){
  // 주소를 살짝 바꿔서 저장해 둔 화면 대신 새로 받아오게 한다
  try{
    var u = new URL(location.href);
    u.searchParams.set('v', Date.now());
    location.replace(u.toString());
  }catch(e){ location.reload(); }
}
function updateBar(){
  if(!state.newVersion) return '';
  return '<div class="updbar">' +
    '<span>새 버전이 나왔습니다 (' + esc(state.newVersion) + ')</span>' +
    '<button data-action="do-update">지금 새로고침</button>' +
  '</div>';
}

/* ---- 뒤로가기(안드로이드 back) 처리 ----
   화면을 옮길 때마다 기록을 남겨서, 기기의 뒤로가기가 앱을 닫지 않고 전 단계로 가도록 함 */
function navSnapshot(){
  return { k:'kstar', mode:state.mode, role:state.role, view:state.view,
           guideRole:state.guideRole, detailId:state.detailId,
           modal:state.modal ? { type:state.modal.type, id:state.modal.id } : null };
}
function navApply(s){
  state.mode = s.mode; state.role = s.role; state.view = s.view;
  state.guideRole = s.guideRole; state.detailId = s.detailId; state.modal = s.modal;
  state.formError = '';
}
// 화면이 바뀔 때마다(앞으로 가든 돌아가든) 기록을 하나씩 쌓는다.
// history.back()은 직접 부르지 않는다 — 아티팩트처럼 화면 안에 끼워 넣어진 환경에서는
// 바깥 페이지를 건드려 앱이 통째로 닫힐 수 있기 때문.
function navSet(mutate){
  if(mutate) mutate();
  state.formError = '';
  try{ history.pushState(navSnapshot(), ''); }catch(e){}
  render(); window.scrollTo(0,0);
}
var navGo = navSet, navBack = navSet;
function navReplace(mutate){     // 같은 자리에서 내용만 교체
  if(mutate) mutate();
  try{ history.replaceState(navSnapshot(), ''); }catch(e){}
  render();
}
function navReset(){             // 로그인/로그아웃 등 처음 상태로
  try{ history.replaceState(navSnapshot(), ''); }catch(e){}
  render(); window.scrollTo(0,0);
}
window.addEventListener('popstate', function(e){
  if(e.state && e.state.k === 'kstar'){ navApply(e.state); }
  else { state.mode='app'; state.view = session() ? 'list' : 'login'; state.modal=null; }
  render(); window.scrollTo(0,0);
});

/* ============ shell ============ */
function renderApp(){
  var sess = session();
  var body;
  if(!sess) body = state.view==='register' ? screenRegister() : screenLogin();
  else if(state.role==='student') body = renderStudent();
  else body = renderAdmin();
  var wide = sess && state.role==='admin' && state.view!=='detail' && state.view!=='profile';

function field(id, label, type, opts){
  opts = opts||{};
  var attrs = 'id="'+id+'" type="'+type+'"';
  if(opts.required) attrs += ' required';
  if(opts.placeholder) attrs += ' placeholder="'+esc(opts.placeholder)+'"';
  if(opts.value!=null && opts.value!=='') attrs += ' value="'+esc(opts.value)+'"';
  if(opts.min) attrs += ' minlength="'+opts.min+'"';
  if(type==='number') attrs += ' min="0"';
  return '<div class="field"><label for="'+id+'">'+label+'</label>' +
         '<input class="'+(opts.mono?'mono':'')+'" '+attrs+'>' +
         (opts.hint ? '<span class="hint">'+opts.hint+'</span>' : '') + '</div>';
}

// 현황판에 보이는 순서(S→T→A→R, 각 단계 안에서는 다음 단계에 가까운 순)
var TILE_PICK = {
  R: function(s,a){ return currentStage(s,a) === 'R'; },
  A: function(s,a){ return currentStage(s,a) === 'A'; },
  T: function(s,a){ return currentStage(s,a) === 'T'; },
  S: function(s,a){ return a.achievedCount >= 1; },
  none: function(s,a){ return !currentStage(s,a); }
};
var TILE_LABEL = { R:'R단계까지 인증한', A:'A단계까지 인증한', T:'T단계까지 인증한',
                   S:'S단계 도전 가능', none:'아직 인증 전인' };

function boardGroups(){
  var q = (state.search||'').toLowerCase();
  var pick = TILE_PICK[state.tileFilter];
  var filtered = cache.roster.filter(function(s){
    if(q && (s.name||'').toLowerCase().indexOf(q)===-1) return false;
    if(state.yearFilter && String(num(s.year))!==state.yearFilter) return false;
    if(pick && !pick(s, analyze(s))) return false;
    if(state.updFilter === 'new'   && !isFresh(s)) return false;
    if(state.updFilter === 'today' && !isToday(s)) return false;
    return true;
  });
  var groups = { R:[], A:[], T:[], S:[] };
  filtered.forEach(function(s){ groups[stageOf(s, analyze(s)).stage].push(s); });
  Object.keys(groups).forEach(function(k){
    groups[k].sort(function(x,y){
      var ax = analyze(x), ay = analyze(y);
      if(k==='S' && ay.achievedCount!==ax.achievedCount) return ay.achievedCount-ax.achievedCount;
      return bestGapArea(ax).gap - bestGapArea(ay).gap;
    });
  });
  return groups;
}
function orderedIds(){
  var g = boardGroups();
  return ['S','T','A','R'].reduce(function(acc,k){
    return acc.concat(g[k].map(function(s){ return s.id; }));
  }, []);
}

}

function parseImport(text){
  text = (text||'').trim();
  if(!text) throw new Error('붙여넣은 내용이 없습니다.');
  var rows;
  var looksJson = /^[\[{]/.test(text);
  try{
    var j = JSON.parse(text);
    rows = Array.isArray(j) ? j : [j];
  }catch(e){
    if(looksJson){
      throw new Error('붙여넣은 내용이 중간에서 잘렸거나 앞뒤에 다른 글자가 섞였습니다. ' +
        '[ 로 시작해 ] 로 끝나도록 전체를 다시 복사해 붙여넣어 주세요.');
    }
    rows = text.split('\n').map(function(line){
      var t = line.trim();
      if(!t || /^이름/.test(t)) return null;
      var c = t.split(/[,\t]+|\s{2,}/).map(function(x){ return x.trim(); })
               .filter(function(x){ return x !== ''; });
      if(c.length < 5) return null;
      return { name:c[0], F:c[1], A:c[2], C:c[3], E:c[4], total:c[5] };
    }).filter(Boolean);
  }
  if(!rows.length) throw new Error('읽을 수 있는 줄이 없습니다. 형식을 확인해 주세요.');
  return rows;
}

async function doImport(){
  var box = document.getElementById('importText');
  var rows;
  try{ rows = parseImport(box ? box.value : ''); }
  catch(e){ state.formError = errMsg(e); render(); return; }

  state.formError=''; state.importResult=''; state.importBusy=true;
  var updated=0, added=0, skipped=[];

  for(var i=0;i<rows.length;i++){
    var r = rows[i] || {};
    var name = String(r.name||'').trim();
    if(!name) continue;
    if(/["'{}\[\]:\\]/.test(name)){
      skipped.push(name.slice(0,20) + ' (이름에 기호가 섞여 있어 건너뜀)');
      continue;
    }
    state.importProgress = (i+1)+' / '+rows.length+' 반영 중…';
    render();

    var patch = { updatedAt: nowIso() };
    ['total','F','A','C','E','year'].forEach(function(k){
      if(r[k] !== undefined && r[k] !== null && r[k] !== '') patch[k] = num(r[k]);
    });
    ['r1','r2','r3','certA','certT','certS'].forEach(function(k){
      if(typeof r[k] === 'boolean') patch[k] = r[k];
    });
    ['major','role','note'].forEach(function(k){
      if(typeof r[k] === 'string' && r[k] !== '') patch[k] = r[k];
    });

    var hit = cache.roster.filter(function(x){ return x.name === name; });
    try{
      if(hit.length === 1){
        await storeUpdate('roster', hit[0].id, patch);
        updated++;
      } else if(hit.length === 0){
        var base = { name:name, major:'태권도학과', year:1, role:'',
          r1:false, r2:false, r3:false, certA:false, certT:false, certS:false,
          total:0, F:0, A:0, C:0, E:0, note:'', claimedBy:null };
        for(var k in patch) base[k] = patch[k];
        await storeSet('roster', slugFor(name, ''), base);
        added++;
      } else {
        skipped.push(name + ' (같은 이름 ' + hit.length + '명)');
      }
    }catch(e){
      skipped.push(name + ' (' + errMsg(e) + ')');
    }
  }

  try{ await loadRoster(); }catch(e){}
  state.importBusy = false; state.importProgress = '';
  state.importResult = '반영 완료 — 수정 <b>'+updated+'명</b>, 새로 추가 <b>'+added+'명</b>' +
    (skipped.length ? '<br>건너뜀: ' + esc(skipped.join(', ')) : '');
  if(box) box.value = '';
  render();
}

          '<li>주소창 오른쪽의 <b>⋮ 메뉴</b>를 눌러 주세요.</li>' +

        '</ol>' +
        '<div class="plat-title">📱 아이폰 · 아이패드 (사파리)</div>' +
        '<ol class="install-steps">' +
          '<li>화면 아래 가운데의 <b>공유 버튼</b>을 눌러 주세요.</li>' +

      '</div></div>';
  }
  if(m.type==='confirmDelete'){

      (d.claimedBy ? '<div class="errbox">이 학생은 앱에 가입되어 있습니다. 지우면 로그인도 함께 사라집니다.</div>' : '') +
      '<div class="modal-actions">' +
        '<button class="btn btn-ghost" data-action="close-modal">취소</button>' +
        '<button class="btn btn-danger" data-action="confirm-delete" data-id="'+esc(m.id)+'">삭제</button>' +
      '</div></div></div>';
  }
  if(m.type==='confirmReset'){

      '<h3>비밀번호를 초기화할까요?</h3>' +

      '</div></div></div>';
  }
  return '';
}

/* 실적 승인 마감까지 남은 날짜 안내 */
function daysUntil(iso){
  var ms = new Date(iso).getTime() - Date.now();
  return Math.ceil(ms / 86400000);
}
function deadlineBox(compact){
  var vd = daysUntil(SEMESTER.visitEnd);
  if(vd < 0) return '';
  var od = daysUntil(SEMESTER.onlineEnd);
  var os = daysUntil(SEMESTER.onlineStart);
  var urgent = vd <= 21;
  var line;
  if(od >= 0 && os <= 0) line = '온라인 승인신청도 <b>' + od + '일</b> 남았습니다.';
  else if(os > 0) line = '온라인 승인신청은 11월 23일부터 3주간 열립니다.';
  else line = '온라인 승인신청 기간은 끝났습니다. 이제 방문 승인만 가능합니다.';
  return '<div class="notice-box" style="margin-bottom:14px;' +
    (urgent ? 'border-color:var(--danger-border);background:var(--danger-bg);color:var(--danger);' :
              'border-color:var(--amber-border);background:var(--amber-bg);color:var(--amber);') + '">' +
    '<b>' + esc(SEMESTER.name) + ' 실적 승인 마감까지 ' + vd + '일</b>' +
    ' — 자격증·봉사·수상 실적은 <b>2026. 12. 28.(월) 16:00</b>까지 EDWARD에 입력하고 승인까지 받아야 이번 학기 점수에 들어갑니다. ' + line +
    (compact ? '' : '<br><span style="font-size:11.5px;opacity:.85;">' + esc(SEMESTER.visitText) + ' · ' + esc(SEMESTER.onlineText) + '</span>') +
    '</div>';
}

  var q = (state.certSearch || '').trim().toLowerCase();

/* ============ data loading ============ */
function slugFor(name, id){
  return 'm_' + (id || String(Date.now()).slice(-8)) + '_' + Math.random().toString(36).slice(2,6);
}
async function loadRoster(){ cache.roster = await storeAll('roster'); }
async function loadMe(){
  var sess = state.studentSession;
  if(!sess) return;
  var me = sess.rosterId ? await storeGet('roster', sess.rosterId) : null;
  if(!me && !apiMode){
    // 가리키던 기록이 사라졌거나 잘못 연결된 경우, 학번·이름으로 다시 찾아 이어붙인다
    var roster = await storeAll('roster');
    var fix = roster.find(function(r){ return r.claimedBy === sess.id; })
           || roster.find(function(r){ return sameName(r.name, sess.name) && !r.claimedBy; });
    if(fix){
      if(!fix.claimedBy) await storeUpdate('roster', fix.id, { claimedBy: sess.id, updatedAt: nowIso() });
      await storeUpdate('students', sess.id, { rosterId: fix.id });
      sess.rosterId = fix.id;
      setSession('student', sess);
      me = fix;
    }
  }
  cache.me = me;
}

/* ============ auth actions ============ */
async function doLogin(role, id, pw){
  if(apiMode){
    // 비밀번호 확인은 서버가 한다. 앱은 비밀번호 해시를 내려받지 않는다.
    var r = await apiCall('login', { role:role, id:id, password:pw });
    state.formError=''; state.formOk=''; state.view='list';
    if(role==='student'){
      setSession('student', { id:id, name:r.name, rosterId:r.rosterId, token:r.token });
      await loadMe();
    } else {
      setSession('admin', { id:id, name:r.name, token:r.token });
      await loadRoster();
    }
    navReset();
    return;
  }
  // 서버 없이 이 기기에만 저장하는 모드(미리보기)
  var col = role==='student' ? 'students' : 'admins';
  var doc = await storeGet(col, id);
  var label = role==='student' ? '학번' : '관리자 번호';
  if(!doc){ state.formError = '등록되지 않은 '+label+'이에요. 처음이시라면 비밀번호 설정하기를 눌러주세요.'; render(); return; }
  var hash = await sha256Hex(pw);

}

async function doRegisterStudent(id, name, dept, year, pw, pw2){

/* ============ csv ============ */
function toCsv(rows){
  return rows.map(function(r){
    return r.map(function(c){
      var v = String(c==null?'':c);
      return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
    }).join(',');
  }).join('\n');
}
async function exportCsv(){
  var head = ['이름','학번','학년','학과','R자소서','R계획서','R상담','A인증','T인증','S인증','총점','F','A','C','E','단계','메모'];
  var rows = cache.roster.map(function(s){
    var st = stageOf(s, analyze(s));
    return [s.name, s.claimedBy||'', num(s.year), s.major||'',
      s.r1?'O':'', s.r2?'O':'', s.r3?'O':'', s.certA?'O':'', s.certT?'O':'', s.certS?'O':'',
      num(s.total), num(s.F), num(s.A), num(s.C), num(s.E), st.stage, s.note||''];
  });
  var csv = '﻿' + toCsv([head].concat(rows));
  var filename = 'K-STAR_현황_' + new Date().toISOString().slice(0,10) + '.csv';
  try{
    var downloads = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if(downloads){ await downloads.save({ filename:filename, data:csv }); return; }
  }catch(e){}
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}


/* ---- 캡쳐 첨부하기 ----
   글자 읽기는 학생 휴대폰 안에서 끝납니다. 사진이 서버로 나가지 않습니다.
   (Tesseract 글자인식기를 처음 한 번만 내려받아 쓰고, 그 뒤로는 저장돼 있어 바로 동작합니다) */

var TESS = {
  js:     'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
  worker: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
  core:   'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1/',
  lang:   'https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int'
};

// 글자를 또렷하게 읽으려면 가로 1200px 안팎이 가장 낫다. 작으면 키우고 크면 줄인다.
function scaleImage(file, targetW){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error('이미지를 읽지 못했습니다.')); };
    reader.onload = function(){
      var img = new Image();
      img.onerror = function(){ reject(new Error('이미지를 열지 못했습니다.')); };
      img.onload = function(){
        var w = img.width, h = img.height;
        if(w && w !== targetW){ h = Math.round(h * targetW / w); w = targetW; }
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        var ctx = cv.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', 0.9));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function loadScriptOnce(src){
  if(window.Tesseract) return Promise.resolve();
  if(loadScriptOnce._p) return loadScriptOnce._p;
  loadScriptOnce._p = new Promise(function(resolve, reject){
    var el = document.createElement('script');
    el.src = src;
    el.onload = function(){ resolve(); };
    el.onerror = function(){
      loadScriptOnce._p = null;
      reject(new Error('글자인식기를 내려받지 못했습니다. 인터넷 연결을 확인해 주세요.'));
    };
    document.head.appendChild(el);
  });
  return loadScriptOnce._p;
}

// 만들어 둔 인식기는 다시 쓴다 (두 번째부터는 곧바로 읽는다)
var tessWorker = null;
async function getTessWorker(onNote){
  if(tessWorker) return tessWorker;
  onNote('글자인식기를 준비하는 중입니다… 처음 한 번만 약 6MB를 내려받습니다.');
  await loadScriptOnce(TESS.js);
  tessWorker = await window.Tesseract.createWorker('eng', 1, {
    workerPath: TESS.worker, corePath: TESS.core, langPath: TESS.lang, gzip: true,
    logger: function(m){
      if(m && m.status === 'recognizing text'){
        onNote('점수를 읽는 중입니다… ' + Math.round((m.progress||0)*100) + '%');
      }
    }
  });
  return tessWorker;   // 읽을 때마다 무엇을 찾는지에 맞춰 설정을 바꾼다
}

/* STORY+ 역량 대시보드는 영역마다 [기준점수, 나의 점수, 점수차] 가 이 순서로 나온다.
   점수차 = 나의 점수 − 기준점수 이므로, 이 관계가 맞는 묶음만 믿는다.
   (빼기 기호가 흐리게 찍혀 안 읽힐 때가 있어 부호는 빼고 크기만 본다) */
var SHOT_BASES = [['F',350],['A',200],['C',280],['E',720]];
function tripleOk(base, mine, diff){
  return mine >= 0 && Math.abs(diff) === Math.abs(mine - base);
}
function readDashboard(nums){
  var got = {}, found = 0;
  SHOT_BASES.forEach(function(t){
    for(var i=0; i+2<nums.length; i++){
      if(nums[i] === t[1] && tripleOk(nums[i], nums[i+1], nums[i+2])){
        got[t[0]] = nums[i+1]; found++; return;
      }
    }
  });
  if(found === 4) return got;

  // 학과가 달라 기준점수가 다를 수 있으니, 관계가 맞는 묶음을 순서대로 F·A·C·E 에 넣는다
  var trips = [];
  for(var j=0; j+2<nums.length; j++){
    if(nums[j] >= 50 && tripleOk(nums[j], nums[j+1], nums[j+2])){ trips.push(nums[j+1]); j += 2; }
  }
  if(trips.length === 4) return { F:trips[0], A:trips[1], C:trips[2], E:trips[3] };

  return found ? got : null;     // 넷을 다 못 찾으면 찾은 것만이라도 돌려준다
}

// 인식 결과에서 낱말을 위치와 함께 꺼낸다
function wordsOf(data){
  var out = [];
  (data.blocks || []).forEach(function(b){
    (b.paragraphs || []).forEach(function(p){
      (p.lines || []).forEach(function(l){
        (l.words || []).forEach(function(w){ if(w && w.text && w.bbox) out.push(w); });
      });
    });
  });
  return out;
}

// 숫자만 순서대로
function numbersFrom(data){
  var words = wordsOf(data).map(function(w){ return w.text; });
  var text = words.length ? words.join(' ') : (data.text || '');
  var out = [], re = /[+-]?\d+/g, m;
  while((m = re.exec(text))){
    var v = parseInt(m[0], 10);
    if(!isNaN(v)) out.push(v);
  }
  return out;
}

/* "Compass K 총점   97 점" 화면에서 총점을 읽는다.
   한글은 읽지 못하지만 "Compass" 는 영문이라 이것을 이정표로 삼는다.
   "총점"·"점" 같은 한글이 숫자처럼 뭉개져 나오므로,
   이정표 낱말 자신은 빼고 같은 줄의 "가장 오른쪽" 숫자를 택한다. */
function readTotal(data){
  var words = wordsOf(data);
  var anchor = null, ai = -1;
  for(var i = 0; i < words.length; i++){
    var letters = String(words[i].text).replace(/[^A-Za-z]/g, '').toLowerCase();
    if(letters.indexOf('compass') > -1){ anchor = words[i]; ai = i; break; }
  }
  if(!anchor) return null;

  var ab = anchor.bbox;
  var ay = (ab.y0 + ab.y1) / 2;
  var h  = Math.max(10, ab.y1 - ab.y0);
  var best = null, bestX = -Infinity;
  for(var j = 0; j < words.length; j++){
    if(j === ai) continue;
    var b = words[j].bbox;
    var m = String(words[j].text).match(/\d{1,4}/);
    if(!m) continue;
    if(Math.abs((b.y0 + b.y1) / 2 - ay) > h * 1.6) continue;   // 같은 줄
    if(b.x0 <= ab.x1) continue;                                 // 이정표 오른쪽
    if(b.x0 > bestX){ bestX = b.x0; best = m[0]; }
  }
  if(best === null) return null;
  var n = parseInt(best, 10);
  return (isFinite(n) && n >= 0 && n <= 5000) ? n : null;
}

var WL_NUM  = '0123456789-+';
var WL_WORD = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

async function ocrShot(dataUrl, onNote){
  var worker = await getTessWorker(onNote);

  // 1차 — 숫자만 읽어 FACE 표를 찾는다
  onNote('점수를 읽는 중입니다…');
  await worker.setParameters({ tessedit_char_whitelist: WL_NUM, tessedit_pageseg_mode: '11' });
  var face = readDashboard(numbersFrom((await worker.recognize(dataUrl, {}, { blocks:true })).data));
  if(face) return { face: face, total: null };

  // FACE 표가 아니면 "Compass K 총점" 화면인지 본다
  onNote('총점을 찾는 중입니다…');
  await worker.setParameters({ tessedit_char_whitelist: WL_WORD, tessedit_pageseg_mode: '11' });
  var total = readTotal((await worker.recognize(dataUrl, {}, { blocks:true })).data);
  return { face: null, total: total };
}

function fillScoreForm(v){
  var filled = [];
  function setNum(id, val, label){
    if(val === null || val === undefined || val === '') return;
    var el = document.getElementById(id);
    if(el){ el.value = num(val); filled.push(label); }
  }
  function setChk(id, val, label){
    if(val !== true && val !== false) return;
    var el = document.getElementById(id);
    if(el){ el.checked = val; filled.push(label); }
  }
  setNum('sTotal', v.total, '총점');
  AREAS.forEach(function(x){ setNum('s'+x, v[x], x); });
  setChk('sr1', v.r1, '자기소개서'); setChk('sr2', v.r2, '학업계획서'); setChk('sr3', v.r3, '교수상담');
  setChk('scA', v.certA, 'A인증'); setChk('scT', v.certT, 'T인증'); setChk('scS', v.certS, 'S인증');
  return filled;
}

// 캡쳐 원본은 서버가 받아 줄 때만 보관한다. 못 받아도 학생 화면은 그대로 동작한다.
// 여러 장을 한꺼번에 올릴 수 있으므로, 서로 덮어쓰지 않게 차례차례 보낸다.
var archiveQueue = Promise.resolve();
function archiveShot(dataUrl){
  if(!apiMode || !state.studentSession) return;
  archiveQueue = archiveQueue.then(function(){
    return apiCall('analyze', { dataUrl: dataUrl, name: (cache.me && cache.me.name) || 'capture' })
      .then(function(out){
        if(!out || !out.fileId) return;
        var shots = ((cache.me && cache.me.shots) || []).concat([{ fileId: out.fileId, at: nowIso() }]);
        return storeUpdate('roster', state.studentSession.rosterId, { shots: shots }).then(loadMe);
      });
  }).catch(function(){ /* 보관은 덤이라 실패해도 알리지 않는다 */ });
}

var MAX_SHOTS = 6;      // 한 번에 올릴 수 있는 장수

async function handleShots(fileList){
  var files = Array.prototype.slice.call(fileList || [], 0, MAX_SHOTS);
  if(!files.length || state.shotBusy) return;
  state.shotBusy = true;

  var many = files.length > 1;
  var note = function(msg){ state.shotMsg = msg; render(); };
  var merged = {};

  try{
    for(var i = 0; i < files.length; i++){
      var head = many ? (i+1) + '/' + files.length + '장 — ' : '';
      note(head + '캡쳐를 준비하는 중입니다…');
      var dataUrl = await scaleImage(files[i], 1200);
      var out = await ocrShot(dataUrl, (function(h){
        return function(m){ note(h + m); };
      })(head));
      // 먼저 읽은 값을 남기고, 아직 못 찾은 것만 채워 넣는다
      if(out.face){
        AREAS.forEach(function(x){
          if(merged[x] === undefined && out.face[x] !== undefined) merged[x] = out.face[x];
        });
      }
      if(out.total !== null && out.total !== undefined && merged.total === undefined){
        merged.total = out.total;
      }
      archiveShot(dataUrl);
    }

    var got  = AREAS.filter(function(x){ return merged[x] !== undefined; });
    var miss = AREAS.filter(function(x){ return merged[x] === undefined; });
    var labels = got.slice();
    if(merged.total !== undefined) labels.push('COMpass K 총점');

    if(labels.length){
      fillScoreForm(merged);
      state.shotMsg =
        (many ? files.length + '장에서 ' : '캡쳐에서 ') + labels.join(', ') +
        ' 을(를) 읽어 채웠습니다. 맞는지 확인하고 저장해 주세요.' +
        (miss.length ? ' (' + miss.join(', ') + '영역은 못 찾았습니다 — 그 부분이 보이는 캡쳐를 더 올리거나 직접 입력해 주세요)' : '');
      render();
      fillScoreForm(merged);          // 다시 그린 뒤에도 값이 남도록
    }else{
      state.shotMsg = '점수를 찾지 못했습니다. ' +
        'STORY+ 역량 대시보드에서 F·A·C·E 칸이 보이게 캡쳐해 주시거나, 직접 입력해 주세요.';
      render();
    }
  }catch(e){
    state.shotMsg = errMsg(e);
    render();
  }finally{
    state.shotBusy = false;
  }
}

      var sess = session();
      if(apiMode){
        // 현재 비밀번호 확인과 저장을 서버가 한 번에 한다
        var nm = f.querySelector('#pName').value.trim();
        var np = f.querySelector('#pNewPw').value;
        if(np && np.length<6){ state.formError='새 비밀번호는 6자 이상이어야 해요.'; render(); return; }
        await apiCall('saveProfile', {
          curPassword: f.querySelector('#pCurPw').value,
          newPassword: np || '',
          name: nm,
          major: isStudent ? f.querySelector('#pDept').value.trim() : '',
          year:  isStudent ? num(f.querySelector('#pYear').value) : 0
        });
        setSession(state.role, Object.assign({}, sess, { name:nm }));
        if(isStudent) await loadMe();
        navBack(function(){ state.view='list'; state.formError=''; });
        return;
      }
      var doc = await storeGet(col, sess.id);
      var curHash = await sha256Hex(f.querySelector('#pCurPw').value);
      if(curHash !== doc.passwordHash){ state.formError='현재 비밀번호가 올바르지 않아요.'; render(); return; }
      var name = f.querySelector('#pName').value.trim();
      var patch = { name:name };
      var newPw = f.querySelector('#pNewPw').value;
      if(newPw){
        if(newPw.length<6){ state.formError='새 비밀번호는 6자 이상이어야 해요.'; render(); return; }
        patch.passwordHash = await sha256Hex(newPw);
      }
      await storeUpdate(col, sess.id, patch);
      if(isStudent){
        await storeUpdate('roster', sess.rosterId, {
          name:name, major:f.querySelector('#pDept').value.trim(),
          year:num(f.querySelector('#pYear').value), updatedAt:nowIso()
        });
        setSession('student', { id:sess.id, name:name, rosterId:sess.rosterId });
        await loadMe();
      } else {
        setSession('admin', { id:sess.id, name:name });
      }
      navBack(function(){ state.view='list'; state.formError=''; });
    })().catch(failWith);
  }
  if(f.id==='form-admin-code'){
    e.preventDefault();
    (async function(){
      var code = f.querySelector('#acCode').value.trim();
      await storeSet('config','app',{ adminCode:code, updatedAt:nowIso() });
      navBack(function(){ state.view='list'; state.formError=''; });
    })().catch(failWith);
  }
  if(f.id==='form-admin-edit'){
    e.preventDefault();
    (async function(){
      var patch = {
        r1:f.querySelector('#ar1').checked, r2:f.querySelector('#ar2').checked, r3:f.querySelector('#ar3').checked,
        certA:f.querySelector('#acA').checked, certT:f.querySelector('#acT').checked, certS:f.querySelector('#acS').checked,
        year:num(f.querySelector('#aYearBox').value), total:num(f.querySelector('#aTotal').value),
        note:f.querySelector('#aNote').value.trim(), updatedAt:nowIso()
      };
      AREAS.forEach(function(x){ patch[x] = num(f.querySelector('#a'+x).value); });
      await storeUpdate('roster', state.detailId, patch);
      await loadRoster();
      render();
    })().catch(failWith);
  }
});

function refreshBoard(){
  var wrap = document.getElementById('boardWrap');
  if(wrap) wrap.innerHTML = boardHtml();
}
document.addEventListener('input', function(e){
  if(e.target.id === 'adminSearch'){ state.search = e.target.value; refreshBoard(); }
  if(e.target.id === 'certSearch'){
    state.certSearch = e.target.value;
    var cw = document.getElementById('certWrap');
    if(cw) cw.innerHTML = certListHtml();
  }
});
document.addEventListener('change', function(e){
  if(e.target.id==='adminYear'){ state.yearFilter = e.target.value; refreshBoard(); }
});

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var act = el.dataset.action;

  if(act==='set-role'){ navReplace(function(){ state.role = el.dataset.role; state.view='login'; state.formError=''; }); }
  else if(act==='goto-register'){ navGo(function(){ state.view='register'; }); }
  else if(act==='goto-login'){ navBack(function(){ state.view='login'; state.formError=''; }); }
  else if(act==='goto-list'){ navBack(function(){ state.view='list'; state.formError=''; }); }
  else if(act==='goto-scores'){ navGo(function(){ state.view='scores'; }); }
  else if(act==='goto-profile'){ navGo(function(){ state.view='profile'; }); }
  else if(act==='logout'){
    if(apiMode && authToken()) apiCall('logout', {}).catch(function(){});
    setSession(state.role, null); state.view='login';
    cache.me=null; cache.roster=[]; navReset();
  }
  else if(act==='open-guide'){ navGo(function(){ state.mode='guide'; state.guideRole = state.role==='admin'?'admin':'student'; }); }
  else if(act==='open-certs'){ navGo(function(){ state.mode='guide'; state.guideRole='cert'; }); window.scrollTo(0,0); }
  else if(act==='close-guide'){ navBack(function(){ state.mode='app'; }); }
  else if(act==='set-guide-role'){ navReplace(function(){ state.guideRole = el.dataset.role; }); window.scrollTo(0,0); }
  else if(act==='open-detail'){ navGo(function(){ state.detailId = el.dataset.id; state.view='detail'; }); }
  else if(act==='share-link'){ shareLink(); }
  else if(act==='do-update'){ reloadForUpdate(); }
  else if(act==='install'){ doInstall(); }
  else if(act==='do-install'){ installNow(); }
  else if(act==='open-browser'){ openInBrowser(); }
  else if(act==='copy-url'){ copyInstallUrl(); }
  else if(act==='sib-prev'){ gotoSibling(-1); }
  else if(act==='sib-next'){ gotoSibling(1); }
  else if(act==='copy-notice'){
    var mm = new Date().getMonth() + 1;
    var dd = daysUntil(SEMESTER.visitEnd);
    var msg =
      '[K-STAR 현황판] ' + mm + '월 점수 올리기\n\n' +
      '이번 달 역량 점수를 올려 주세요. 1분이면 끝납니다.\n\n' +
      '1) 계명스튜던트포털(STORY+) 접속\n' +
      '2) 역량관리 → 역량 대시보드\n' +
      '3) COMpass K 총점과 F·A·C·E 점수 확인\n' +
      '4) 아래 링크에서 "내 점수 입력·수정하기"\n\n' +
      'https://kmutkddemoteam.vercel.app\n\n' +
      '처음이면 "비밀번호 설정하기"로 등록하세요.\n' +
      '이름이 명단에 있으면 기존 기록을 그대로 이어받습니다.\n\n' +
      '※ 2026-2학기 실적 승인 마감 — 2026. 12. 28.(월) 16:00' +
      (dd >= 0 ? ' (D-' + dd + ')' : '') + '\n' +
      '자격증·봉사·수상은 EDWARD에 직접 입력하고 승인까지 받아야\n' +
      '이번 학기 점수에 들어갑니다. 입력 안 하면 점수가 안 생깁니다.';
    var okMsg = function(){ alert('공지문을 복사했습니다.\n단톡방에 붙여넣어 주세요.'); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(msg).then(okMsg).catch(function(){ window.prompt('아래 내용을 복사해 주세요', msg); });
    } else { window.prompt('아래 내용을 복사해 주세요', msg); }
  }
  else if(act==='copy-roster'){
    var out = cache.roster.map(function(r){
      var o = { name:r.name, year:num(r.year), major:r.major||'', role:r.role||'',
        total:num(r.total), F:num(r.F), A:num(r.A), C:num(r.C), E:num(r.E),
        r1:!!r.r1, r2:!!r.r2, r3:!!r.r3,
        certA:!!r.certA, certT:!!r.certT, certS:!!r.certS };
      if(r.note) o.note = r.note;
      return o;
    });
    var txt = JSON.stringify(out);
    var done = function(){
      state.apiError = '';
      state.importResult = '';
      alert('명단 ' + out.length + '명을 복사했습니다.\n대화창에 붙여넣어 주세요.');
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done, function(){ window.prompt('아래 내용을 복사해 주세요', txt); });
    } else {
      window.prompt('아래 내용을 복사해 주세요', txt);
    }
  }
  else if(act==='tile-filter'){
    var tk = el.dataset.key || '';
    state.tileFilter = (state.tileFilter === tk) ? '' : tk;
    render(); window.scrollTo(0,0);
  }
  else if(act==='clear-tile'){ state.tileFilter=''; render(); }
  else if(act==='filter-upd'){
    var k = el.dataset.key || '';
    state.updFilter = (state.updFilter === k) ? '' : k;
    render(); window.scrollTo(0,0);
  }
  else if(act==='mark-seen'){
    markAllSeen();
    if(state.updFilter === 'new') state.updFilter = '';
    render(); window.scrollTo(0,0);
  }
  else if(act==='goto-import'){ navGo(function(){ state.view='import'; state.importResult=''; }); }
  else if(act==='do-import'){ doImport(); }
  else if(act==='view-shot'){
    var fid = el.dataset.file;
    navGo(function(){ state.modal = { type:'shot', dataUrl:null }; });
    apiCall('shot', { fileId: fid }).then(function(out){
      if(state.modal && state.modal.type==='shot'){ state.modal.dataUrl = out.dataUrl; render(); }
    }, function(err){
      if(state.modal && state.modal.type==='shot'){ state.modal = null; state.apiError = errMsg(err); render(); }
    });
  }
  else if(act==='reload'){
    state.apiError = ''; state.loading = true;
    render();
    loadRoster().then(function(){ state.loading = false; render(); },
                      function(err){ state.loading = false; state.apiError = errMsg(err); render(); });
  }
  else if(act==='export-csv'){ exportCsv(); }
  else if(act==='reset-pw'){ navGo(function(){ state.modal={type:'confirmReset', id:el.dataset.id}; }); }
  else if(act==='del-member'){ navGo(function(){ state.modal={type:'confirmDelete', id:el.dataset.id}; }); }
  else if(act==='confirm-delete'){
    (async function(){
      var id = el.dataset.id;
      if(apiMode){
        await apiCall('deleteMember', { id:id });
      }else{
        var s = cache.roster.find(function(x){ return x.id===id; });
        if(s && s.claimedBy) await storeDelete('students', s.claimedBy);
        await storeDelete('roster', id);
      }
      await loadRoster();
      state.modal = null;
      navBack(function(){ state.view='list'; state.detailId=null; });
    })().catch(failWith);
  }
  else if(act==='close-modal'){ navBack(function(){ state.modal=null; }); }
  // 바탕을 직접 눌렀을 때만 닫는다. 창 안을 눌러 닫히면 안 되기 때문.
  else if(act==='overlay-bg'){
    if(e.target && e.target.classList && e.target.classList.contains('overlay')){
      navBack(function(){ state.modal=null; });
    }
  }
  else if(act==='confirm-reset'){
    (async function(){
      var id = el.dataset.id;
      if(apiMode){
        await apiCall('resetStudent', { id:id });
        await loadRoster();
      }else{
        var s = cache.roster.find(function(x){ return x.id===id; });
        if(s && s.claimedBy){
          await storeDelete('students', s.claimedBy);
          await storeUpdate('roster', id, { claimedBy:null, updatedAt:nowIso() });
          await loadRoster();
        }
      }
      navBack(function(){ state.modal=null; });
    })().catch(failWith);
  }
});

/* ---- 좌우 스와이프로 학생 넘기기 ---- */
function onDetailScreen(){
  return state.mode==='app' && state.role==='admin' && state.view==='detail' && !state.modal;
}
var swipeX = null, swipeY = null;
document.addEventListener('touchstart', function(e){
  swipeX = null;
  if(!onDetailScreen() || e.touches.length !== 1) return;
  if(e.target.closest && e.target.closest('input,select,textarea,button')) return;
  swipeX = e.touches[0].clientX;
  swipeY = e.touches[0].clientY;
}, {passive:true});
document.addEventListener('touchend', function(e){
  if(swipeX === null || !onDetailScreen()) return;
  var t = e.changedTouches[0];
  var dx = t.clientX - swipeX, dy = t.clientY - swipeY;
  swipeX = null;
  if(Math.abs(dx) < 60) return;                 // 너무 짧은 움직임은 무시
  if(Math.abs(dx) < Math.abs(dy) * 1.5) return; // 위아래로 스크롤한 것은 무시
  gotoSibling(dx < 0 ? 1 : -1);                 // 왼쪽으로 밀면 다음 학생
}, {passive:true});
document.addEventListener('keydown', function(e){
  if(!onDetailScreen()) return;
  if(e.target.closest && e.target.closest('input,select,textarea')) return;
  if(e.key === 'ArrowLeft') gotoSibling(-1);
  else if(e.key === 'ArrowRight') gotoSibling(1);
});

/* ============ boot ============ */
(async function boot(){
  // 새 버전이 올라오면 설치된 앱도 저절로 최신으로 바뀌도록 한다
  try{
    if('serviceWorker' in navigator){
      var hadController = !!navigator.serviceWorker.controller;
      var reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if(!hadController || reloaded) return;   // 처음 설치될 때는 새로고침하지 않는다
        reloaded = true;
        location.reload();
      });
      navigator.serviceWorker.register('sw.js').then(function(reg){
        reg.update();
        document.addEventListener('visibilitychange', function(){
          if(document.visibilityState === 'visible') reg.update();   // 앱을 다시 열 때마다 확인
        });
      }).catch(function(){});
    }
    // 판 번호를 직접 확인한다 — 기기가 옛 화면을 들고 있어도 알아챌 수 있도록
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState === 'visible') checkForUpdate();
    });
    checkForUpdate();
  }catch(e){}
  restoreSessions();
  if(!state.studentSession && state.adminSession) state.role = 'admin';
  if(session()) state.view = 'list';
  // 브라우저에서 다시 열렸다면 설치 안내를 바로 띄운다
  try{
    if(new URLSearchParams(location.search).get('install') === '1' && !isStandalone()){
      state.modal = { type:'install' };
    }
  }catch(e){}
  try{ history.replaceState(navSnapshot(), ''); }catch(e){}
  render();
  if(API_URL){
    apiMode = true;   // 따로 확인 요청을 보내지 않는다 — 명단을 바로 불러오며 확인한다
  } else {
    try{
      if(window.claude && window.claude.use){ db = await window.claude.use('db'); }
    }catch(e){ db = null; }
    if(!db){ fallbackMode = true; loadFallback(); }
  }
  state.loading = true;
  render();
  async function loadAll(){
    if(state.adminSession) await loadRoster();
    if(state.studentSession) await loadMe();
  }
  try{
    await loadAll();
  }catch(e){
    // 로그인만 풀린 것이면 로그인 화면을 보여주면 된다. 서버 문제가 아니다.
    var recovered = state.sessionLost;
    if(!recovered && apiMode && window.claude && window.claude.use){
      // 바깥 서버에 닿지 못하는 자리(예: Claude 아티팩트 안)에서는
      // Claude 자체 저장소로 되돌아가 화면만이라도 볼 수 있게 한다.
      try{
        db = await window.claude.use('db');
        if(db){
          apiMode = false;
          state.previewMode = true;   // 실제 운영본이 아니라 미리보기임을 알린다
          await loadAll();
          recovered = true;
        }
      }catch(e2){}
    }
    if(!recovered) state.apiError = errMsg(e);
  }
  state.loading = false;
  navReplace();
})();

})();
</script>

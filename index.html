<style>
:root{
  color-scheme:light;
  /* 계명스튜던트포털(STORY+) 역량 대시보드 색을 따름 */
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EEF4FC; --surface-3:#F8FAFC;
  --border:#E6E9ED; --text:#22303F; --text-muted:#79828C; --text-faint:#9AA3AC;
  --primary:#2F62D9; --primary-dark:#1F4BB5; --primary-contrast:#FFFFFF;
  --banner:linear-gradient(90deg,#4159D0,#5FC5F2);
  --grad-1:#4A63E0; --grad-2:#5FB6EE;
  --amber:#B57A08; --amber-bg:#FDF8EC; --amber-border:#F6E3B8;
  --danger:#D32027; --danger-bg:#FDF1F1; --danger-border:#F7CFD1;
  --success:#12805A; --success-bg:#E8F6F0;
  --overlay:rgba(20,28,38,.5);
  --radius-s:8px; --radius-m:14px; --radius-l:18px;
  --shadow-card:0 1px 2px rgba(34,48,63,.05), 0 8px 22px -14px rgba(34,48,63,.2);
  --font-display:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-body:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'JetBrains Mono','SFMono-Regular',monospace;
  --face-f:#F02027; --face-f-soft:#FDF1F1; --face-f-chip:#FCE0E1;
  --face-a:#F9B213; --face-a-soft:#FDF8EC; --face-a-chip:#FBEBCB;
  --face-c:#17B3E8; --face-c-soft:#F1FAFE; --face-c-chip:#D9F0FB;
  --face-e:#8E5FD3; --face-e-soft:#F8F5FD; --face-e-chip:#EAE0F8;
  --face-f-ink:#D3181F; --face-a-ink:#B57A08; --face-c-ink:#0E88B5; --face-e-ink:#7A4BC0;
  --pyr-r:#E0524A; --pyr-a:#0E9595; --pyr-t:#6A5FC4; --pyr-s:#2F7FD1;
  --pill-r:#E0524A; --pill-a:#0E9595; --pill-t:#6A5FC4; --pill-s:#2F7FD1;
  --g-r:linear-gradient(100deg,#E0524A,#F08277); --g-a:linear-gradient(100deg,#0E9595,#40CFCB);
  --g-t:linear-gradient(100deg,#6A5FC4,#8B7FE0); --g-s:linear-gradient(100deg,#2F7FD1,#5FB6EE);
  --track:#EAEDF1;
  --gold:#B57A08; --gold-soft:#FDF8EC;
}
*{box-sizing:border-box;}
html{background:var(--bg);}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); padding:28px 16px 64px; min-height:100vh;}
h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0; font-weight:800; letter-spacing:-.01em;}
.dashbanner{background:var(--banner); color:#fff; font-size:17px; font-weight:800; text-align:center; padding:13px 16px; border-radius:var(--radius-s); margin-bottom:18px;}
.markline{background:linear-gradient(transparent 58%, var(--face-c-chip) 58%); padding:0 2px;}
button{font-family:inherit;}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
::selection{background:var(--primary); color:var(--primary-contrast);}

.page{max-width:1080px; margin:0 auto; display:flex; flex-direction:column; align-items:center; gap:18px;}
.topbar{width:100%; max-width:460px; display:flex; align-items:center; justify-content:space-between;
  gap:16px; flex-wrap:wrap; padding:20px 22px; border-radius:16px; color:#fff;
  background:linear-gradient(100deg, var(--grad-1), var(--grad-2)); box-shadow:var(--shadow-card);}
.topbar-actions{display:flex; gap:6px; margin-left:auto;}
.install-steps{counter-reset:step; display:flex; flex-direction:column; gap:10px; margin:0; padding:0; list-style:none;}
.install-steps li{position:relative; padding-left:30px; font-size:13px; line-height:1.6;}
.install-steps li::before{counter-increment:step; content:counter(step); position:absolute; left:0; top:1px;
  width:21px; height:21px; border-radius:50%; background:var(--primary); color:#fff;
  font-size:11.5px; font-weight:800; display:flex; align-items:center; justify-content:center;}
.plat-title{font-size:13px; font-weight:800; margin:16px 0 8px; display:flex; align-items:center; gap:6px;}
.plat-title:first-of-type{margin-top:6px;}
.page.wide .topbar, .page.wide .roletabs{max-width:1000px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:38px; height:38px; border-radius:11px; background:var(--primary); color:var(--primary-contrast); display:flex; align-items:center; justify-content:center; font-size:18px; flex:none;}
.brand svg{flex:none;}
.brand-text strong{display:block; font-size:19px; font-weight:900; letter-spacing:-.01em; color:#fff;}
.brand-text span{display:block; font-size:11.5px; color:rgba(255,255,255,.86); margin-top:2px; line-height:1.4; word-break:keep-all;}
.guide-link{border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.16); color:#fff;
  font-size:12.5px; font-weight:600; padding:8px 12px; border-radius:8px; cursor:pointer; white-space:nowrap;}
.guide-link:hover{background:rgba(255,255,255,.28); border-color:rgba(255,255,255,.65);}

.roletabs{width:100%; max-width:460px; display:flex; gap:8px; background:var(--surface-2); padding:5px; border-radius:999px;}
.roletab{flex:1; border:none; background:transparent; padding:9px 0; border-radius:999px; font-size:13.5px; font-weight:600; color:var(--text-muted); cursor:pointer;}
.roletab.active{background:var(--surface); color:var(--primary); box-shadow:var(--shadow-card);}

.phone{width:100%; max-width:460px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); box-shadow:var(--shadow-card); padding:24px 20px; position:relative; min-height:420px;}
.page.wide .phone{max-width:1000px;}
.eyebrow{font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint);}
.screen-title{font-size:22px; margin-top:6px; margin-bottom:4px; word-break:keep-all;}
.screen-sub{font-size:13px; color:var(--text-muted); margin-bottom:18px;}

.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
.field label{font-size:12.5px; font-weight:600; color:var(--text-muted);}
.field textarea{min-height:200px;resize:vertical;line-height:1.5;font-size:13px;}
.field input, .field select, .field textarea{border:1px solid var(--border); background:var(--surface-3); color:var(--text); border-radius:var(--radius-s); padding:11px 13px; font-size:14px; font-family:var(--font-body); width:100%;}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--primary); outline-offset:1px; background:var(--surface);}
.field .hint{font-size:11.5px; color:var(--text-faint); line-height:1.5;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.checkrow{display:flex; flex-wrap:wrap; gap:12px; margin:2px 0 16px;}
.checkrow label{display:flex; align-items:center; gap:6px; font-size:13px;}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:var(--radius-s); border:1px solid transparent; font-weight:700; font-size:14.5px; padding:12px 16px; cursor:pointer; width:100%;}
.btn-primary{background:var(--primary); color:var(--primary-contrast);}
.btn-primary:hover{background:var(--primary-dark);}
.btn-ghost{background:var(--surface-2); color:var(--primary); border-color:var(--border);}
.btn-ghost:hover{border-color:var(--primary);}
.btn-line{background:transparent; color:var(--text-muted); border:1px dashed var(--border);}
.btn-danger{background:var(--danger-bg); color:var(--danger); border-color:var(--danger-border);}
.btn-small{width:auto; padding:8px 12px; font-size:12.5px;}
.linklike{background:none; border:none; color:var(--primary); font-weight:600; font-size:12.5px; cursor:pointer; padding:0; white-space:nowrap;}
.row{display:flex; align-items:center; gap:10px;}
.row-between{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px;}
.stack{display:flex; flex-direction:column; gap:10px;}

.notice-box{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-m); padding:13px 15px; font-size:12.5px; color:var(--text-muted); line-height:1.55; margin-bottom:16px;}
.errbox{background:var(--danger-bg); border:1px solid var(--danger-border); color:var(--danger); border-radius:var(--radius-s); padding:10px 13px; font-size:12.5px; margin-bottom:14px; font-weight:600;}
.okbox{background:var(--success-bg); border:1px solid var(--border); color:var(--success); border-radius:var(--radius-s); padding:10px 13px; font-size:12.5px; margin-bottom:14px; font-weight:600;}
.empty-state{text-align:center; padding:36px 12px; color:var(--text-faint); font-size:13px;}

/* K-STAR analysis blocks */
.certrow{display:flex; align-items:center; gap:9px; margin-bottom:12px;}
.certrow .clabel{font-size:11.5px; color:var(--text-muted);}
.certbadges{display:flex; gap:5px;}
.certbadge{position:relative; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; border:2px solid var(--track); color:var(--text-faint); background:var(--surface);}
.certbadge.on{border-color:transparent; color:#fff;}
.certbadge.on.R{background:var(--pill-r);} .certbadge.on.A{background:var(--pill-a);}
.certbadge.on.T{background:var(--pill-t);} .certbadge.on.S{background:var(--pill-s);}
.rrow{display:flex; gap:6px; margin-bottom:12px;}
.rchip{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; text-align:center; padding:7px 2px; border-radius:9px; background:var(--danger-bg);}
.rchip .rlabel{font-size:11px; color:var(--text-muted);}
.rchip .rstatus{font-size:11px; font-weight:800; color:var(--danger);}
.rchip.done{background:var(--success-bg);}
.rchip.done .rlabel{color:var(--text);}
.rchip.done .rstatus{color:var(--success);}
.totalline{font-size:12px; color:var(--text-muted); margin-bottom:10px;}
.totalline b{color:var(--text);}
.facebars{display:flex; flex-direction:column; gap:9px; margin-bottom:14px;}
.facebar{display:grid; grid-template-columns:22px 1fr auto; align-items:center; gap:10px;
  border:1.5px solid transparent; border-radius:10px; padding:4px 5px;}
.facebar.rank1{background:var(--gold-soft); border-color:var(--gold); padding:9px 10px;}
.facebar.rank2{background:var(--surface-2); border-color:var(--primary); border-style:dashed; padding:9px 10px;}
.facebar .code{font-weight:800; font-size:12px; text-align:center; width:22px; height:22px;
  line-height:22px; border-radius:50%;}
.facebar .code.F{color:var(--face-f-ink); background:var(--face-f-chip);}
.facebar .code.A{color:var(--face-a-ink); background:var(--face-a-chip);}
.facebar .code.C{color:var(--face-c-ink); background:var(--face-c-chip);}
.facebar .code.E{color:var(--face-e-ink); background:var(--face-e-chip);}
.trackbar{position:relative; height:9px; border-radius:5px; background:var(--track); overflow:hidden;}
.fill{position:absolute; left:0; top:0; bottom:0; border-radius:5px;}
.fill.F{background:var(--face-f);} .fill.A{background:var(--face-a);}
.fill.C{background:var(--face-c);} .fill.E{background:var(--face-e);}
.facebar .score{font-size:11px; color:var(--text-muted); text-align:right;
  display:flex; flex-direction:column; align-items:flex-end; line-height:1.3; min-width:76px;}
.facebar .score .num{font-size:13.5px; font-weight:800; color:var(--text); font-family:var(--font-mono);}
.facebar .score .gap{font-size:12.5px; font-weight:800; color:var(--danger);}
.facebar .score .gap.met{color:var(--success);}
.facebar.rank1 .score .gap{color:var(--gold);}
.facebar.rank2 .score .gap{color:var(--primary);}
.closest{grid-column:1/-1; font-size:11.5px; font-weight:800; margin-top:1px;}
.closest.rank1{color:var(--gold);} .closest.rank2{color:var(--primary);}
.schol{display:flex; flex-direction:column; gap:8px; background:var(--gold-soft); border:1px solid var(--gold); border-radius:var(--radius-m); padding:11px 14px; margin-bottom:12px;}
.schol-row{display:flex; align-items:center; gap:11px;}
.schol-row.cmp{opacity:.65; padding-top:6px; border-top:1px dashed var(--gold);}
.schol .emo{font-size:22px; flex:none;}
.schol-row.cmp .emo{font-size:15px;}
.schol .amt{font-size:16px; font-weight:900; color:var(--gold); font-family:var(--font-mono);}
.schol-row.cmp .amt{font-size:12.5px;}
.schol .snote{font-size:11px; color:var(--gold); opacity:.9; margin-top:1px;}
.reco{font-size:13px; line-height:1.6; padding:13px 15px; border-radius:var(--radius-m); background:var(--surface-2); color:var(--text);}
.reco.ok{background:var(--gold-soft);}
.reco b{color:var(--primary);}
.reco.ok b{color:var(--gold);}
.reco .rhead{font-weight:800; display:block; margin-bottom:6px; font-size:14px;}
.reco .rsub{font-weight:700; font-size:11.5px; display:block; margin:10px 0 4px; opacity:.75; letter-spacing:.03em;}
.reco ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px;}
.reco li{padding-left:13px; position:relative;}
.reco li::before{content:"·"; position:absolute; left:0; font-weight:900;}
.reco .rfoot{display:block; margin-top:9px; opacity:.72; font-size:12px;}
.stagepill{font-size:11.5px; font-weight:700; padding:4px 11px; border-radius:999px; white-space:nowrap; color:#fff;}
.curpill{display:inline-block; font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:999px;
  margin-left:6px; color:#fff; vertical-align:middle; white-space:nowrap; letter-spacing:-.01em;}
.curpill.R{background:var(--pill-r);} .curpill.A{background:var(--pill-a);}
.curpill.T{background:var(--pill-t);} .curpill.S{background:var(--pill-s);}
.curpill.none{background:var(--surface-3); color:var(--text-faint); border:1px solid var(--border);}
.stagepill.R{background:var(--pill-r);} .stagepill.A{background:var(--pill-a);}
.stagepill.T{background:var(--pill-t);} .stagepill.S{background:var(--pill-s);}

/* admin board */
.summary{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}
.tile{background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; box-shadow:var(--shadow-card);}
.tile .band{padding:8px 14px; color:#fff; font-size:11.5px; font-weight:700; letter-spacing:.01em;}
.tile .body{padding:14px 16px 16px;}
.tile .num{font-size:30px; font-weight:700; font-family:var(--font-mono); line-height:1;}
.tile .lbl{color:var(--text-muted); font-size:11.5px; margin-top:6px; line-height:1.4;}
.tile.t-purple .band{background:linear-gradient(100deg,#6A5FC4,#8B7FE0);} .tile.t-purple .num{color:#6A5FC4;}
.tile.t-red .band{background:linear-gradient(100deg,#E0524A,#EF7A6E);}    .tile.t-red .num{color:#E0524A;}
.tile.t-blue .band{background:linear-gradient(100deg,#4A90D9,#6FB3EE);}   .tile.t-blue .num{color:#4A90D9;}
.tile.t-gold .band{background:linear-gradient(100deg,#D9A73D,#E8BE66);}   .tile.t-gold .num{color:#D9A73D;}
.controls{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.controls input, .controls select{border:1px solid var(--border); background:var(--surface-3); color:var(--text); border-radius:var(--radius-s); padding:9px 12px; font-size:13px; font-family:var(--font-body);}
.controls input{flex:1; min-width:150px;}
.board{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; align-items:start;}
@media (max-width:900px){ .board{grid-template-columns:repeat(2,minmax(0,1fr));} }
@media (max-width:560px){ .board{grid-template-columns:1fr;} }
.col h3{display:flex; align-items:center; gap:10px; font-family:var(--font-body); margin-bottom:11px;
  border-radius:var(--radius-s); padding:10px 13px; color:#fff; min-height:66px;}
.col h3 > div{flex:1; min-width:0;}
.col h3 .st-name{display:block; font-size:14px; font-weight:800; line-height:1.2;}
.col h3 .st-name, .col h3 .st-desc{word-break:keep-all;}
.col h3 .st-desc{display:block; font-size:10.5px; font-weight:500; opacity:.85; margin-top:2px;}
.col h3 .cnt{font-size:11.5px; font-weight:800; color:#fff; background:rgba(255,255,255,.25); border-radius:999px; padding:3px 9px; margin-left:auto; white-space:nowrap;}
.col.st-S h3{background:var(--g-s);} .col.st-T h3{background:var(--g-t);}
.col.st-A h3{background:var(--g-a);} .col.st-R h3{background:var(--g-r);}
.col h3 .cnt{background:rgba(255,255,255,.3);}
.dot{width:10px; height:10px; border-radius:50%; flex:none;}
.scards{display:flex; flex-direction:column; gap:9px;}
.scard{border:1px solid var(--border); border-left:4px solid var(--border); border-radius:var(--radius-m); padding:12px 13px; background:var(--surface); cursor:pointer;}
.scard:hover{border-color:var(--primary);}
.col.st-S .scard{border-left-color:var(--pill-s);} .col.st-T .scard{border-left-color:var(--pill-t);}
.col.st-A .scard{border-left-color:var(--pill-a);} .col.st-R .scard{border-left-color:var(--pill-r);}
.scard .nm{font-weight:700; font-size:14px;}
.scard .mt{font-size:11px; color:var(--text-faint); margin-top:2px;}
.scard .mini{display:flex; gap:6px; margin-top:9px;}
.mini-col{flex:1; display:flex; flex-direction:column; gap:3px;}
.mini-lbl{font-size:10px; font-weight:800; text-align:center; line-height:1;}
.mini-lbl.F{color:var(--face-f-ink);} .mini-lbl.A{color:var(--face-a-ink);}
.mini-lbl.C{color:var(--face-c-ink);} .mini-lbl.E{color:var(--face-e-ink);}
.mini-bar{display:block; height:5px; border-radius:3px; background:var(--track); position:relative; overflow:hidden;}
.mini-bar i{position:absolute; left:0; top:0; bottom:0; border-radius:3px;}
.tag{font-size:11px; color:var(--text-muted); background:var(--track); border-radius:5px; padding:2px 7px;}
.pending{font-size:11px; font-weight:700; color:var(--amber); background:var(--amber-bg); border:1px solid var(--amber-border); border-radius:999px; padding:2px 8px;}

/* 단원 넘기기 */
.pager{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.pgbtn{flex:1; border:1px solid var(--border); background:var(--surface-3); color:var(--primary); font-weight:700; font-size:13px; padding:9px 8px; border-radius:var(--radius-s); cursor:pointer;}

.pgpos{font-size:12px; font-weight:700; color:var(--text-muted); min-width:58px; text-align:center;}
.swipe-hint{font-size:11px; color:var(--text-faint); text-align:center; margin-bottom:12px;}
.stage-band{display:flex; align-items:center; gap:11px; color:#fff; border-radius:var(--radius-s); padding:11px 14px; margin-bottom:16px;}
.stage-band .sb-mark{width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:15px; flex:none;}
.stage-band .sb-name{display:block; font-size:14.5px; font-weight:800; line-height:1.2;}
.stage-band .sb-desc{display:block; font-size:11px; opacity:.88; margin-top:2px; line-height:1.4;}
.stage-band.st-S{background:var(--g-s);} .stage-band.st-T{background:var(--g-t);}
.stage-band.st-A{background:var(--g-a);} .stage-band.st-R{background:var(--g-r);}
.detail-wrap{touch-action:pan-y;}
.detail-wrap.slide-right{animation:slideR .18s ease;}
.detail-wrap.slide-left{animation:slideL .18s ease;}
@keyframes slideR{from{opacity:0; transform:translateX(16px);} to{opacity:1; transform:none;}}
@keyframes slideL{from{opacity:0; transform:translateX(-16px);} to{opacity:1; transform:none;}}
@media (prefers-reduced-motion: reduce){ .detail-wrap.slide-right,.detail-wrap.slide-left{animation:none;} }

.overlay{position:fixed; inset:0; background:var(--overlay); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
.modal{width:100%; max-width:420px; background:var(--surface); border-radius:var(--radius-l); padding:22px 20px; box-shadow:var(--shadow-card); max-height:86vh; overflow-y:auto;}
.modal h3{font-size:17px; margin-bottom:4px;}
.modal .modal-sub{font-size:12.5px; color:var(--text-muted); margin-bottom:16px;}
.modal-actions{display:flex; gap:8px; margin-top:16px;}
.modal-actions .btn{width:auto; flex:1;}

.guide-shell{width:100%; max-width:640px; display:flex; flex-direction:column; gap:18px;}

.guide-hero .eyebrow{color:rgba(255,255,255,.75);}
.guide-hero h1{font-size:28px; color:#fff; margin:8px 0 10px;}
.guide-hero p{font-size:13.5px; color:rgba(255,255,255,.88); margin:0 0 14px; line-height:1.6;}
.guide-hero .back{color:#fff; font-weight:700; font-size:13px; text-decoration:underline; background:none; border:none; cursor:pointer; padding:0;}
.guide-tabs{display:flex; gap:8px; background:var(--surface-2); padding:5px; border-radius:999px;}
.guide-tabs button{flex:1; border:none; background:transparent; padding:9px 0; border-radius:999px; font-weight:700; font-size:13px; color:var(--text-muted); cursor:pointer;}
.guide-tabs button.active{background:var(--surface); color:var(--primary); box-shadow:var(--shadow-card);}
.guide-note{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-m); padding:15px 17px; font-size:13px; line-height:1.65; color:var(--text-muted);}
.guide-note b{color:var(--text);}
.step{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); padding:24px 22px; box-shadow:var(--shadow-card);}
.step-num{width:34px; height:34px; border-radius:50%; background:var(--primary); color:var(--primary-contrast); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:15px; margin-bottom:14px;}
.step h2{font-size:20px; margin-bottom:10px;}
.step p{font-size:13.5px; line-height:1.7; margin:0 0 10px;}
.step ul{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:8px;}
.step li{font-size:13.5px; line-height:1.65;}
.gtable{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:10px;}

details.acc summary{cursor:pointer; font-weight:600; font-size:13.5px; padding:6px 0;}
.install-preview{display:flex; align-items:center; gap:14px; background:var(--surface-3);

.install-preview span{display:block; font-size:12px; color:var(--text-muted); margin-top:4px; line-height:1.55;}

.pyr-foot{font-size:11.5px; color:var(--text-muted); line-height:1.5; text-align:center; padding:2px 0 4px;}

.procbox{border:1px solid var(--border); border-radius:var(--radius-m); background:var(--surface-3); margin-bottom:14px; overflow:hidden;}
.procbox>summary{cursor:pointer; list-style:none; padding:12px 14px; font-size:13px; font-weight:800; color:var(--primary); display:flex; align-items:baseline; gap:7px; flex-wrap:wrap;}
.procbox>summary::-webkit-details-marker{display:none;}
.procbox>summary em{font-style:normal; font-size:11.5px; font-weight:600; color:var(--text-muted);}
.procbox>summary::after{content:'펼치기 ▾'; margin-left:auto; font-size:11px; font-weight:700; color:var(--text-faint); white-space:nowrap;}
.procbox[open]>summary::after{content:'접기 ▴';}
.procbody{padding:0 14px 15px; font-size:12.5px; line-height:1.6; color:var(--text);}
.proc-h{font-size:11.5px; font-weight:800; color:var(--text-faint); letter-spacing:.04em; margin:16px 0 7px;}
.proclist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px;}
.proclist li{padding-left:12px; position:relative;}
.proclist li::before{content:'·'; position:absolute; left:2px; top:-1px; font-weight:900; color:var(--text-faint);}
.proclist ul{list-style:none; margin:5px 0 0; padding:0; display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--text-muted);}

.procstep{display:grid; grid-template-columns:24px 1fr; gap:10px; padding:10px 0; border-top:1px solid var(--border);}

.procstep .mk.T{background:var(--pill-t);} .procstep .mk.S{background:var(--pill-s);}

.disclaimer{font-size:12.5px; color:var(--danger); background:var(--danger-bg); border-radius:var(--radius-s); padding:11px 13px; line-height:1.6; margin-top:10px;}

  body{padding:18px 12px 48px;}
  .guide-hero{padding:22px 18px;}
  .step{padding:19px 16px;}
  .summary{grid-template-columns:repeat(2,1fr);}
  .grid2,.grid4{grid-template-columns:1fr 1fr;}
}

async function storeGet(col, id){

  if(apiMode){ await apiCall('delete', {collection:col, id:id}); return; }
  if(db){ await db.doc(col+'/'+id).delete(); return; }
  if(fallbackData[col]) delete fallbackData[col][id];
  saveFallback();

  if(apiMode){ var r = await apiCall('all', {collection:col}); return r.docs || []; }

/* ============ analysis ============ */
function analyze(s){
  var gaps = {}, achieved = {};
  AREAS.forEach(function(a){ gaps[a] = THRESHOLDS[a] - num(s[a]); achieved[a] = gaps[a] <= 0; });
  return {
    gaps: gaps, achieved: achieved,
    achievedCount: AREAS.filter(function(a){ return achieved[a]; }).length,
    rDone: !!(s.r1 && s.r2 && s.r3)
  };
}
function bestGapArea(a){
  var best = null, bv = Infinity;
  AREAS.forEach(function(x){ if(a.gaps[x] < bv){ bv = a.gaps[x]; best = x; } });
  return { area:best, gap:bv };
}
function pickSuggestions(area){
  return FACE_GROUPS[area].rows.filter(function(r){ return r[1] !== '성적'; })
    .slice().sort(function(a,b){ return b[3]-a[3]; }).slice(0,2);
}
function actionLines(area, gap){
  return pickSuggestions(area).map(function(r){
    var guide = ACTION_GUIDE[r[0]] || r[1];
    if(HOURLY_CODES.indexOf(r[0])>-1){
      var hours = Math.max(2, Math.ceil(gap)*2);
      return guide + ' — 약 ' + hours + '시간 정도면 채울 수 있어요';
    }
    return guide;
  });
}
function stageOf(s, a){
  var stage = !a.rDone ? 'R' : (a.achievedCount>=1 ? 'S' : (num(s.year)<=2 ? 'A' : 'T'));
  // 이미 인증받은 단계를 다시 "다음 목표"로 내밀지 않는다.
  var certed = { R:a.rDone, A:!!s.certA, T:!!s.certT, S:!!s.certS };
  var next = stage;
  if(certed[stage]) next = 'S';
  if(next==='S' && a.achievedCount===0) next = 'S0';   // S를 향하지만 아직 FACE 미달
  if(s.certS) next = 'S';
  var label = stage==='R' ? 'R단계 준비중' : stage==='S' ? 'S단계 도전 가능'
            : stage==='A' ? '다음 목표: A단계' : '다음 목표: T단계';
  return { stage:stage, next:next, label:label };
}
function recommendation(s, a){
  if(!a.rDone){
    var missing = [];
    if(!s.r1) missing.push('자기소개서 작성');
    if(!s.r2) missing.push('학업계획서 작성');
    if(!s.r3) missing.push('교수상담 1회');
    return { target:'A', ok:false, html:
      '<span class="rhead">지금 할 일</span><ul>' +
      missing.map(function(m){ return '<li>'+m+'</li>'; }).join('') +
      '</ul><span class="rfoot">이 3가지를 먼저 끝내야 A·T·S단계에 도전할 수 있어요.</span>' };
  }
  var year = num(s.year)||1;
  if(a.achievedCount>=1){
    var done = AREAS.filter(function(x){ return a.achieved[x]; }).join(', ');
    return { target:'S', ok:true, html:
      '<span class="rhead">S단계 도전 가능!</span><ul>' +
      '<li><b>'+done+'영역</b> 기준 통과 완료</li>' +
      '<li>A·T단계 안 거쳐도 바로 도전 가능</li></ul>' +
      '<span class="rsub">지금부터 할 일</span><ul>' +
      '<li>STORY+ &gt; MY포트폴리오에서 이력서·자기소개서·학업계획서 작성</li>' +
      '<li>1차 합격자 발표 후, 2차 포트폴리오 심사 <b>직접 신청</b>(자동 아님, 기한 확인 필수)</li>' +
      '<li>K-STAR 면접 참여</li>' +
      '<li>학생성공지원위원회 심의 통과 시 인증 확정</li></ul>' };
  }
  if(year<=2 && !s.certA){
    var th = ARTS_PE.some(function(k){ return (s.major||'').indexOf(k)>-1; }) ? 50 : 80;
    var total = num(s.total), line;
    if(total>0 && total<th) line = 'COMpass K 점수 <b>'+total+'점</b> — <b>'+(th-total)+'점만 더</b> 채우면 A단계 기본 조건 통과';
    else if(total>=th) line = 'COMpass K 점수('+total+'점) 이미 기준 통과 — 학과 내 순위 발표 대기';
    else line = 'COMpass K 총점이 아직 입력되지 않았어요 — 역량 대시보드에서 확인해 입력해 주세요';
    return { target:'A', ok:false, html:
      '<span class="rhead">다음 목표: A단계</span><ul>' +
      '<li>'+line+'</li>' +
      '<li>A단계 장학금 25만원 · S단계는 영역당 250만원(더 큼)</li>' +
      '<li>단, 최종 선발은 점수 순위라 확정은 아님</li></ul>' +
      '<span class="rfoot">아래 FACE 영역도 함께 채우면 S단계도 노려볼 수 있어요.</span>' };
  }
  var b = bestGapArea(a);
  var lines = actionLines(b.area, b.gap).map(function(l){ return '<li>'+l+'</li>'; }).join('');
  if(year>=3 && !s.certT){
    return { target:'T', ok:false, html:
      '<span class="rhead">다음 목표: T단계</span><ul>' +
      '<li>순위 선발이라 확정 아님 · 장학금 최대 60만원</li>' +
      '<li><b>'+b.area+'영역</b> <b>'+b.gap+'점</b>만 더 채우면 완료</li>' +
      '<li>채우면 <b>S단계(영역당 250만원)</b>도 순위와 상관없이 바로 열림</li></ul>' +
      '<span class="rsub">추천 활동</span><ul>'+lines+'</ul>' };
  }
  return { target:'S', ok:false, html:
    '<span class="rhead">다음 목표: S단계</span><ul>' +
    '<li><b>'+b.area+'영역</b>을 <b>'+b.gap+'점</b> 채우면 가장 빨리 S단계 도달</li></ul>' +
    '<span class="rsub">추천 활동</span><ul>'+lines+'</ul>' +
    '<span class="rfoot">(추정 — 정확한 인정 여부는 학생성공센터에 확인)</span>' };
}

var PYR_TIERS = [
  { k:'S', color:'#3E8FD9', pts:'138,35 202,15 202,54 138,73',    lx:170, ly:44,  rot:-17.4, sy:44,  lineTo:138 },
  { k:'T', color:'#7B70D8', pts:'108,77 232,50 232,88 108,116',   lx:170, ly:83,  rot:-12.6, sy:83,  lineTo:108 },
  { k:'A', color:'#16A9A5', pts:'78,120 262,96 262,135 78,158',   lx:170, ly:127, rot:-7.4,  sy:127, lineTo:78  },

  S0:'S단계 — FACE 한 영역 채우기'
};

function pyramidHtml(s, a){
  var done = { R:a.rDone, A:!!s.certA, T:!!s.certT, S:!!s.certS };
  var cur = currentStage(s, a);
  var body = PYR_TIERS.map(function(t){

    : '아직 인증받은 단계가 없습니다 · 먼저 ' + PYR_NEXT.R;

  var letter = nxt.charAt(0);

    '<div class="pyr-foot">'+foot+'</div>' +
  '</div>';
}

function analysisHtml(s, o){
  var a = analyze(s), reco = recommendation(s,a);
  var certs = [['S',!!s.certS],['T',!!s.certT],['A',!!s.certA],['R',a.rDone]];
  var ranked = AREAS.filter(function(x){ return !a.achieved[x]; }).sort(function(x,y){ return a.gaps[x]-a.gaps[y]; });
  var r1 = ranked[0]||null, r2 = ranked[1]||null;
  return (
    ((o && o.noCerts) ? '' :
      '<div class="certrow"><span class="clabel">현재 인증 단계</span><div class="certbadges">' +
      certs.map(function(c){ return '<span class="certbadge '+(c[1]?'on '+c[0]:'')+'">'+c[0]+'</span>'; }).join('') +
      '</div></div>') +
    '<div class="rrow">' +
      [['r1','자기소개서'],['r2','학업계획서'],['r3','교수상담']].map(function(p){
        var done = !!s[p[0]];
        return '<div class="rchip '+(done?'done':'')+'"><span class="rlabel">'+p[1]+'</span>' +
               '<span class="rstatus">'+(done?'✓ 완료':'✕ 미완료')+'</span></div>';

    '</div>' +
    '<div class="totalline">COMpass K 총점(한도적용) <b class="mono">'+num(s.total)+'</b>점</div>' +
    '<div class="facebars">' +
      AREAS.map(function(x){
        var score = num(s[x]), th = THRESHOLDS[x];
        var pct = Math.min(100, Math.round(score/th*100));
        var met = a.achieved[x];
        var cls = x===r1 ? 'rank1' : x===r2 ? 'rank2' : '';
        return '<div class="facebar '+cls+'">' +
          '<div class="code '+x+'">'+x+'</div>' +
          '<div class="trackbar"><div class="fill '+x+'" style="width:'+pct+'%"></div></div>' +
          '<div class="score">' +
            '<div class="num">'+score+'/'+th+'</div>' +
            '<div class="gap '+(met?'met':'')+'">'+(met ? '달성 ✓' : a.gaps[x]+'점 남음')+'</div>' +
          '</div>' +
          (x===r1 ? '<div class="closest rank1">🥇 1순위로 가까움</div>' : '') +
          (x===r2 ? '<div class="closest rank2">🥈 2순위로 가까움</div>' : '') +
        '</div>';
      }).join('') +
    '</div>' +
    '<div class="schol">' +
      '<div class="schol-row"><span class="emo">🎓</span><div>' +
        '<div class="amt">'+SCHOLARSHIP.S.amount+'</div><div class="snote">'+SCHOLARSHIP.S.note+'</div></div></div>' +
      ((reco.target==='A'||reco.target==='T') ?
        '<div class="schol-row cmp"><span class="emo">📎</span><div>' +
        '<div class="amt">'+SCHOLARSHIP[reco.target].amount+'</div>' +
        '<div class="snote">'+SCHOLARSHIP[reco.target].note+'</div></div></div>' : '') +
    '</div>' +
    '<div class="reco '+(reco.ok?'ok':'')+'">'+reco.html+'</div>' +
    (s.note ? '<div class="notice-box" style="margin:12px 0 0;">메모: '+esc(s.note)+'</div>' : '')
  );
}

var installPrompt = null;
function isStandalone(){
  try{
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }catch(e){ return false; }
}
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function inFrame(){
  try{ return window.self !== window.top; }catch(e){ return true; }
}
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  installPrompt = e;
  render();
});
window.addEventListener('appinstalled', function(){ installPrompt = null; render(); });

// 브라우저에서 다시 열었을 때 설치 화면이 바로 뜨도록 표시를 붙인 주소
function installUrl(){
  try{
    var u = new URL(location.href);
    u.searchParams.set('install', '1');
    return u.toString();
  }catch(e){ return location.href; }
}
function installNow(){
  if(!installPrompt) return;
  var p = installPrompt;
  installPrompt = null;
  p.prompt();
  var done = function(){ state.modal = null; state.installMsg = ''; render(); };
  if(p.userChoice && p.userChoice.then) p.userChoice.then(done, done); else done();
}
function copyInstallUrl(){
  var url = installUrl();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){
      state.installMsg = '주소를 복사했습니다. 크롬(또는 사파리) 주소창에 붙여넣어 주세요.';

/* ---- 뒤로가기(안드로이드 back) 처리 ----
   화면을 옮길 때마다 기록을 남겨서, 기기의 뒤로가기가 앱을 닫지 않고 전 단계로 가도록 함 */
function navSnapshot(){
  return { k:'kstar', mode:state.mode, role:state.role, view:state.view,
           guideRole:state.guideRole, detailId:state.detailId,
           modal:state.modal ? { type:state.modal.type, id:state.modal.id } : null };
}
function navApply(s){
  state.mode = s.mode; state.role = s.role; state.view = s.view;
  state.guideRole = s.guideRole; state.detailId = s.detailId; state.modal = s.modal;
  state.formError = '';
}
// 화면이 바뀔 때마다(앞으로 가든 돌아가든) 기록을 하나씩 쌓는다.
// history.back()은 직접 부르지 않는다 — 아티팩트처럼 화면 안에 끼워 넣어진 환경에서는
// 바깥 페이지를 건드려 앱이 통째로 닫힐 수 있기 때문.
function navSet(mutate){
  if(mutate) mutate();
  state.formError = '';
  try{ history.pushState(navSnapshot(), ''); }catch(e){}
  render(); window.scrollTo(0,0);
}
var navGo = navSet, navBack = navSet;
function navReplace(mutate){     // 같은 자리에서 내용만 교체
  if(mutate) mutate();
  try{ history.replaceState(navSnapshot(), ''); }catch(e){}
  render();
}
function navReset(){             // 로그인/로그아웃 등 처음 상태로
  try{ history.replaceState(navSnapshot(), ''); }catch(e){}
  render(); window.scrollTo(0,0);
}
window.addEventListener('popstate', function(e){
  if(e.state && e.state.k === 'kstar'){ navApply(e.state); }
  else { state.mode='app'; state.view = session() ? 'list' : 'login'; state.modal=null; }
  render(); window.scrollTo(0,0);
});

function field(id, label, type, opts){
  opts = opts||{};
  var attrs = 'id="'+id+'" type="'+type+'"';
  if(opts.required) attrs += ' required';
  if(opts.placeholder) attrs += ' placeholder="'+esc(opts.placeholder)+'"';
  if(opts.value!=null && opts.value!=='') attrs += ' value="'+esc(opts.value)+'"';
  if(opts.min) attrs += ' minlength="'+opts.min+'"';
  if(type==='number') attrs += ' min="0"';
  return '<div class="field"><label for="'+id+'">'+label+'</label>' +
         '<input class="'+(opts.mono?'mono':'')+'" '+attrs+'>' +
         (opts.hint ? '<span class="hint">'+opts.hint+'</span>' : '') + '</div>';
}

// 현황판에 보이는 순서(S→T→A→R, 각 단계 안에서는 다음 단계에 가까운 순)
function boardGroups(){
  var q = (state.search||'').toLowerCase();
  var filtered = cache.roster.filter(function(s){
    if(q && (s.name||'').toLowerCase().indexOf(q)===-1) return false;
    if(state.yearFilter && String(num(s.year))!==state.yearFilter) return false;
    return true;
  });
  var groups = { R:[], A:[], T:[], S:[] };
  filtered.forEach(function(s){ groups[stageOf(s, analyze(s)).stage].push(s); });
  Object.keys(groups).forEach(function(k){
    groups[k].sort(function(x,y){
      var ax = analyze(x), ay = analyze(y);
      if(k==='S' && ay.achievedCount!==ax.achievedCount) return ay.achievedCount-ax.achievedCount;
      return bestGapArea(ax).gap - bestGapArea(ay).gap;
    });
  });
  return groups;
}
function orderedIds(){
  var g = boardGroups();
  return ['S','T','A','R'].reduce(function(acc,k){
    return acc.concat(g[k].map(function(s){ return s.id; }));
  }, []);
}
var SWIPE_HINT_KEY = 'kstar_swipe_hint_seen';
function swipeHintSeen(){
  try{ return localStorage.getItem(SWIPE_HINT_KEY) === '1'; }catch(e){ return false; }
}
function gotoSibling(dir){
  var ids = orderedIds();
  var i = ids.indexOf(state.detailId);
  if(i === -1) return;
  var j = i + dir;
  if(j < 0 || j >= ids.length) return;
  try{ localStorage.setItem(SWIPE_HINT_KEY, '1'); }catch(e){}
  state.slideDir = dir > 0 ? 'right' : 'left';
  navReplace(function(){ state.detailId = ids[j]; });
  window.scrollTo(0,0);
}

function parseImport(text){
  text = (text||'').trim();
  if(!text) throw new Error('붙여넣은 내용이 없습니다.');
  var rows;
  try{
    var j = JSON.parse(text);
    rows = Array.isArray(j) ? j : [j];
  }catch(e){
    rows = text.split('\n').map(function(line){
      var t = line.trim();
      if(!t || /^이름/.test(t)) return null;
      var c = t.split(/[,\t]+|\s{2,}/).map(function(x){ return x.trim(); })
               .filter(function(x){ return x !== ''; });
      if(c.length < 5) return null;
      return { name:c[0], F:c[1], A:c[2], C:c[3], E:c[4], total:c[5] };
    }).filter(Boolean);
  }
  if(!rows.length) throw new Error('읽을 수 있는 줄이 없습니다. 형식을 확인해 주세요.');
  return rows;
}

async function doImport(){
  var box = document.getElementById('importText');
  var rows;
  try{ rows = parseImport(box ? box.value : ''); }
  catch(e){ state.formError = errMsg(e); render(); return; }

  state.formError=''; state.importResult=''; state.importBusy=true;
  var updated=0, added=0, skipped=[];

  for(var i=0;i<rows.length;i++){
    var r = rows[i] || {};
    var name = String(r.name||'').trim();
    if(!name) continue;
    state.importProgress = (i+1)+' / '+rows.length+' 반영 중…';
    render();

    var patch = { updatedAt: nowIso() };
    ['total','F','A','C','E','year'].forEach(function(k){
      if(r[k] !== undefined && r[k] !== null && r[k] !== '') patch[k] = num(r[k]);
    });
    ['r1','r2','r3','certA','certT','certS'].forEach(function(k){
      if(typeof r[k] === 'boolean') patch[k] = r[k];
    });
    ['major','role','note'].forEach(function(k){
      if(typeof r[k] === 'string' && r[k] !== '') patch[k] = r[k];
    });

    var hit = cache.roster.filter(function(x){ return x.name === name; });
    try{
      if(hit.length === 1){
        await storeUpdate('roster', hit[0].id, patch);
        updated++;
      } else if(hit.length === 0){
        var base = { name:name, major:'태권도학과', year:1, role:'',
          r1:false, r2:false, r3:false, certA:false, certT:false, certS:false,
          total:0, F:0, A:0, C:0, E:0, note:'', claimedBy:null };
        for(var k in patch) base[k] = patch[k];
        await storeSet('roster', slugFor(name, ''), base);
        added++;
      } else {
        skipped.push(name + ' (같은 이름 ' + hit.length + '명)');
      }
    }catch(e){
      skipped.push(name + ' (' + errMsg(e) + ')');
    }
  }

  try{ await loadRoster(); }catch(e){}
  state.importBusy = false; state.importProgress = '';
  state.importResult = '반영 완료 — 수정 <b>'+updated+'명</b>, 새로 추가 <b>'+added+'명</b>' +
    (skipped.length ? '<br>건너뜀: ' + esc(skipped.join(', ')) : '');
  if(box) box.value = '';
  render();
}

/* 실적 승인 마감까지 남은 날짜 안내 */
function daysUntil(iso){
  var ms = new Date(iso).getTime() - Date.now();
  return Math.ceil(ms / 86400000);
}
function deadlineBox(compact){
  var vd = daysUntil(SEMESTER.visitEnd);
  if(vd < 0) return '';
  var od = daysUntil(SEMESTER.onlineEnd);
  var os = daysUntil(SEMESTER.onlineStart);
  var urgent = vd <= 21;
  var line;
  if(od >= 0 && os <= 0) line = '온라인 승인신청도 <b>' + od + '일</b> 남았습니다.';
  else if(os > 0) line = '온라인 승인신청은 11월 23일부터 3주간 열립니다.';
  else line = '온라인 승인신청 기간은 끝났습니다. 이제 방문 승인만 가능합니다.';
  return '<div class="notice-box" style="margin-bottom:14px;' +
    (urgent ? 'border-color:var(--danger-border);background:var(--danger-bg);color:var(--danger);' :
              'border-color:var(--amber-border);background:var(--amber-bg);color:var(--amber);') + '">' +
    '<b>' + esc(SEMESTER.name) + ' 실적 승인 마감까지 ' + vd + '일</b>' +
    ' — 자격증·봉사·수상 실적은 <b>2026. 12. 28.(월) 16:00</b>까지 EDWARD에 입력하고 승인까지 받아야 이번 학기 점수에 들어갑니다. ' + line +
    (compact ? '' : '<br><span style="font-size:11.5px;opacity:.85;">' + esc(SEMESTER.visitText) + ' · ' + esc(SEMESTER.onlineText) + '</span>') +
    '</div>';
}

function certListHtml(){
  var q = (state.certSearch || '').trim().toLowerCase();
  var hit = 0;
  var html = CERT_GROUPS.map(function(g){
    var rows = g.rows.filter(function(r){ return !q || r[0].toLowerCase().indexOf(q) >= 0; });
    if(!rows.length) return '';
    hit += rows.length;
    return '<details class="acc" style="border-left-color:var(--primary);"'+(q?' open':'')+'>' +
      '<summary>'+esc(g.name)+' <span style="font-weight:500;color:var(--text-faint);font-size:11.5px;">'+esc(g.code)+'</span></summary>' +
      (g.tip ? '<p style="font-size:12px;color:var(--text-muted);line-height:1.6;margin:2px 0 6px;">'+g.tip+'</p>' : '') +
      '<table class="gtable"><tr><th>자격증</th><th>구분</th><th style="text-align:right;">점수</th></tr>' +
      rows.map(function(r){
        return '<tr><td>'+esc(r[0])+'</td><td style="color:var(--text-faint);">'+esc(r[1])+'</td>' +
          '<td class="mono" style="text-align:right;font-weight:700;">'+r[2]+'</td></tr>';
      }).join('') + '</table></details>';
  }).join('');
  return hit ? html : '<div class="empty-state">"'+esc(state.certSearch)+'" 으로 찾은 자격증이 없습니다. 목록에 없어도 원본을 들고 6300 학생통합컨택코너에 가면 등록 신청할 수 있습니다.</div>';
}

/* ============ auth actions ============ */
async function doLogin(role, id, pw){
  var col = role==='student' ? 'students' : 'admins';
  var doc = await storeGet(col, id);
  var label = role==='student' ? '학번' : '관리자 번호';
  if(!doc){ state.formError = '등록되지 않은 '+label+'이에요. 처음이시라면 비밀번호 설정하기를 눌러주세요.'; render(); return; }
  var hash = await sha256Hex(pw);
  if(hash !== doc.passwordHash){ state.formError = label+' 또는 비밀번호가 올바르지 않아요.'; render(); return; }
  state.formError=''; state.formOk=''; state.view='list';
  if(role==='student'){
    setSession('student', { id:id, name:doc.name, rosterId:doc.rosterId });
    await loadMe();
  } else {
    setSession('admin', { id:id, name:doc.name });
    await loadRoster();
  }
  navReset();
}

async function doRegisterStudent(id, name, dept, year, pw, pw2){
  if(pw.length<6){ state.formError='비밀번호는 6자 이상이어야 해요.'; render(); return; }
  if(pw!==pw2){ state.formError='비밀번호가 서로 달라요. 다시 확인해 주세요.'; render(); return; }
  var existing = await storeGet('students', id);
  if(existing){ state.formError='이미 등록된 학번이에요. 로그인해 주세요.'; render(); return; }

  var roster = await storeAll('roster');
  var match = roster.find(function(r){ return r.name===name && !r.claimedBy; });
  var rosterId;
  if(match){
    rosterId = match.id;
    await storeUpdate('roster', rosterId, { claimedBy:id, major:dept, year:num(year), updatedAt:nowIso() });
  } else {
    rosterId = slugFor(name, id);
    await storeSet('roster', rosterId, {
      name:name, major:dept, year:num(year), role:'', claimedBy:id,
      r1:false, r2:false, r3:false, certA:false, certT:false, certS:false,
      total:0, F:0, A:0, C:0, E:0, note:'', updatedAt:nowIso()
    });
  }
  var hash = await sha256Hex(pw);
  await storeSet('students', id, { name:name, rosterId:rosterId, passwordHash:hash, createdAt:nowIso() });
  setSession('student', { id:id, name:name, rosterId:rosterId });
  state.formError=''; state.view='list';
  await loadMe();
  navReset();
}

async function doRegisterAdmin(id, name, pw, pw2, code){
  if(pw.length<6){ state.formError='비밀번호는 6자 이상이어야 해요.'; render(); return; }
  if(pw!==pw2){ state.formError='비밀번호가 서로 달라요. 다시 확인해 주세요.'; render(); return; }
  var admins = await storeAll('admins');
  if(admins.length>0){
    var cfg = await storeGet('config','app');
    var required = cfg && cfg.adminCode ? cfg.adminCode : '';
    if(!required){ state.formError='관리자 등록이 잠겨 있어요. 기존 관리자에게 등록코드를 요청해 주세요.'; render(); return; }
    if(code !== required){ state.formError='관리자 등록코드가 올바르지 않아요.'; render(); return; }
  }
  var existing = await storeGet('admins', id);
  if(existing){ state.formError='이미 등록된 관리자 번호예요.'; render(); return; }
  var hash = await sha256Hex(pw);
  await storeSet('admins', id, { name:name, passwordHash:hash, createdAt:nowIso() });
  setSession('admin', { id:id, name:name });
  state.formError=''; state.view='list';
  await loadRoster();
  navReset();
}

/* ============ csv ============ */
function toCsv(rows){
  return rows.map(function(r){
    return r.map(function(c){
      var v = String(c==null?'':c);
      return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
    }).join(',');
  }).join('\n');
}
async function exportCsv(){
  var head = ['이름','학번','학년','학과','R자소서','R계획서','R상담','A인증','T인증','S인증','총점','F','A','C','E','단계','메모'];
  var rows = cache.roster.map(function(s){
    var st = stageOf(s, analyze(s));
    return [s.name, s.claimedBy||'', num(s.year), s.major||'',
      s.r1?'O':'', s.r2?'O':'', s.r3?'O':'', s.certA?'O':'', s.certT?'O':'', s.certS?'O':'',
      num(s.total), num(s.F), num(s.A), num(s.C), num(s.E), st.stage, s.note||''];
  });
  var csv = '﻿' + toCsv([head].concat(rows));
  var filename = 'K-STAR_현황_' + new Date().toISOString().slice(0,10) + '.csv';
  try{
    var downloads = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if(downloads){ await downloads.save({ filename:filename, data:csv }); return; }
  }catch(e){}
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}


/* ---- 캡쳐 첨부하기 ---- */
// 사진이 너무 크면 전송이 느리니 가로 1400px 이하로 줄여서 보낸다.
function shrinkImage(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error('이미지를 읽지 못했습니다.')); };
    reader.onload = function(){
      var img = new Image();
      img.onerror = function(){ reject(new Error('이미지를 열지 못했습니다.')); };
      img.onload = function(){
        var max = 1400;
        var w = img.width, h = img.height;
        if(w > max){ h = Math.round(h * max / w); w = max; }
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function fillScoreForm(v){
  var filled = [];
  function setNum(id, val, label){
    if(val === null || val === undefined || val === '') return;
    var el = document.getElementById(id);
    if(el){ el.value = num(val); filled.push(label); }
  }
  function setChk(id, val, label){
    if(val !== true && val !== false) return;
    var el = document.getElementById(id);
    if(el){ el.checked = val; filled.push(label); }
  }
  setNum('sTotal', v.total, '총점');
  AREAS.forEach(function(x){ setNum('s'+x, v[x], x); });
  setChk('sr1', v.r1, '자기소개서'); setChk('sr2', v.r2, '학업계획서'); setChk('sr3', v.r3, '교수상담');
  setChk('scA', v.certA, 'A인증'); setChk('scT', v.certT, 'T인증'); setChk('scS', v.certS, 'S인증');
  return filled;
}

async function handleShot(file){
  if(!file || state.shotBusy) return;
  if(!apiMode){
    state.shotMsg = '서버에 연결되어 있지 않아 캡쳐를 올릴 수 없습니다.';
    render(); return;
  }
  state.shotBusy = true;
  state.shotMsg = '캡쳐를 올리는 중입니다…';
  render();
  try{
    var dataUrl = await shrinkImage(file);
    state.shotMsg = '캡쳐를 읽는 중입니다… (10초쯤 걸릴 수 있어요)';
    render();
    var out = await apiCall('analyze', { dataUrl: dataUrl, name: (cache.me && cache.me.name) || 'capture' });

    var shots = (cache.me && cache.me.shots) || [];
    shots = shots.concat([{ fileId: out.fileId, at: nowIso() }]);
    await storeUpdate('roster', state.studentSession.rosterId, { shots: shots, updatedAt: nowIso() });
    await loadMe();

    if(out.values){
      var filled = fillScoreForm(out.values);
      state.shotMsg = filled.length
        ? '캡쳐에서 ' + filled.join(', ') + ' 을(를) 읽어 채웠습니다. 맞는지 확인하고 저장해 주세요.'
        : '캡쳐는 올렸지만 숫자를 찾지 못했습니다. 직접 입력해 주세요.';
      var keep = state.shotMsg;
      render();
      fillScoreForm(out.values);   // 다시 그린 뒤에도 값이 남도록
      state.shotMsg = keep;
    } else if(out.skipped){
      state.shotMsg = '캡쳐를 올렸습니다. (자동 읽기는 꺼져 있어 점수는 직접 입력해 주세요)';
      render();
    } else {
      state.shotMsg = '캡쳐는 올렸습니다. ' + (out.readError || '자동 읽기에 실패했습니다.') + ' 점수는 직접 입력해 주세요.';
      render();
    }
  }catch(e){
    state.shotMsg = errMsg(e);
    render();
  }finally{
    state.shotBusy = false;
  }
}

document.addEventListener('change', function(e){
  if(e.target && e.target.id === 'shotInput'){

});

  else if(act==='close-guide'){ navBack(function(){ state.mode='app'; }); }
  else if(act==='set-guide-role'){ navReplace(function(){ state.guideRole = el.dataset.role; }); window.scrollTo(0,0); }
  else if(act==='open-detail'){ navGo(function(){ state.detailId = el.dataset.id; state.view='detail'; }); }
  else if(act==='install'){ doInstall(); }
  else if(act==='do-install'){ installNow(); }
  else if(act==='open-browser'){ openInBrowser(); }
  else if(act==='copy-url'){ copyInstallUrl(); }
  else if(act==='sib-prev'){ gotoSibling(-1); }
  else if(act==='sib-next'){ gotoSibling(1); }
  else if(act==='copy-roster'){
    var out = cache.roster.map(function(r){
      var o = { name:r.name, year:num(r.year), major:r.major||'', role:r.role||'',
        total:num(r.total), F:num(r.F), A:num(r.A), C:num(r.C), E:num(r.E),
        r1:!!r.r1, r2:!!r.r2, r3:!!r.r3,
        certA:!!r.certA, certT:!!r.certT, certS:!!r.certS };
      if(r.note) o.note = r.note;
      return o;
    });
    var txt = JSON.stringify(out);
    var done = function(){
      state.apiError = '';
      state.importResult = '';
      alert('명단 ' + out.length + '명을 복사했습니다.\n대화창에 붙여넣어 주세요.');
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done, function(){ window.prompt('아래 내용을 복사해 주세요', txt); });
    } else {
      window.prompt('아래 내용을 복사해 주세요', txt);
    }
  }
  else if(act==='goto-import'){ navGo(function(){ state.view='import'; state.importResult=''; }); }
  else if(act==='do-import'){ doImport(); }
  else if(act==='view-shot'){
    var fid = el.dataset.file;
    navGo(function(){ state.modal = { type:'shot', dataUrl:null }; });
    apiCall('shot', { fileId: fid }).then(function(out){
      if(state.modal && state.modal.type==='shot'){ state.modal.dataUrl = out.dataUrl; render(); }
    }, function(err){
      if(state.modal && state.modal.type==='shot'){ state.modal = null; state.apiError = errMsg(err); render(); }
    });
  }
  else if(act==='reload'){
    state.apiError = ''; state.loading = true;
    render();
    loadRoster().then(function(){ state.loading = false; render(); },
                      function(err){ state.loading = false; state.apiError = errMsg(err); render(); });
  }
  else if(act==='export-csv'){ exportCsv(); }
  else if(act==='reset-pw'){ navGo(function(){ state.modal={type:'confirmReset', id:el.dataset.id}; }); }
  else if(act==='close-modal' || act==='overlay-bg'){ navBack(function(){ state.modal=null; }); }
  else if(act==='confirm-reset'){
    (async function(){
      var id = el.dataset.id;
      var s = cache.roster.find(function(x){ return x.id===id; });
      if(s && s.claimedBy){
        await storeDelete('students', s.claimedBy);
        await storeUpdate('roster', id, { claimedBy:null, updatedAt:nowIso() });
        await loadRoster();
      }
      navBack(function(){ state.modal=null; });
    })().catch(failWith);
  }
});

/* ---- 좌우 스와이프로 단원 넘기기 ---- */
function onDetailScreen(){
  return state.mode==='app' && state.role==='admin' && state.view==='detail' && !state.modal;
}
var swipeX = null, swipeY = null;
document.addEventListener('touchstart', function(e){
  swipeX = null;
  if(!onDetailScreen() || e.touches.length !== 1) return;
  if(e.target.closest && e.target.closest('input,select,textarea,button')) return;
  swipeX = e.touches[0].clientX;
  swipeY = e.touches[0].clientY;
}, {passive:true});
document.addEventListener('touchend', function(e){
  if(swipeX === null || !onDetailScreen()) return;
  var t = e.changedTouches[0];
  var dx = t.clientX - swipeX, dy = t.clientY - swipeY;
  swipeX = null;
  if(Math.abs(dx) < 60) return;                 // 너무 짧은 움직임은 무시
  if(Math.abs(dx) < Math.abs(dy) * 1.5) return; // 위아래로 스크롤한 것은 무시
  gotoSibling(dx < 0 ? 1 : -1);                 // 왼쪽으로 밀면 다음 단원
}, {passive:true});
document.addEventListener('keydown', function(e){
  if(!onDetailScreen()) return;
  if(e.target.closest && e.target.closest('input,select,textarea')) return;
  if(e.key === 'ArrowLeft') gotoSibling(-1);
  else if(e.key === 'ArrowRight') gotoSibling(1);
});

/* ============ boot ============ */
(async function boot(){
  // 새 버전이 올라오면 설치된 앱도 저절로 최신으로 바뀌도록 한다
  try{
    if('serviceWorker' in navigator){
      var hadController = !!navigator.serviceWorker.controller;
      var reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if(!hadController || reloaded) return;   // 처음 설치될 때는 새로고침하지 않는다
        reloaded = true;
        location.reload();
      });
      navigator.serviceWorker.register('sw.js').then(function(reg){
        reg.update();
        document.addEventListener('visibilitychange', function(){
          if(document.visibilityState === 'visible') reg.update();   // 앱을 다시 열 때마다 확인
        });
      }).catch(function(){});
    }
  }catch(e){}
  restoreSessions();
  if(!state.studentSession && state.adminSession) state.role = 'admin';
  if(session()) state.view = 'list';
  // 브라우저에서 다시 열렸다면 설치 안내를 바로 띄운다
  try{
    if(new URLSearchParams(location.search).get('install') === '1' && !isStandalone()){
      state.modal = { type:'install' };
    }
  }catch(e){}
  try{ history.replaceState(navSnapshot(), ''); }catch(e){}
  render();
  if(API_URL){
    apiMode = true;   // 따로 확인 요청을 보내지 않는다 — 명단을 바로 불러오며 확인한다
  } else {
    try{
      if(window.claude && window.claude.use){ db = await window.claude.use('db'); }
    }catch(e){ db = null; }
    if(!db){ fallbackMode = true; loadFallback(); }
  }
  state.loading = true;
  render();
  async function loadAll(){
    if(state.adminSession) await loadRoster();
    if(state.studentSession) await loadMe();
  }
  try{
    await loadAll();
  }catch(e){
    // 바깥 서버에 닿지 못하는 자리(예: Claude 아티팩트 안)에서는
    // Claude 자체 저장소로 되돌아가 화면만이라도 볼 수 있게 한다.
    var recovered = false;
    if(apiMode && window.claude && window.claude.use){
      try{
        db = await window.claude.use('db');
        if(db){
          apiMode = false;
          state.previewMode = true;   // 실제 운영본이 아니라 미리보기임을 알린다
          await loadAll();
          recovered = true;
        }
      }catch(e2){}
    }
    if(!recovered) state.apiError = errMsg(e);
  }
  state.loading = false;
  navReplace();
})();

})();
</script>

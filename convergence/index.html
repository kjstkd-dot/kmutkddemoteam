<style>
:root{
  color-scheme:light;
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EEF7F0; --surface-3:#F8FAFC;
  --border:#E6E9ED; --text:#22303F; --text-muted:#79828C; --text-faint:#9AA3AC;
  --primary:#2F8F5B; --primary-dark:#1F7346; --primary-contrast:#FFFFFF;
  --banner:linear-gradient(90deg,#1F7346,#4FBE85);
  --grad-1:#2F8F5B; --grad-2:#63C793;
  --amber:#B57A08; --amber-bg:#FDF8EC; --amber-border:#F6E3B8;
  --danger:#D32027; --danger-bg:#FDF1F1; --danger-border:#F7CFD1;
  --success:#12805A; --success-bg:#E8F6F0;
  --overlay:rgba(20,28,38,.5);
  --radius-s:8px; --radius-m:14px; --radius-l:18px;
  --shadow-card:0 1px 2px rgba(34,48,63,.05), 0 8px 22px -14px rgba(34,48,63,.2);
  --font-display:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-body:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'JetBrains Mono','SFMono-Regular',monospace;
  --track:#EAEDF1;
}
*{box-sizing:border-box;}
html{background:var(--bg);}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); padding:28px 16px 64px; min-height:100vh;}
h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0; font-weight:800; letter-spacing:-.01em;}
button{font-family:inherit;}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
::selection{background:var(--primary); color:var(--primary-contrast);}

.page{max-width:1080px; margin:0 auto; display:flex; flex-direction:column; align-items:center; gap:18px;}
.topbar{width:100%; max-width:460px; display:flex; align-items:center; justify-content:space-between;
  gap:16px; flex-wrap:wrap; padding:20px 22px; border-radius:16px; color:#fff;
  background:linear-gradient(100deg, var(--grad-1), var(--grad-2)); box-shadow:var(--shadow-card);}
.page.wide .topbar, .page.wide .roletabs, .page.wide .phone{max-width:1000px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:38px; height:38px; border-radius:11px; background:rgba(255,255,255,.22); color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; flex:none;}
.brand-text strong{display:block; font-size:18px; font-weight:900; letter-spacing:-.01em; color:#fff;}
.brand-text span{display:block; font-size:11.5px; color:rgba(255,255,255,.86); margin-top:2px; line-height:1.4; word-break:keep-all;}
.topbar-actions{display:flex; gap:6px; margin-left:auto;}
.ghost-btn{border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.16); color:#fff;
  font-size:12.5px; font-weight:600; padding:8px 12px; border-radius:8px; cursor:pointer; white-space:nowrap;}
.ghost-btn:hover{background:rgba(255,255,255,.28); border-color:rgba(255,255,255,.65);}

.roletabs{width:100%; max-width:460px; display:flex; gap:8px; background:var(--surface-2); padding:5px; border-radius:999px;}
.roletab{flex:1; border:none; background:transparent; padding:9px 0; border-radius:999px; font-size:13.5px; font-weight:600; color:var(--text-muted); cursor:pointer;}
.roletab.active{background:var(--surface); color:var(--primary); box-shadow:var(--shadow-card);}

.phone{width:100%; max-width:460px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); box-shadow:var(--shadow-card); padding:24px 20px; position:relative; min-height:300px;}
.eyebrow{font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint);}
.screen-title{font-size:21px; margin-top:6px; margin-bottom:4px; word-break:keep-all;}
.screen-sub{font-size:13px; color:var(--text-muted); margin-bottom:18px;}

.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
.field label{font-size:12.5px; font-weight:600; color:var(--text-muted);}
.field input, .field select{border:1px solid var(--border); background:var(--surface-3); color:var(--text); border-radius:var(--radius-s); padding:11px 13px; font-size:14px; font-family:var(--font-body); width:100%;}
.field input:focus, .field select:focus{outline:2px solid var(--primary); outline-offset:1px; background:var(--surface);}
.field .hint{font-size:11.5px; color:var(--text-faint); line-height:1.5;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:var(--radius-s); border:1px solid transparent; font-weight:700; font-size:14.5px; padding:12px 16px; cursor:pointer; width:100%;}
.btn-primary{background:var(--primary); color:var(--primary-contrast);}
.btn-primary:hover{background:var(--primary-dark);}
.btn-ghost{background:var(--surface-2); color:var(--primary); border-color:var(--border);}
.btn-ghost:hover{border-color:var(--primary);}
.btn-line{background:transparent; color:var(--text-muted); border:1px dashed var(--border);}
.btn-danger{background:var(--danger-bg); color:var(--danger); border-color:var(--danger-border);}
.btn-small{width:auto; padding:8px 12px; font-size:12.5px;}
.linklike{background:none; border:none; color:var(--primary); font-weight:600; font-size:12.5px; cursor:pointer; padding:0; white-space:nowrap;}
.row{display:flex; align-items:center; gap:10px;}
.row-between{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px;}
.stack{display:flex; flex-direction:column; gap:10px;}

.notice-box{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-m); padding:13px 15px; font-size:12.5px; color:var(--text-muted); line-height:1.55; margin-bottom:16px;}
.errbox{background:var(--danger-bg); border:1px solid var(--danger-border); color:var(--danger); border-radius:var(--radius-s); padding:10px 13px; font-size:12.5px; margin-bottom:14px; font-weight:600;}
.okbox{background:var(--success-bg); border:1px solid var(--border); color:var(--success); border-radius:var(--radius-s); padding:10px 13px; font-size:12.5px; margin-bottom:14px; font-weight:600;}
.empty-state{text-align:center; padding:36px 12px; color:var(--text-faint); font-size:13px;}

/* 진행률 요약 */
.statusband{display:flex; align-items:center; gap:12px; border-radius:var(--radius-m); padding:14px 16px; margin-bottom:16px; color:#fff;}
.statusband.met{background:linear-gradient(100deg,#1F7346,#4FBE85);}
.statusband.unmet{background:linear-gradient(100deg,#B5580E,#E0904A);}
.statusband .mark{width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:17px; flex:none;}
.statusband b{display:block; font-size:15px;}
.statusband span{display:block; font-size:11.5px; opacity:.9; margin-top:2px;}
.catcard{border:1px solid var(--border); border-radius:var(--radius-m); padding:12px 14px; margin-bottom:10px; background:var(--surface-3);}
.catcard .cthead{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px; gap:8px;}
.catcard .cthead b{font-size:13.5px;}
.catcard .cthead span{font-size:12px; font-weight:700; color:var(--text-muted); font-family:var(--font-mono); white-space:nowrap;}
.catcard.met .cthead span{color:var(--success);}
.pbar{height:9px; border-radius:5px; background:var(--track); overflow:hidden; position:relative;}
.pbar i{position:absolute; left:0; top:0; bottom:0; border-radius:5px; background:var(--primary);}
.catcard.met .pbar i{background:var(--success);}
.totalline{font-size:13px; color:var(--text-muted); margin:14px 0 4px; display:flex; justify-content:space-between; align-items:baseline;}
.totalline b{color:var(--text); font-size:15px;}

/* 과목 목록 */
.courselist{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
.courserow{display:flex; align-items:center; gap:10px; border:1px solid var(--border); border-radius:var(--radius-s); padding:10px 12px; background:var(--surface);}
.courserow .ci{flex:1; min-width:0;}
.courserow .cn{font-weight:700; font-size:13.5px; word-break:break-all;}
.courserow .cm{font-size:11.5px; color:var(--text-faint); margin-top:2px;}
.courserow .cc{font-size:13px; font-weight:800; font-family:var(--font-mono); color:var(--primary); white-space:nowrap;}
.courserow .cact{display:flex; gap:4px;}
.icobtn{border:1px solid var(--border); background:var(--surface-3); color:var(--text-muted); font-size:12px; padding:6px 9px; border-radius:7px; cursor:pointer;}
.icobtn:hover{border-color:var(--primary); color:var(--primary);}
.icobtn.danger:hover{border-color:var(--danger); color:var(--danger);}
.catpill{display:inline-block; font-size:10px; font-weight:800; padding:2px 7px; border-radius:999px; background:var(--surface-2); color:var(--primary); margin-right:4px;}
.qmark{display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px; border-radius:50%;
  border:1px solid var(--amber); background:var(--amber-bg); color:var(--amber); font-size:10px; font-weight:800;
  line-height:1; cursor:pointer; padding:0; vertical-align:middle; margin-left:2px;}

/* 이수과목/추천과목 박스 (경로별 비교 펼침) */
.reco-outer{border:1.5px solid var(--primary); border-radius:var(--radius-l); padding:12px; background:var(--surface);}
.reco-group{border:1px solid var(--border); border-radius:var(--radius-m); padding:10px 12px; margin-bottom:10px; background:var(--surface-3);}
.reco-group:last-child{margin-bottom:0;}
.reco-group .rg-title{font-size:12px; font-weight:800; margin-bottom:8px; color:var(--text);}
.reco-group.done{background:var(--success-bg);}
.reco-group.done .rg-title{color:var(--success);}
.reco-group.need{background:var(--amber-bg); border-color:var(--amber-border);}
.reco-group.need .rg-title{color:var(--amber);}
.reco-group.self{background:var(--surface-2);}
.reco-group.self .rg-title{color:var(--primary);}
.reco-list{display:flex; flex-direction:column; gap:5px;}
.reco-item{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:6px 9px; font-size:12px; line-height:1.45;}
.reco-item .ri-name{font-weight:600; color:var(--text); word-break:break-all;}
.reco-item .ri-credit{color:var(--text-muted); font-size:11px; white-space:nowrap; margin-left:4px;}
.reco-empty{font-size:12px; color:var(--text-faint); padding:2px;}

/* admin board */
.summary{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px;}
.tile{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow-card);}
.tile .num{font-size:28px; font-weight:700; font-family:var(--font-mono); line-height:1; color:var(--primary);}
.tile.t-danger .num{color:var(--danger);}
.tile .lbl{color:var(--text-muted); font-size:11.5px; margin-top:6px; line-height:1.4;}
.controls{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.controls input, .controls select{border:1px solid var(--border); background:var(--surface-3); color:var(--text); border-radius:var(--radius-s); padding:9px 12px; font-size:13px; font-family:var(--font-body);}
.controls input{flex:1; min-width:150px;}
.roster{display:flex; flex-direction:column; gap:9px;}
.rcard{border:1px solid var(--border); border-left:4px solid var(--border); border-radius:var(--radius-m); padding:12px 13px; background:var(--surface); cursor:pointer;}
.rcard:hover{border-color:var(--primary);}
.rcard.met{border-left-color:var(--success);}
.rcard.unmet{border-left-color:var(--amber);}
.rcard .nm{font-weight:700; font-size:14px;}
.rcard .mt{font-size:11px; color:var(--text-faint); margin-top:2px;}
.rcard .mini{display:flex; justify-content:space-between; align-items:center; margin-top:8px;}
.badge{font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px;}
.badge.met{background:var(--success-bg); color:var(--success);}
.badge.unmet{background:var(--amber-bg); color:var(--amber);}

.overlay{position:fixed; inset:0; background:var(--overlay); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
.modal{width:100%; max-width:420px; background:var(--surface); border-radius:var(--radius-l); padding:22px 20px; box-shadow:var(--shadow-card); max-height:86vh; overflow-y:auto;}
.modal h3{font-size:17px; margin-bottom:4px;}
.modal .modal-sub{font-size:12.5px; color:var(--text-muted); margin-bottom:16px;}
.modal-actions{display:flex; gap:8px; margin-top:16px;}
.modal-actions .btn{width:auto; flex:1;}
.footer-note{font-size:11px; color:var(--text-faint); text-align:center; margin-top:8px;}
.guide-link{border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.16); color:#fff;
  font-size:12.5px; font-weight:600; padding:8px 12px; border-radius:8px; cursor:pointer; white-space:nowrap;}
.guide-link:hover{background:rgba(255,255,255,.28); border-color:rgba(255,255,255,.65);}

/* 이용안내 */
.guide-shell{width:100%; max-width:640px; display:flex; flex-direction:column; gap:18px;}
.guide-hero{background:linear-gradient(160deg, var(--primary), var(--primary-dark)); color:#fff; border-radius:var(--radius-l); padding:28px 26px; box-shadow:var(--shadow-card);}
.guide-hero .eyebrow{color:rgba(255,255,255,.75);}
.guide-hero h1{font-size:26px; color:#fff; margin:8px 0 10px;}
.guide-hero p{font-size:13.5px; color:rgba(255,255,255,.88); margin:0 0 14px; line-height:1.6;}
.guide-hero .back{color:#fff; font-weight:700; font-size:13px; text-decoration:underline; background:none; border:none; cursor:pointer; padding:0;}
.guide-tabs{display:flex; gap:8px; background:var(--surface-2); padding:5px; border-radius:999px;}
.guide-tabs button{flex:1; border:none; background:transparent; padding:9px 0; border-radius:999px; font-weight:700; font-size:13px; color:var(--text-muted); cursor:pointer;}
.guide-tabs button.active{background:var(--surface); color:var(--primary); box-shadow:var(--shadow-card);}
.guide-note{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-m); padding:15px 17px; font-size:13px; line-height:1.65; color:var(--text-muted);}
.guide-note b{color:var(--text);}
.step{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); padding:22px 20px; box-shadow:var(--shadow-card);}
.step-num{width:32px; height:32px; border-radius:50%; background:var(--primary); color:var(--primary-contrast); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:14px; margin-bottom:12px;}
.step h2{font-size:18px; margin-bottom:9px;}
.step p{font-size:13.5px; line-height:1.7; margin:0 0 9px;}
.step ul{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:7px;}
.step li{font-size:13.5px; line-height:1.6;}
.plat-title{font-size:13px; font-weight:800; margin:14px 0 8px; display:flex; align-items:center; gap:6px;}
.plat-title:first-of-type{margin-top:2px;}
.install-steps{counter-reset:step; display:flex; flex-direction:column; gap:9px; margin:0; padding:0; list-style:none;}
.install-steps li{position:relative; padding-left:28px; font-size:13px; line-height:1.6;}
.install-steps li::before{counter-increment:step; content:counter(step); position:absolute; left:0; top:1px;
  width:20px; height:20px; border-radius:50%; background:var(--primary); color:#fff;
  font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center;}

@media (max-width:520px){
  body{padding:18px 12px 48px;}
  .summary{grid-template-columns:repeat(3,1fr); gap:8px;}
  .tile{padding:11px 10px;}
  .tile .num{font-size:22px;}
  .grid2,.grid3{grid-template-columns:1fr 1fr;}
  .guide-hero{padding:22px 18px;}
  .step{padding:19px 16px;}
}
</style>
</head>

<div id="app"></div>

<!-- 과목 PDF 일괄 인식 기능에 쓰는 PDF 읽기 라이브러리. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
"use strict";
if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

/* ============ helpers ============ */
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function nowIso(){ return new Date().toISOString(); }
async function sha256Hex(str){
  var enc = new TextEncoder().encode(str);
  var buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}
function num(v){ var n = Number(v); return isFinite(n) ? n : 0; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
// 이수학기 선택: 2022년부터 올해+1년까지, 1학기/2학기 중 고른다. 저장 형식은 "YYYY-N".
var SEMESTER_YEAR_MIN = 2022;
function semesterYearMax(){ return new Date().getFullYear() + 1; }
function parseSemester(s){
  var m = /^(\d{4})-([12])$/.exec(s||'');
  return m ? { year:m[1], term:m[2] } : { year:'', term:'' };
}
function semesterFieldHtml(current){
  var parsed = parseSemester(current);
  var yearMax = semesterYearMax();
  var yearOpts = '<option value="">연도</option>';
  for(var y=yearMax; y>=SEMESTER_YEAR_MIN; y--){
    yearOpts += '<option value="'+y+'" '+(parsed.year===String(y)?'selected':'')+'>'+y+'년</option>';
  }
  var termOpts = '<option value="">학기</option>' +
    '<option value="1" '+(parsed.term==='1'?'selected':'')+'>1학기</option>' +
    '<option value="2" '+(parsed.term==='2'?'selected':'')+'>2학기</option>';
  return '<div class="field"><label>이수학기</label><div class="row" style="gap:8px;">' +
    '<select id="cYear" style="flex:1;">'+yearOpts+'</select>' +
    '<select id="cTerm" style="flex:1;">'+termOpts+'</select>' +
  '</div></div>';
}
// 입학년도 선택: 2020년부터 올해까지.
var ADMISSION_YEAR_MIN = 2020;
function admissionYearOptions(picked){
  var yearMax = new Date().getFullYear();
  var opts = '<option value="">선택 안 함</option>';
  for(var y=yearMax; y>=ADMISSION_YEAR_MIN; y--){
    opts += '<option value="'+y+'" '+(String(picked)===String(y)?'selected':'')+'>'+y+'년</option>';
  }
  return opts;
}

/* ============ 저장소 설정 ============
   구글 Apps Script 주소를 아래 따옴표 사이에 붙여넣으면 서버 저장으로 바뀝니다.
   비워두면 이 기기 안에만 저장됩니다(시험용).
   설치 방법은 apps-script.gs 맨 위 설명을 참고하세요.
   예: var API_URL = 'https://script.google.com/macros/s/AKfy...../exec'; */
var API_URL = 'https://script.google.com/macros/s/AKfycbxOuHvtluAmQS-BCUT3gQq_SyMbv0etxD0m-Z4KK8ajKx-9CY3lbSFcLEUnktNTtVPNMA/exec';

// 화면 아래에 표시되는 판 번호. 고칠 때마다 올린다.
var APP_VERSION = '2026-09-18 v';

/* ============ store: 서버 → 기기저장 순으로 사용 ============ */
var apiMode = !!API_URL;
var fallbackData = {};

function loadFallback(){
  try{ var raw = localStorage.getItem('cvg_store'); fallbackData = raw ? JSON.parse(raw) : {}; }
  catch(e){ fallbackData = {}; }
}
function saveFallback(){
  try{ localStorage.setItem('cvg_store', JSON.stringify(fallbackData)); }catch(e){}
}
async function apiCall(action, body){
  var res;
  var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 40000) : null;
  try{
    res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: action }, body || {})),
      signal: ctrl ? ctrl.signal : undefined
    });
  }catch(e){
    if(e && e.name === 'AbortError'){
      throw new Error('자료 서버 응답이 너무 느립니다. 잠시 후 다시 시도해 주세요.');
    }
    throw new Error('자료 서버에 연결하지 못했습니다. 구글 Apps Script 배포에서 "액세스 권한이 있는 사용자"가 "모든 사용자"인지 확인해 주세요.');
  }finally{
    if(timer) clearTimeout(timer);
  }
  if(!res.ok) throw new Error('자료 서버 응답 오류 (' + res.status + ')');
  var text = await res.text();
  var out;
  try{ out = JSON.parse(text); }
  catch(e){ throw new Error('자료 서버가 예상과 다른 답을 보냈습니다.'); }
  if(out && out.error) throw new Error(out.error);
  return out;
}
async function storeGet(col, id){
  if(apiMode){ var r = await apiCall('get', {collection:col, id:id}); return r.doc || null; }
  var d = (fallbackData[col]||{})[id];
  return d ? Object.assign({id:id}, d) : null;
}
async function storeSet(col, id, data){
  if(apiMode){ await apiCall('set', {collection:col, id:id, data:data}); return; }
  fallbackData[col] = fallbackData[col]||{}; fallbackData[col][id] = data; saveFallback();
}
async function storeUpdate(col, id, data){
  if(apiMode){ await apiCall('update', {collection:col, id:id, data:data}); return; }
  fallbackData[col] = fallbackData[col]||{};
  fallbackData[col][id] = Object.assign({}, fallbackData[col][id]||{}, data);
  saveFallback();
}
async function storeDelete(col, id){
  if(apiMode){ await apiCall('delete', {collection:col, id:id}); return; }
  if(fallbackData[col]) delete fallbackData[col][id];
  saveFallback();
}
async function storeAll(col){
  if(apiMode){ var r = await apiCall('all', {collection:col}); return r.docs || []; }
  var all = fallbackData[col]||{};
  return Object.keys(all).map(function(id){ return Object.assign({id:id}, all[id]); });
}

function unifiedCatalogGroups(dept, excludeCodes){
  var deptList = primaryCatalogForDept(dept);
  var deptCodes = deptList.map(function(c){ return c.code; });
  var extra = COURSE_CATALOG.filter(function(c){ return deptCodes.indexOf(c.code) < 0; });
  if(excludeCodes && excludeCodes.length){
    deptList = deptList.filter(function(c){ return excludeCodes.indexOf(c.code) < 0; });
    extra = extra.filter(function(c){ return excludeCodes.indexOf(c.code) < 0; });
  }
  return { deptList: sortByName(deptList), extra: sortByName(extra) };
}

// (지금 실제로 융합전공 학점에 들어가는지는 다른 문제다 — courseCountsAsConvergence 참고)
function courseIsConvergence(c){ return !!(c && c.courseCode && courseInCatalog(c.courseCode)); }
// 본인 학과 교육과정표에 있는 과목인지(과목코드 기준, 이수구분 변경 신청 여부와 무관하게
// "원래" 본인 학과 과목인지를 본다). 융합전공 이수 규정 제7조③ 적용 대상을 가리는 데 쓴다.
function courseOverlapsOwnMajor(c, dept){ return !!(c && c.courseCode && primaryCourseInCatalog(dept, c.courseCode)); }
// 제1전공 인정과목인지: 코드가 본인 학과 교육과정표에 있으면 인정된다. 목록에 없는 과목을 직접
// 입력한 경우에는(코드가 없음) 제1전공 과목으로 입력한 것으로 보고 제1전공 학점에 넣어준다.
// 다만 이수구분 변경을 신청한(c.reclassified) 과목은 융합전공으로 넘어가서 제1전공에서는
// 빠진다(융합전공 이수 규정 제7조③: "제1전공과 중복으로 인정하지 않는다").
function courseIsPrimary(c, dept){
  if(c.reclassified) return false;
  if(c.courseCode) return !!primaryCourseInCatalog(dept, c.courseCode);
  if(c.courseType) return c.courseType.indexOf('전공')===0; // 전공기초·전공필수·전공선택·전공인정만 인정 (타전공·교양·기타는 제외)
  return true; // 구분을 정하지 않은 예전 기록은 그대로 제1전공으로 인정
}

// 아니면 항상 인정되고, 본인 학과 과목이면 이수구분 변경을 신청한 것만(최대 6학점) 인정된다.
// 복수전공·부전공 모두 똑같이 적용된다.
function courseCountsAsConvergence(c, dept){
  if(!courseIsConvergence(c)) return false;
  if(!courseOverlapsOwnMajor(c, dept)) return true;
  return !!c.reclassified;
}

var CUSTOM_COURSE_TYPES = ['전공기초','전공필수','전공선택','전공인정','교양필수','교양선택','타전공','기타'];
// 과목 하나의 구분(전공필수/전공선택/전공인정/타전공/융합전공/기타)을 찾는다.
// 직접 입력·PDF로 새로 찾은 과목은 저장된 courseType을 그대로 쓰고, 교육과정표에서
// 고른 과목은 본인 학과 교육과정표 → 다른 학과 교육과정표 → 융합전공 자체 개설과목 순으로 찾는다.
function courseCategory(c, dept){
  if(c.reclassified) return '융합전공'; // 이수구분 변경 신청하면 제1전공에서 융합전공으로 넘어간다
  if(c.courseType) return c.courseType;
  if(c.courseCode){
    var own = primaryCourseInCatalog(dept, c.courseCode);
    if(own) return own.type;
    var elsewhere = Object.keys(PRIMARY_CATALOGS).some(function(d){
      return d!==dept && primaryCourseInCatalog(d, c.courseCode);
    });
    if(elsewhere) return '타전공';
    if(courseInCatalog(c.courseCode)) return '융합전공';
  }
  return '기타';
}
function courseCategoryCounts(student){
  var dept = student && student.dept;
  var counts = {};
  courses(student).forEach(function(c){
    var cat = courseCategory(c, dept);
    if(!counts[cat]) counts[cat] = { count:0, credits:0 };
    counts[cat].count++;
    counts[cat].credits += num(c.credits);
  });
  return counts;
}

/* ============ 과목 PDF 일괄 인식 ============
   성적표·수강신청 확인서 같은 PDF를 올리면, 글자만 뽑아서 본인 학과 교육과정표·
   융합전공 자체 개설과목 이름이 그 안에 있는지 찾아 후보로 보여준다. 표 구조까지
   읽지는 않고 이름이 나오는지만 보기 때문에, 찾은 목록은 추가하기 전에 학생이
   확인/해제할 수 있게 한다. */
async function extractPdfText(file){
  if(!window.pdfjsLib) throw new Error('PDF 읽기 기능을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.');
  var buf = await file.arrayBuffer();
  var pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  var lines = [];
  for(var i=1; i<=pdf.numPages; i++){
    var page = await pdf.getPage(i);
    var content = await page.getTextContent();
    var rowKeys = [];
    var rows = {};
    content.items.forEach(function(it){
      if(!it.str || !it.str.trim()) return;
      var y = it.transform[5];
      var key = null;
      for(var j=0; j<rowKeys.length; j++){
        if(Math.abs(rowKeys[j]-y) <= 2){ key = rowKeys[j]; break; }
      }
      if(key===null){ key = y; rowKeys.push(key); }
      (rows[key] = rows[key] || []).push({ x: it.transform[4], str: it.str });
    });
    rowKeys.sort(function(a,b){ return b-a; });
    rowKeys.forEach(function(key){
      var sorted = rows[key].slice().sort(function(a,b){ return a.x-b.x; });
      lines.push(sorted.map(function(it){ return it.str; }).join(' '));
    });
  }
  return lines;
}
// 한 줄(행) 안에서 "2024-1", "2024 1학기" 같은 연도-학기 표시를 찾는다. 못 찾으면 빈 문자열.
function extractSemesterFromContext(line){
  var m = /(?:^|[^0-9])(20\d{2})\s*[-./년]?\s*([12])\s*학?기?(?!\d)/.exec(line);
  if(!m) return '';
  return m[1] + '-' + m[2];
}
function matchCoursesFromText(lines, dept, excludeCodes){
  var groups = unifiedCatalogGroups(dept, excludeCodes);
  var pool = groups.deptList.concat(groups.extra);
  // 긴 과목명부터 먼저 찾아서 그 자리를 "소모"시켜 둔다. 그래야 "태권체조" 안에 들어있는
  // "체조"처럼, 짧은 과목명이 다른 과목명 안에서 우연히 겹쳐 잘못 인식되지 않는다.
  var byLenDesc = pool.slice().sort(function(a,b){ return b.name.length - a.name.length; });
  var matchedCodes = {};
  var matches = [];
  lines.forEach(function(line){
    var norm = normName(line);
    if(!norm) return;
    var consumed = norm.split('');
    byLenDesc.forEach(function(c){
      if(matchedCodes[c.code]) return;
      var needle = normName(c.name);
      if(!needle) return;
      var idx = consumed.join('').indexOf(needle);
      if(idx < 0) return;
      for(var k=idx; k<idx+needle.length; k++) consumed[k] = ' ';
      matchedCodes[c.code] = true;
      matches.push({ mid:c.code, code:c.code, name:c.name, credits:c.credits, semester: extractSemesterFromContext(line) });
    });
  });
  return sortByName(matches);
}
// 사이트 교육과정표에 없는 전공기초/전공필수/전공선택 과목을 PDF 한 줄(행) 안에서 찾아본다.
// "구분" 글자가 그 줄에 있으면, 나머지 글자에서 연도·학기·학점·성적처럼 보이는 토큰을 빼고
// 남는 한글/영문 글자를 과목명으로 본다. 이미 알고 있는 과목(카탈로그에서 찾은 것, 이미 등록된
// 것)과 겹치면 새로 추가하지 않는다.
var GUBUN_KEYWORDS = ['전공기초','전공필수','전공선택'];
function extractUnknownMajorCourses(lines, knownMatches, existingNames){
  var seenNorm = existingNames.concat(knownMatches.map(function(m){ return normName(m.name); }));
  var out = [];
  lines.forEach(function(line, li){
    var gubun = GUBUN_KEYWORDS.filter(function(g){ return line.indexOf(g) >= 0; })[0];
    if(!gubun) return;
    var rest = line.split(gubun).join(' ');
    var tokens = rest.split(/\s+/).filter(Boolean);
    var credits = null;
    var nameTokens = [];
    tokens.forEach(function(tok){
      if(/^20\d{2}$/.test(tok)) return;                          // 연도
      if(/^[12]학기$/.test(tok)) return;                          // 학기
      if(/^\d{5,6}$/.test(tok)) return;                           // 과목코드로 보이는 숫자
      if(/^[A-Fa-f][+-]?$|^(P|NP|S|U|등급)$/.test(tok)) return;   // 성적
      if(credits===null && /^\d(\.\d)?$/.test(tok)){ credits = Number(tok); return; } // 학점
      nameTokens.push(tok);
    });
    var name = cleanCourseName(nameTokens.join('').trim());
    if(name.length < 2 || name.length > 30) return;
    var norm = normName(name);
    if(seenNorm.indexOf(norm) >= 0) return;
    seenNorm.push(norm);
    // 정리된 이름이 융합전공 인정과목(COURSE_CATALOG) 이름과 같으면 "새 과목"이 아니라
    // 그 과목코드를 붙인 인정과목으로 등록해서, 학점 계산과 "융합전공 과목" 표시에 반영되게 한다.
    var matchedCode = courseCodeByCleanName(name);
    out.push({ mid:'new_'+li, code:matchedCode||null, name:name,
      credits: matchedCode ? courseInCatalog(matchedCode).credits : (credits!=null?credits:3),
      semester: extractSemesterFromContext(line), courseType: matchedCode?undefined:gubun, isNew:true });
  });
  return out;
}

function normName(s){ return String(s==null?'':s).replace(/\s+/g,''); }
// PDF에서 글자 사이 공백이 사라지면 "22042-01태권도기초실기(1)1.004.5성적확정"처럼 과목코드-분반이
// 앞에, 학점.점수+성적확정이 뒤에 과목명과 그대로 붙어 나올 때가 있다. 앞뒤에 남은 이런 부분을
// 지워서 순수 과목명만 남긴다. 이미 깨끗한 이름은 그대로 반환한다(변경 없음).
function cleanCourseName(name){
  var n = String(name==null?'':name);
  n = n.replace(/^\d{4,6}-\d{1,3}/, '');
  n = n.replace(/[0-9A-Za-z.+-]*성적확정$/, '');
  return n.trim();
}
// 정리된 과목명이 COURSE_CATALOG(융합전공 인정과목)의 이름과 같으면 그 과목코드를 돌려준다.
// PDF에서 과목코드를 못 찾아 "새 과목"으로 등록됐지만 사실은 융합전공 인정과목인 경우,
// 이름만으로 코드를 다시 찾아 붙여줘야 융합전공 학점 계산과 "융합전공 과목" 표시에 반영된다.
function courseCodeByCleanName(name){
  var norm = normName(name);
  var c = COURSE_CATALOG.filter(function(x){ return normName(x.name)===norm; })[0];
  return c ? c.code : null;
}
// 지금 실제로 융합전공 학점에 들어가는 과목 목록/학점(복수전공·부전공 공통, 제7조③).
function convergenceCourses(student){
  var dept = student && student.dept;
  return courses(student).filter(function(c){ return courseCountsAsConvergence(c, dept); });
}
function totalCredits(student){
  return convergenceCourses(student).reduce(function(s,c){ return s + num(c.credits); }, 0);
}
function coreStatus(student){
  var have = courses(student).map(function(c){ return normName(c.name); });
  return CORE_COURSES.map(function(cc){
    return { name:cc.name, credits:cc.credits, done: have.indexOf(normName(cc.name)) >= 0 };
  });
}
function coreDoneCount(student){ return coreStatus(student).filter(function(x){ return x.done; }).length; }
function coreMet(student){ return coreDoneCount(student) >= CORE_COURSES.length; }
function missingCoreCredits(student){
  return coreStatus(student).filter(function(x){ return !x.done; }).reduce(function(s,x){ return s+num(x.credits); }, 0);
}
// 학칙 제44조①: 복수전공(융합전공 포함)으로 이수하는 경우, 제1전공 학과의 졸업논문이
// 필수과목이면 반드시 이수해야 한다. 부전공에는 적용되지 않는다.
function thesisApplies(student, trackKey){ return trackKey==='double' && !!student.thesisRequired; }
function thesisMetFor(student, trackKey){ return !thesisApplies(student, trackKey) || !!student.thesisDone; }
// 경로 하나(복수전공/부전공 1개/부전공 2개 이상)에 대한 진행 상황을 계산한다.
function trackAnalysis(student, key){
  var info = TRACK_TYPES[key];
  var pMin = info.primaryMin || null;
  var pCur = pMin ? primaryCreditsTotal(student) : null;
  var pMet = pMin ? pCur >= pMin : true;
  var cvgCur = totalCredits(student);
  var cvgMin = info.convergenceMin;
  var cvgMet = coreMet(student) && cvgCur >= cvgMin;
  // 남은 학점 = 아직 안 채운 핵심과목 학점(반드시 채워야 함) + 그 외 부족분
  var missCore = missingCoreCredits(student);
  var cvgGap = cvgMet ? 0 : (missCore + Math.max(0, cvgMin - cvgCur - missCore));
  var pGap = pMin ? Math.max(0, pMin - pCur) : 0;
  var tMet = thesisMetFor(student, key);
  return {
    key: key, label: info.label,
    cvgCur: cvgCur, cvgMin: cvgMin, cvgMet: cvgMet, cvgGap: cvgGap,
    primaryMin: pMin, primaryCur: pCur, primaryMet: pMet, primaryGap: pGap,
    thesisApplies: thesisApplies(student, key), thesisMet: tMet,
    met: cvgMet && pMet && tMet
  };
}
function trackAnalyses(student){ return TRACK_ORDER.map(function(k){ return trackAnalysis(student, k); }); }
// 지금 상태에서 가장 빨리 채울 수 있는 경로를 고른다: 이미 충족한 경로가 있으면 그중
// 첫 번째, 없으면 융합전공 학점 부족분이 가장 적은 경로.
function bestTrack(student){
  var list = trackAnalyses(student);
  var met = list.filter(function(a){ return a.met; });
  if(met.length) return met[0];
  return list.slice().sort(function(a,b){ return a.cvgGap - b.cvgGap; })[0];
}
function anyTrackMet(student){ return trackAnalyses(student).some(function(a){ return a.met; }); }
function eligibleToApply(student){ return num(student.recognizedSemesters) >= APPLY_MIN_SEMESTERS; }
function pct(cur, min){ return min>0 ? Math.min(100, Math.round(cur/min*100)) : 100; }

/* ============ 뒤로가기(안드로이드 뒤로가기·스와이프) ============
   화면이 바뀔 때마다 브라우저 히스토리에 한 단계씩 쌓아서, 안드로이드 기기의
   뒤로가기 버튼이나 뒤로가기 스와이프 제스처를 누르면 앱이 꺼지지 않고
   바로 전 화면으로 돌아가게 한다. */
var lastNavSnapshot = null;
var isRestoringHistory = false;
function navSnapshot(){
  return {
    mode: state.mode, role: state.role, view: state.view, guideRole: state.guideRole,
    detailId: state.detailId, editingCourseId: state.editingCourseId,
    editingMicrodegreeId: state.editingMicrodegreeId, showInstallModal: state.showInstallModal
  };
}
function syncHistoryOnRender(){
  var snap = navSnapshot();
  var snapStr = JSON.stringify(snap);
  if(snapStr === lastNavSnapshot) return;
  lastNavSnapshot = snapStr;
  if(isRestoringHistory) return; // popstate로 이미 그 위치로 이동한 것뿐, 새로 쌓지 않는다.
  try{ history.pushState(snap, ''); }catch(e){}
}
window.addEventListener('popstate', function(e){
  if(!e.state) return;
  isRestoringHistory = true;
  Object.assign(state, e.state);
  lastNavSnapshot = JSON.stringify(navSnapshot());
  render();
  isRestoringHistory = false;
});

function render(){
  root.innerHTML = state.mode==='guide' ? renderGuide() : renderApp();
  syncHistoryOnRender();
}
function errMsg(e){ return e && e.message ? e.message : String(e); }
function failWith(e){ state.formError = errMsg(e); render(); }

async function doLogin(role, id, pw){
  var col = role==='student' ? 'cvg_students' : 'cvg_admins';
  var doc = await storeGet(col, id);
  var label = role==='student' ? '학번' : '관리자 번호';
  if(!doc){ state.formError = '등록되지 않은 '+label+'이에요. 처음이시라면 비밀번호 설정하기를 눌러주세요.'; render(); return; }
  var hash = await sha256Hex(pw);
  if(hash !== doc.passwordHash){ state.formError = label+' 또는 비밀번호가 올바르지 않아요.'; render(); return; }
  state.formError=''; state.formOk='';
  if(role==='student'){
    setSession('student', { id:id, name:doc.name });
    state.cache.me = doc;
    state.view='home';
  } else {
    setSession('admin', { id:id, name:doc.name });
    state.view='list';
    await loadRoster();
  }
  render();
}
async function doRegisterStudent(id, name, dept, year, pw, pw2){
  if(!id || !name){ state.formError='학번과 이름을 입력해 주세요.'; render(); return; }
  if(!dept){ state.formError='학과(제1전공)를 선택해 주세요.'; render(); return; }
  if(pw.length<6){ state.formError='비밀번호는 6자 이상이어야 해요.'; render(); return; }
  if(pw!==pw2){ state.formError='비밀번호가 서로 달라요. 다시 확인해 주세요.'; render(); return; }
  var existing = await storeGet('cvg_students', id);
  if(existing){ state.formError='이미 등록된 학번이에요. 로그인해 주세요.'; render(); return; }
  var hash = await sha256Hex(pw);
  var doc = { name:name, dept:dept||'', year:year||'', passwordHash:hash, courses:[],
    recognizedSemesters:'',
    microdegrees:[], thesisRequired:false, thesisDone:false, createdAt:nowIso() };
  await storeSet('cvg_students', id, doc);
  setSession('student', { id:id, name:name });
  state.cache.me = Object.assign({id:id}, doc);
  state.formError=''; state.view='home';
  render();
}
async function doRegisterAdmin(id, name, pw, pw2, code){
  if(!id || !name){ state.formError='관리자 번호와 이름을 입력해 주세요.'; render(); return; }
  if(pw.length<6){ state.formError='비밀번호는 6자 이상이어야 해요.'; render(); return; }
  if(pw!==pw2){ state.formError='비밀번호가 서로 달라요. 다시 확인해 주세요.'; render(); return; }
  var admins = await storeAll('cvg_admins');
  if(admins.length>0){
    var cfg = await storeGet('cvg_config','app');
    var required = cfg && cfg.adminCode ? cfg.adminCode : '';
    if(!required){ state.formError='관리자 등록이 잠겨 있어요. 기존 관리자에게 등록코드를 요청해 주세요.'; render(); return; }
    if(code !== required){ state.formError='관리자 등록코드가 올바르지 않아요.'; render(); return; }
  }
  var existing = await storeGet('cvg_admins', id);
  if(existing){ state.formError='이미 등록된 관리자 번호예요.'; render(); return; }
  var hash = await sha256Hex(pw);
  await storeSet('cvg_admins', id, { name:name, passwordHash:hash, createdAt:nowIso() });
  setSession('admin', { id:id, name:name });
  state.formError=''; state.view='list';
  await loadRoster();
  render();
}

// 이수한 과목만 나열하지 않고, 앞으로 뭘 들으면 이 경로의 융합전공 학점을 채울 수 있는지도
// 함께 추천한다. 추천 대상은 (1) 아직 안 한 핵심과목(꼭 필요), (2) 융합전공 자체 개설과목 중
// 안 들은 것, (3) 본인 학과에는 없는 다른 학과의 융합전공 인정과목 중 안 들은 것 — 이 두 묶음은
// 본인 학과 과목이 아니라서 부전공 경로에서도 이중 인정 방지 규칙과 상관없이 항상 인정된다.
function recommendedCourses(student, key){
  var dept = student.dept || '';
  var have = courses(student).map(function(c){ return normName(c.name); });
  var missingCore = CORE_COURSES.filter(function(cc){ return have.indexOf(normName(cc.name)) < 0; });
  var missingCoreNames = missingCore.map(function(cc){ return normName(cc.name); });
  var untaken = COURSE_CATALOG.filter(function(c){ return have.indexOf(normName(c.name)) < 0; });
  var selfCourses = sortByName(untaken.filter(function(c){
    return isSelfConvergenceCourse(c.code) && missingCoreNames.indexOf(normName(c.name)) < 0;
  }));
  var otherDeptCourses = sortByName(untaken.filter(function(c){
    return !isSelfConvergenceCourse(c.code) && !primaryCourseInCatalog(dept, c.code);
  }));
  var info = TRACK_TYPES[key];
  var cvgCur = totalCredits(student);
  var creditsNeeded = Math.max(0, info.convergenceMin - cvgCur);
  return { missingCore:missingCore, selfCourses:selfCourses, otherDeptCourses:otherDeptCourses, creditsNeeded:creditsNeeded };
}
// 과목 목록을 작은 박스형 줄(.reco-item)로 보여준다. showSemester가 true면 이수학기도 같이 적는다.
function courseChipList(list, showSemester){
  if(!list.length) return '<div class="reco-empty">아직 없어요.</div>';
  return '<div class="reco-list">' + list.map(function(c){
    return '<div class="reco-item"><span class="ri-name">'+esc(c.name)+'</span>' +
      '<span class="ri-credit">'+num(c.credits)+'학점'+(showSemester && c.semester ? ', '+esc(c.semester) : '')+'</span></div>';
  }).join('') + '</div>';
}
// 자체 개설과목·다른 학과 인정과목처럼 길어질 수 있는 묶음은 접어두고, 개수·학점만 보여준다.
// 누르면 그 안에 있는 과목을 전부 펼쳐 보여준다(따로 "+ 과목 추가"로 갈 필요 없이).
function recoCollapsibleGroup(groupKey, title, list, groupClass){
  if(!list.length) return '';
  var expanded = !!state.expandedRecGroups[groupKey];
  var totalCr = list.reduce(function(s,c){ return s+num(c.credits); }, 0);
  return '<div class="reco-group '+groupClass+'">' +
    '<button type="button" data-action="toggle-rec-group" data-key="'+esc(groupKey)+'" style="all:unset; display:block; width:100%; cursor:pointer;">' +
      '<div class="rg-title" style="display:flex; justify-content:space-between; align-items:baseline; gap:8px;">' +
        '<span>'+esc(title)+'</span>' +
        '<span style="white-space:nowrap;">'+list.length+'개 · '+totalCr+'학점 '+(expanded?'▲':'▼')+'</span>' +
      '</div>' +
    '</button>' +
    (expanded ? courseChipList(list) : '') +
  '</div>';
}
function recommendedCoursesHtml(student, key){
  var rec = recommendedCourses(student, key);
  var html = '<div class="reco-group self">' +
    '<div class="rg-title">추천 과목'+(rec.creditsNeeded ? ' · 앞으로 '+rec.creditsNeeded+'학점 필요' : '')+'</div>' +
  '</div>';
  if(rec.missingCore.length){
    html += '<div class="reco-group need">' +
      '<div class="rg-title">꼭 필요 · 핵심과목</div>' +
      courseChipList(rec.missingCore) +
    '</div>';
  }
  html += recoCollapsibleGroup('self-'+key, '융합전공 자체 개설과목', rec.selfCourses, 'self');
  html += recoCollapsibleGroup('other-'+key, '다른 학과 융합전공 인정과목', rec.otherDeptCourses, '');
  if(!rec.missingCore.length && !rec.selfCourses.length && !rec.otherDeptCourses.length){
    html += '<div class="reco-empty">추천할 과목이 없어요(이미 다 이수했어요).</div>';
  }
  return '<div class="reco-outer">'+html+'</div>';
}

// 이수학기("YYYY-N") 순으로 정렬할 때 쓰는 키. 학기를 안 적은 과목은 맨 뒤로 보낸다.
function semesterSortKey(s){
  var p = parseSemester(s);
  if(!p.year) return Infinity;
  return Number(p.year)*10 + Number(p.term||0);
}
function sortedBySemester(list){
  return list.slice().sort(function(a,b){
    var ka = semesterSortKey(a.semester), kb = semesterSortKey(b.semester);
    if(ka!==kb) return ka-kb;
    return a.name.localeCompare(b.name, 'ko');
  });
}
function courseListBlock(student, editable){
  var list = sortedBySemester(courses(student));
  var dept = student && student.dept;
  var coreNames = CORE_COURSES.map(function(c){ return normName(c.name); });
  if(!list.length) return '<div class="empty-state">아직 등록된 과목이 없어요.</div>';
  return '<div class="courselist">' + list.map(function(c){
    var isCore = coreNames.indexOf(normName(c.name)) >= 0;

function courseSummaryBox(student, expanded){
  var list = courses(student);
  var counts = courseCategoryCounts(student);
  var totalCredits = list.reduce(function(s,c){ return s+num(c.credits); }, 0);
  var cats = Object.keys(counts).sort(function(a,b){
    var ia = COURSE_CATEGORY_ORDER.indexOf(a); if(ia<0) ia = COURSE_CATEGORY_ORDER.length;
    var ib = COURSE_CATEGORY_ORDER.indexOf(b); if(ib<0) ib = COURSE_CATEGORY_ORDER.length;
    return ia-ib;
  });
  var chips = cats.map(function(cat){
    return '<span class="catpill" style="margin:2px 4px 2px 0;">'+esc(cat)+' '+counts[cat].count+'과목·'+counts[cat].credits+'학점</span>';

    '<div class="row-between" style="margin-bottom:'+(cats.length?'8px':'0')+';">' +
      '<b style="font-size:14px;">'+list.length+'과목 · '+totalCredits+'학점</b>' +
      '<span class="linklike">'+(expanded?'접기 ▲':'펼쳐보기 ▼')+'</span>' +
    '</div>' +
    (cats.length ? '<div>'+chips+'</div>' : '<div class="cm">아직 등록된 과목이 없어요.</div>') +
  '</button>';

  return html;
}

function microdegreeGroupedOptions(pickedKey){

  return order.map(function(g){
    var opts = groups[g].map(function(p){
      return '<option value="'+esc(p.key)+'" '+(pickedKey===p.key?'selected':'')+'>'+esc(p.name)+'</option>';
    }).join('');
    return g ? '<optgroup label="'+esc(g)+'">'+opts+'</optgroup>' : opts;
  }).join('');
}

// PDF로 등록할 때 과목코드·학점·성적확정 같은 글자가 붙어 지저분해진 과목명을 정리하고,
// 과목코드 없이 "새 과목"으로 등록됐지만 사실은 융합전공 인정과목인 것을 이름으로 다시 찾아
// 코드를 붙여주고(학점 계산·"융합전공 과목" 표시에 반영되도록), 그 결과 이름이 같아진 것까지
// 포함해 이름이 같은 과목이 여러 개면 먼저 등록한 것만 남긴다.
function dedupeCourseList(list){
  var seen = {}; var kept = []; var removed = 0; var renamed = 0; var recoded = 0;
  list.forEach(function(c){
    var cleaned = cleanCourseName(c.name);
    var useName = cleaned ? cleaned : c.name; // 정리하면 이름이 통째로 사라지는 경우엔 원래 이름을 그대로 둔다.
    var patched = c;
    if(useName !== c.name){ renamed++; patched = Object.assign({}, patched, { name:useName }); }
    if(!patched.courseCode){
      var matchedCode = courseCodeByCleanName(useName);
      if(matchedCode){ recoded++; patched = Object.assign({}, patched, { courseCode:matchedCode, courseType:undefined }); }
    }
    var key = normName(useName);
    if(seen[key]){ removed++; return; }
    seen[key] = true;
    kept.push(patched);
  });
  return { kept:kept, removed:removed, renamed:renamed, recoded:recoded };
}
async function dedupeStudentCourses(){
  var isAdmin = state.role==='admin';
  var col = 'cvg_students';
  var id = isAdmin ? state.detailId : state.studentSession.id;
  var student = isAdmin ? state.cache.detail : state.cache.me;
  var result = dedupeCourseList(courses(student));
  if(!result.removed && !result.renamed && !result.recoded){ state.formOk = '정리할 과목이 없어요.'; render(); return; }
  await storeUpdate(col, id, { courses: result.kept });
  student.courses = result.kept;
  var parts = [];
  if(result.removed) parts.push('중복 '+result.removed+'개');
  if(result.renamed) parts.push('과목명 '+result.renamed+'개');
  if(result.recoded) parts.push('융합전공 인정 '+result.recoded+'개');
  state.formOk = parts.join(', ')+' 정리했어요.';
  render();
}
// 이수구분 변경 신청(융합전공 이수 규정 제7조③)을 켜거나 끈다. 켤 때는 이미 신청한 학점과
// 합쳐 최대 6학점을 넘지 않는지 확인한다.
async function toggleReclassify(courseId){
  var isAdmin = state.role==='admin';
  var col = 'cvg_students';
  var id = isAdmin ? state.detailId : state.studentSession.id;
  var student = isAdmin ? state.cache.detail : state.cache.me;
  var list = courses(student);
  var target = list.filter(function(c){ return c.id===courseId; })[0];
  if(!target) return;
  if(!target.reclassified){
    var current = reclassifiedCredits(student);
    if(current + num(target.credits) > RECLASSIFY_MAX_CREDITS){
      state.formError = '이수구분 변경 신청은 최대 '+RECLASSIFY_MAX_CREDITS+'학점까지만 가능해요(지금 '+current+'학점 신청함).';
      render();
      return;
    }
  }
  var newList = list.map(function(c){ return c.id===courseId ? Object.assign({}, c, { reclassified: !c.reclassified }) : c; });
  await storeUpdate(col, id, { courses:newList });
  student.courses = newList;
  state.formOk = target.reclassified ? '이수구분 변경 신청을 취소했어요.' : '이수구분 변경을 신청했어요. 이제 융합전공 학점으로 인정돼요.';
  render();
}
async function saveBulkCourses(mids, fallbackSemester){
  var isAdmin = state.role==='admin';
  var col = 'cvg_students';
  var id = isAdmin ? state.detailId : state.studentSession.id;
  var student = isAdmin ? state.cache.detail : state.cache.me;
  var pdfMatches = (state.cache.pdf && state.cache.pdf.matches) || [];
  var list = courses(student).slice();
  var added = 0, skipped = 0;
  mids.forEach(function(mid){
    var info = pdfMatches.filter(function(m){ return m.mid===mid; })[0];
    if(!info) return;
    if(courseNameExists(list, info.name)){ skipped++; return; } // 이미 등록됐거나 이번에 앞에서 추가된 과목이면 건너뜀
    var semester = info.semester || fallbackSemester || '';
    list.push({ id:uid(), name:info.name, credits:info.credits, semester:semester,
      courseCode: info.code || null, courseType: info.isNew ? info.courseType : undefined });
    added++;
  });
  await storeUpdate(col, id, { courses:list });
  student.courses = list;
  state.cache.pdf = null; state.formError='';
  state.formOk = added+'개 과목을 추가했어요.' + (skipped ? ' (중복 '+skipped+'개는 건너뜀)' : '');
  state.view = isAdmin ? 'detail' : 'home';
  render();
}

async function changePassword(oldPw, newPw, newPw2){
  if(newPw.length<6){ state.formError='새 비밀번호는 6자 이상이어야 해요.'; render(); return; }
  if(newPw!==newPw2){ state.formError='새 비밀번호가 서로 달라요.'; render(); return; }
  var isAdmin = state.role==='admin';
  var col = isAdmin ? 'cvg_admins' : 'cvg_students';
  var id = isAdmin ? state.adminSession.id : state.studentSession.id;
  var doc = await storeGet(col, id);
  var oldHash = await sha256Hex(oldPw);
  if(oldHash !== doc.passwordHash){ state.formError='현재 비밀번호가 올바르지 않아요.'; render(); return; }
  var newHash = await sha256Hex(newPw);
  await storeUpdate(col, id, { passwordHash:newHash });
  state.formError=''; state.formOk='비밀번호를 바꿨어요.';
  state.view = isAdmin ? 'list' : 'home';
  render();
}

async function openDetail(id){
  state.detailId = id;
  state.cache.detail = await storeGet('cvg_students', id);
  state.view='detail'; state.formOk=''; state.formError='';
  render();
}
async function resetStudentPassword(){
  var tempPw = '000000';
  var hash = await sha256Hex(tempPw);
  await storeUpdate('cvg_students', state.detailId, { passwordHash:hash });
  state.formOk = '비밀번호를 '+tempPw+' 로 초기화했어요. 학생에게 알려주세요.';
  render();
}
async function deleteStudent(){
  if(!window.confirm('정말 이 학생을 삭제할까요? 되돌릴 수 없어요.')) return;
  await storeDelete('cvg_students', state.detailId);
  state.view='list'; state.detailId=null; state.cache.detail=null;
  await loadRoster();
  render();
}
async function saveAdminCode(code){
  await storeUpdate('cvg_config', 'app', { adminCode: code.trim() });
  state.cache.adminCode = code.trim();
  state.formOk = '등록코드를 저장했어요.';
  render();
}
async function saveCoreCourses(codes){
  await storeUpdate('cvg_config', 'app', { coreCourseCodes: codes });
  applyCoreCourseCodes(codes);
  state.formOk = '핵심과목을 저장했어요.';
  render();
}

      '<ul>' +

        '<li>인정학기·제1전공 학점·졸업논문 같은 이수정보도 대신 수정할 수 있습니다.</li>' +
        '<li><b>비밀번호 초기화</b>는 임시 비밀번호(000000)로 바꿔주니 학생에게 알려주세요.</li>' +
        '<li><b>학생 삭제</b>는 되돌릴 수 없으니 신중하게 사용해 주세요.</li>' +

/* ============ 이벤트 처리 ============ */
document.addEventListener('submit', function(e){
  var f = e.target;
  if(f.id==='form-login'){
    e.preventDefault();
    doLogin(state.role, f.querySelector('#loginId').value.trim(), f.querySelector('#loginPw').value).catch(failWith);
  }
  if(f.id==='form-register'){
    e.preventDefault();
    doRegisterStudent(
      f.querySelector('#regId').value.trim(), f.querySelector('#regName').value.trim(),
      f.querySelector('#regDept').value.trim(), f.querySelector('#regYear').value.trim(),
      f.querySelector('#regPw').value, f.querySelector('#regPw2').value
    ).catch(failWith);
  }
  if(f.id==='form-register-admin'){
    e.preventDefault();
    doRegisterAdmin(
      f.querySelector('#raId').value.trim(), f.querySelector('#raName').value.trim(),
      f.querySelector('#raPw').value, f.querySelector('#raPw2').value, f.querySelector('#raCode').value.trim()
    ).catch(failWith);
  }
  if(f.id==='form-course'){
    e.preventDefault();
    saveCourse(f).catch(failWith);
  }
  if(f.id==='form-course-upload'){
    e.preventDefault();
    var checkedCodes = Array.prototype.slice.call(f.querySelectorAll('.pdfMatchChk:checked')).map(function(el){ return el.value; });
    if(!checkedCodes.length){ state.formError='추가할 과목을 하나 이상 선택해 주세요.'; render(); }
    else{
      var uYear = f.querySelector('#cYear').value;
      var uTerm = f.querySelector('#cTerm').value;
      var uSemester = (uYear && uTerm) ? (uYear+'-'+uTerm) : '';
      saveBulkCourses(checkedCodes, uSemester).catch(failWith);
    }
  }
  if(f.id==='form-microdegree'){
    e.preventDefault();
    saveMicrodegree(f).catch(failWith);
  }
  if(f.id==='form-info'){
    e.preventDefault();
    saveInfo(f).catch(failWith);
  }
  if(f.id==='form-changepw'){
    e.preventDefault();
    changePassword(f.querySelector('#pwOld').value, f.querySelector('#pwNew').value, f.querySelector('#pwNew2').value).catch(failWith);
  }
  if(f.id==='form-admincode'){
    e.preventDefault();
    saveAdminCode(f.querySelector('#adminCode').value).catch(failWith);
  }
  if(f.id==='form-corecourses'){
    e.preventDefault();
    var codes = [0,1,2].map(function(i){ return f.querySelector('#coreSlot'+i).value; }).filter(function(v){ return v; });
    codes = codes.filter(function(v, i){ return codes.indexOf(v)===i; });
    saveCoreCourses(codes).catch(failWith);
  }
});

document.addEventListener('input', function(e){
  var bind = e.target.dataset && e.target.dataset.bind;
  if(!bind) return;
  state[bind] = e.target.value;
  // 한글 등 조합 중(e.isComposing)에 화면을 다시 그리면 입력 중인 글자가 깨진다.
  // 조합이 끝난 뒤(isComposing=false로 다시 오는 input 이벤트)에만 다시 그린다.
  if(e.isComposing) return;
  render();
  var el = bind==='q' ? document.querySelector('[data-bind="q"]') : null;
  if(el){ el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
});

document.addEventListener('change', async function(e){
  if(e.target.id === 'cCourse'){
    var form = e.target.closest('form');
    var wrap = form.querySelector('#cCustomWrap');
    var typeWrap = form.querySelector('#cTypeWrap');
    var creditsInput = form.querySelector('#cCredits');
    var s = state.role==='admin' ? state.cache.detail : state.cache.me;
    if(e.target.value === '__custom__'){
      wrap.style.display = 'block';
      typeWrap.style.display = 'block';
    } else {
      wrap.style.display = 'none';
      typeWrap.style.display = 'none';
      var c = anyCourseInfo(s.dept||'', e.target.value);
      if(c) creditsInput.value = c.credits;
    }
  }
  if(e.target.id === 'pdfFile'){
    var file = e.target.files[0];
    if(!file) return;
    var stu = state.role==='admin' ? state.cache.detail : state.cache.me;
    var dept = stu.dept || '';
    var existingCodes = courses(stu).filter(function(c){ return c.courseCode; }).map(function(c){ return c.courseCode; });
    var existingNames = courses(stu).map(function(c){ return normName(c.name); });
    state.cache.pdf = { status:'parsing', matches:[], error:'' };
    render();
    try{
      var lines = await extractPdfText(file);
      var knownMatches = matchCoursesFromText(lines, dept, existingCodes);
      var newMatches = extractUnknownMajorCourses(lines, knownMatches, existingNames);
      state.cache.pdf = { status:'done', matches: knownMatches.concat(newMatches), error:'' };
    }catch(err){
      state.cache.pdf = { status:'error', matches:[], error: errMsg(err) };
    }
    render();
  }
});

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var act = el.dataset.action;
  state.formError='';
  if(act==='open-guide'){ state.mode='guide'; state.guideRole = state.role==='admin'?'admin':'student'; window.scrollTo(0,0); }
  else if(act==='close-guide'){ state.mode='app'; }
  else if(act==='set-guide-role'){ state.guideRole = el.dataset.role; window.scrollTo(0,0); }
  else if(act==='set-role'){ state.role = el.dataset.role; state.view='login'; state.formOk=''; }
  else if(act==='goto-register'){ state.view='register'; }
  else if(act==='goto-register-admin'){ state.view='register-admin'; }
  else if(act==='goto-login'){ state.view='login'; state.formOk=''; }
  else if(act==='goto-home'){ state.view='home'; state.editingCourseId=null; state.cache.pdf=null; }
  else if(act==='goto-list'){
    state.view='list'; state.formOk='';
    loadRoster().then(render);
    render(); return;
  }
  else if(act==='goto-detail'){ state.view='detail'; state.editingCourseId=null; state.cache.pdf=null; }
  else if(act==='goto-course-form'){ state.editingCourseId=null; state.view='course-form'; }
  else if(act==='goto-course-upload-form'){ state.cache.pdf=null; state.view='course-upload-form'; }
  else if(act==='retry-course-upload'){ state.cache.pdf=null; }
  else if(act==='goto-microdegree-form'){ state.editingMicrodegreeId=null; state.view='microdegree-form'; }
  else if(act==='goto-info-form'){ state.view='info-form'; }
  else if(act==='open-install'){
    if(deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.then(function(){ deferredInstallPrompt=null; render(); });
      return;
    }
    state.showInstallModal = true;
  }
  else if(act==='close-install'){ state.showInstallModal = false; }
  else if(act==='toggle-course-detail'){ state.showCourseDetail = !state.showCourseDetail; }
  else if(act==='toggle-track-detail'){ state.expandedTrack = (state.expandedTrack===el.dataset.key) ? null : el.dataset.key; }
  else if(act==='toggle-rec-group'){ var rk=el.dataset.key; state.expandedRecGroups[rk] = !state.expandedRecGroups[rk]; }
  else if(act==='toggle-explain'){ var eid=el.dataset.id; state.expandedExplain[eid] = !state.expandedExplain[eid]; }
  else if(act==='edit-course'){ state.editingCourseId = el.dataset.id; state.view='course-form'; }
  else if(act==='delete-course'){ deleteCourse(el.dataset.id).catch(failWith); return; }
  else if(act==='dedupe-courses'){ dedupeStudentCourses().catch(failWith); return; }
  else if(act==='toggle-reclassify'){ toggleReclassify(el.dataset.id).catch(failWith); return; }
  else if(act==='edit-microdegree'){ state.editingMicrodegreeId = el.dataset.id; state.view='microdegree-form'; }
  else if(act==='delete-microdegree'){ deleteMicrodegree(el.dataset.id).catch(failWith); return; }
  else if(act==='goto-profile'){ state.formOk=''; state.view='profile'; }
  else if(act==='goto-settings'){
    state.view='settings'; state.formOk='';
    storeGet('cvg_config','app').then(function(cfg){ state.cache.adminCode = cfg?cfg.adminCode:''; render(); });
    render(); return;
  }
  else if(act==='open-detail'){ openDetail(el.dataset.id).catch(failWith); return; }
  else if(act==='reset-password'){ resetStudentPassword().catch(failWith); return; }
  else if(act==='delete-student'){ deleteStudent().catch(failWith); return; }
  else if(act==='logout'){ setSession(state.role, null); state.view='login'; state.formOk=''; }
  render();
});

/* ============ 앱 설치(PWA) ============ */
var deferredInstallPrompt = null;
function isInstalledStandalone(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
}
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredInstallPrompt = e;
  render();
});
window.addEventListener('appinstalled', function(){ deferredInstallPrompt = null; render(); });

/* ============ 시작 ============ */
loadFallback();
loadSessions();
if(state.studentSession){ state.role='student'; state.view='home'; }
else if(state.adminSession){ state.role='admin'; state.view='list'; }
lastNavSnapshot = JSON.stringify(navSnapshot());
try{ history.replaceState(navSnapshot(), ''); }catch(e){}
render();

(async function boot(){
  try{
    await loadCoreCourses();
    if(state.role==='student' && state.studentSession){ await loadMe(); }
    else if(state.role==='admin' && state.adminSession){ await loadRoster(); }
  }catch(e){ state.formError = errMsg(e); }
  render();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
})();
</script>

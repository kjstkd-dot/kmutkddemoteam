<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>융합전공 이수 현황판</title>
<meta name="theme-color" content="#2F8F5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="융합전공현황">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EEF7F0; --surface-3:#F8FAFC;
  --border:#E6E9ED; --text:#22303F; --text-muted:#79828C; --text-faint:#9AA3AC;
  --primary:#2F8F5B; --primary-dark:#1F7346; --primary-contrast:#FFFFFF;
  --banner:linear-gradient(90deg,#1F7346,#4FBE85);
  --grad-1:#2F8F5B; --grad-2:#63C793;
  --amber:#B57A08; --amber-bg:#FDF8EC; --amber-border:#F6E3B8;
  --danger:#D32027; --danger-bg:#FDF1F1; --danger-border:#F7CFD1;
  --success:#12805A; --success-bg:#E8F6F0;
  --overlay:rgba(20,28,38,.5);
  --radius-s:8px; --radius-m:14px; --radius-l:18px;
  --shadow-card:0 1px 2px rgba(34,48,63,.05), 0 8px 22px -14px rgba(34,48,63,.2);
  --font-display:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-body:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'JetBrains Mono','SFMono-Regular',monospace;
  --track:#EAEDF1;
}
*{box-sizing:border-box;}
html{background:var(--bg);}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); padding:28px 16px 64px; min-height:100vh;}
h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0; font-weight:800; letter-spacing:-.01em;}
button{font-family:inherit;}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
::selection{background:var(--primary); color:var(--primary-contrast);}

.page{max-width:1080px; margin:0 auto; display:flex; flex-direction:column; align-items:center; gap:18px;}
.topbar{width:100%; max-width:460px; display:flex; align-items:center; justify-content:space-between;
  gap:16px; flex-wrap:wrap; padding:20px 22px; border-radius:16px; color:#fff;
  background:linear-gradient(100deg, var(--grad-1), var(--grad-2)); box-shadow:var(--shadow-card);}
.page.wide .topbar, .page.wide .roletabs, .page.wide .phone{max-width:1000px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{width:38px; height:38px; border-radius:11px; background:rgba(255,255,255,.22); color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; flex:none;}
.brand-text strong{display:block; font-size:18px; font-weight:900; letter-spacing:-.01em; color:#fff;}
.brand-text span{display:block; font-size:11.5px; color:rgba(255,255,255,.86); margin-top:2px; line-height:1.4; word-break:keep-all;}
.topbar-actions{display:flex; gap:6px; margin-left:auto;}
.ghost-btn{border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.16); color:#fff;
  font-size:12.5px; font-weight:600; padding:8px 12px; border-radius:8px; cursor:pointer; white-space:nowrap;}
.ghost-btn:hover{background:rgba(255,255,255,.28); border-color:rgba(255,255,255,.65);}

.roletabs{width:100%; max-width:460px; display:flex; gap:8px; background:var(--surface-2); padding:5px; border-radius:999px;}
.roletab{flex:1; border:none; background:transparent; padding:9px 0; border-radius:999px; font-size:13.5px; font-weight:600; color:var(--text-muted); cursor:pointer;}
.roletab.active{background:var(--surface); color:var(--primary); box-shadow:var(--shadow-card);}

.phone{width:100%; max-width:460px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); box-shadow:var(--shadow-card); padding:24px 20px; position:relative; min-height:300px;}
.eyebrow{font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint);}
.screen-title{font-size:21px; margin-top:6px; margin-bottom:4px; word-break:keep-all;}
.screen-sub{font-size:13px; color:var(--text-muted); margin-bottom:18px;}

.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
.field label{font-size:12.5px; font-weight:600; color:var(--text-muted);}
.field input, .field select{border:1px solid var(--border); background:var(--surface-3); color:var(--text); border-radius:var(--radius-s); padding:11px 13px; font-size:14px; font-family:var(--font-body); width:100%;}
.field input:focus, .field select:focus{outline:2px solid var(--primary); outline-offset:1px; background:var(--surface);}
.field .hint{font-size:11.5px; color:var(--text-faint); line-height:1.5;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:var(--radius-s); border:1px solid transparent; font-weight:700; font-size:14.5px; padding:12px 16px; cursor:pointer; width:100%;}
.btn-primary{background:var(--primary); color:var(--primary-contrast);}
.btn-primary:hover{background:var(--primary-dark);}
.btn-ghost{background:var(--surface-2); color:var(--primary); border-color:var(--border);}
.btn-ghost:hover{border-color:var(--primary);}
.btn-line{background:transparent; color:var(--text-muted); border:1px dashed var(--border);}
.btn-danger{background:var(--danger-bg); color:var(--danger); border-color:var(--danger-border);}
.btn-small{width:auto; padding:8px 12px; font-size:12.5px;}
.linklike{background:none; border:none; color:var(--primary); font-weight:600; font-size:12.5px; cursor:pointer; padding:0; white-space:nowrap;}
.row{display:flex; align-items:center; gap:10px;}
.row-between{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px;}
.stack{display:flex; flex-direction:column; gap:10px;}

.notice-box{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-m); padding:13px 15px; font-size:12.5px; color:var(--text-muted); line-height:1.55; margin-bottom:16px;}
.errbox{background:var(--danger-bg); border:1px solid var(--danger-border); color:var(--danger); border-radius:var(--radius-s); padding:10px 13px; font-size:12.5px; margin-bottom:14px; font-weight:600;}
.okbox{background:var(--success-bg); border:1px solid var(--border); color:var(--success); border-radius:var(--radius-s); padding:10px 13px; font-size:12.5px; margin-bottom:14px; font-weight:600;}
.empty-state{text-align:center; padding:36px 12px; color:var(--text-faint); font-size:13px;}

/* 진행률 요약 */
.statusband{display:flex; align-items:center; gap:12px; border-radius:var(--radius-m); padding:14px 16px; margin-bottom:16px; color:#fff;}
.statusband.met{background:linear-gradient(100deg,#1F7346,#4FBE85);}
.statusband.unmet{background:linear-gradient(100deg,#B5580E,#E0904A);}
.statusband .mark{width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:17px; flex:none;}
.statusband b{display:block; font-size:15px;}
.statusband span{display:block; font-size:11.5px; opacity:.9; margin-top:2px;}
.catcard{border:1px solid var(--border); border-radius:var(--radius-m); padding:12px 14px; margin-bottom:10px; background:var(--surface-3);}
.catcard .cthead{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px; gap:8px;}
.catcard .cthead b{font-size:13.5px;}
.catcard .cthead span{font-size:12px; font-weight:700; color:var(--text-muted); font-family:var(--font-mono); white-space:nowrap;}
.catcard.met .cthead span{color:var(--success);}
.pbar{height:9px; border-radius:5px; background:var(--track); overflow:hidden; position:relative;}
.pbar i{position:absolute; left:0; top:0; bottom:0; border-radius:5px; background:var(--primary);}
.catcard.met .pbar i{background:var(--success);}
.totalline{font-size:13px; color:var(--text-muted); margin:14px 0 4px; display:flex; justify-content:space-between; align-items:baseline;}
.totalline b{color:var(--text); font-size:15px;}

/* 과목 목록 */
.courselist{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
.courserow{display:flex; align-items:center; gap:10px; border:1px solid var(--border); border-radius:var(--radius-s); padding:10px 12px; background:var(--surface);}
.courserow .ci{flex:1; min-width:0;}
.courserow .cn{font-weight:700; font-size:13.5px; word-break:break-all;}
.courserow .cm{font-size:11.5px; color:var(--text-faint); margin-top:2px;}
.courserow .cc{font-size:13px; font-weight:800; font-family:var(--font-mono); color:var(--primary); white-space:nowrap;}
.courserow .cact{display:flex; gap:4px;}
.icobtn{border:1px solid var(--border); background:var(--surface-3); color:var(--text-muted); font-size:12px; padding:6px 9px; border-radius:7px; cursor:pointer;}
.icobtn:hover{border-color:var(--primary); color:var(--primary);}
.icobtn.danger:hover{border-color:var(--danger); color:var(--danger);}
.catpill{display:inline-block; font-size:10px; font-weight:800; padding:2px 7px; border-radius:999px; background:var(--surface-2); color:var(--primary); margin-right:4px;}

/* admin board */
.summary{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px;}
.tile{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow-card);}
.tile .num{font-size:28px; font-weight:700; font-family:var(--font-mono); line-height:1; color:var(--primary);}
.tile.t-danger .num{color:var(--danger);}
.tile .lbl{color:var(--text-muted); font-size:11.5px; margin-top:6px; line-height:1.4;}
.controls{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.controls input, .controls select{border:1px solid var(--border); background:var(--surface-3); color:var(--text); border-radius:var(--radius-s); padding:9px 12px; font-size:13px; font-family:var(--font-body);}
.controls input{flex:1; min-width:150px;}
.roster{display:flex; flex-direction:column; gap:9px;}
.rcard{border:1px solid var(--border); border-left:4px solid var(--border); border-radius:var(--radius-m); padding:12px 13px; background:var(--surface); cursor:pointer;}
.rcard:hover{border-color:var(--primary);}
.rcard.met{border-left-color:var(--success);}
.rcard.unmet{border-left-color:var(--amber);}
.rcard .nm{font-weight:700; font-size:14px;}
.rcard .mt{font-size:11px; color:var(--text-faint); margin-top:2px;}
.rcard .mini{display:flex; justify-content:space-between; align-items:center; margin-top:8px;}
.badge{font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px;}
.badge.met{background:var(--success-bg); color:var(--success);}
.badge.unmet{background:var(--amber-bg); color:var(--amber);}

.overlay{position:fixed; inset:0; background:var(--overlay); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
.modal{width:100%; max-width:420px; background:var(--surface); border-radius:var(--radius-l); padding:22px 20px; box-shadow:var(--shadow-card); max-height:86vh; overflow-y:auto;}
.modal h3{font-size:17px; margin-bottom:4px;}
.modal .modal-sub{font-size:12.5px; color:var(--text-muted); margin-bottom:16px;}
.modal-actions{display:flex; gap:8px; margin-top:16px;}
.modal-actions .btn{width:auto; flex:1;}
.footer-note{font-size:11px; color:var(--text-faint); text-align:center; margin-top:8px;}
.guide-link{border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.16); color:#fff;
  font-size:12.5px; font-weight:600; padding:8px 12px; border-radius:8px; cursor:pointer; white-space:nowrap;}
.guide-link:hover{background:rgba(255,255,255,.28); border-color:rgba(255,255,255,.65);}

/* 이용안내 */
.guide-shell{width:100%; max-width:640px; display:flex; flex-direction:column; gap:18px;}
.guide-hero{background:linear-gradient(160deg, var(--primary), var(--primary-dark)); color:#fff; border-radius:var(--radius-l); padding:28px 26px; box-shadow:var(--shadow-card);}
.guide-hero .eyebrow{color:rgba(255,255,255,.75);}
.guide-hero h1{font-size:26px; color:#fff; margin:8px 0 10px;}
.guide-hero p{font-size:13.5px; color:rgba(255,255,255,.88); margin:0 0 14px; line-height:1.6;}
.guide-hero .back{color:#fff; font-weight:700; font-size:13px; text-decoration:underline; background:none; border:none; cursor:pointer; padding:0;}
.guide-tabs{display:flex; gap:8px; background:var(--surface-2); padding:5px; border-radius:999px;}
.guide-tabs button{flex:1; border:none; background:transparent; padding:9px 0; border-radius:999px; font-weight:700; font-size:13px; color:var(--text-muted); cursor:pointer;}
.guide-tabs button.active{background:var(--surface); color:var(--primary); box-shadow:var(--shadow-card);}
.guide-note{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-m); padding:15px 17px; font-size:13px; line-height:1.65; color:var(--text-muted);}
.guide-note b{color:var(--text);}
.step{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); padding:22px 20px; box-shadow:var(--shadow-card);}
.step-num{width:32px; height:32px; border-radius:50%; background:var(--primary); color:var(--primary-contrast); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:14px; margin-bottom:12px;}
.step h2{font-size:18px; margin-bottom:9px;}
.step p{font-size:13.5px; line-height:1.7; margin:0 0 9px;}
.step ul{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:7px;}
.step li{font-size:13.5px; line-height:1.6;}
.plat-title{font-size:13px; font-weight:800; margin:14px 0 8px; display:flex; align-items:center; gap:6px;}
.plat-title:first-of-type{margin-top:2px;}
.install-steps{counter-reset:step; display:flex; flex-direction:column; gap:9px; margin:0; padding:0; list-style:none;}
.install-steps li{position:relative; padding-left:28px; font-size:13px; line-height:1.6;}
.install-steps li::before{counter-increment:step; content:counter(step); position:absolute; left:0; top:1px;
  width:20px; height:20px; border-radius:50%; background:var(--primary); color:#fff;
  font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center;}

@media (max-width:520px){
  body{padding:18px 12px 48px;}
  .summary{grid-template-columns:repeat(3,1fr); gap:8px;}
  .tile{padding:11px 10px;}
  .tile .num{font-size:22px;}
  .grid2,.grid3{grid-template-columns:1fr 1fr;}
  .guide-hero{padding:22px 18px;}
  .step{padding:19px 16px;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

/* ============ helpers ============ */
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function nowIso(){ return new Date().toISOString(); }
async function sha256Hex(str){
  var enc = new TextEncoder().encode(str);
  var buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}
function num(v){ var n = Number(v); return isFinite(n) ? n : 0; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ============ 저장소 설정 ============
   구글 Apps Script 주소를 아래 따옴표 사이에 붙여넣으면 서버 저장으로 바뀝니다.
   비워두면 이 기기 안에만 저장됩니다(시험용).
   설치 방법은 apps-script.gs 맨 위 설명을 참고하세요.
   예: var API_URL = 'https://script.google.com/macros/s/AKfy...../exec'; */
var API_URL = '';

// 화면 아래에 표시되는 판 번호. 고칠 때마다 올린다.
var APP_VERSION = '2026-09-16 f';

/* ============ store: 서버 → 기기저장 순으로 사용 ============ */
var apiMode = !!API_URL;
var fallbackData = {};

function loadFallback(){
  try{ var raw = localStorage.getItem('cvg_store'); fallbackData = raw ? JSON.parse(raw) : {}; }
  catch(e){ fallbackData = {}; }
}
function saveFallback(){
  try{ localStorage.setItem('cvg_store', JSON.stringify(fallbackData)); }catch(e){}
}
async function apiCall(action, body){
  var res;
  var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 40000) : null;
  try{
    res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: action }, body || {})),
      signal: ctrl ? ctrl.signal : undefined
    });
  }catch(e){
    if(e && e.name === 'AbortError'){
      throw new Error('자료 서버 응답이 너무 느립니다. 잠시 후 다시 시도해 주세요.');
    }
    throw new Error('자료 서버에 연결하지 못했습니다. 구글 Apps Script 배포에서 "액세스 권한이 있는 사용자"가 "모든 사용자"인지 확인해 주세요.');
  }finally{
    if(timer) clearTimeout(timer);
  }
  if(!res.ok) throw new Error('자료 서버 응답 오류 (' + res.status + ')');
  var text = await res.text();
  var out;
  try{ out = JSON.parse(text); }
  catch(e){ throw new Error('자료 서버가 예상과 다른 답을 보냈습니다.'); }
  if(out && out.error) throw new Error(out.error);
  return out;
}
async function storeGet(col, id){
  if(apiMode){ var r = await apiCall('get', {collection:col, id:id}); return r.doc || null; }
  var d = (fallbackData[col]||{})[id];
  return d ? Object.assign({id:id}, d) : null;
}
async function storeSet(col, id, data){
  if(apiMode){ await apiCall('set', {collection:col, id:id, data:data}); return; }
  fallbackData[col] = fallbackData[col]||{}; fallbackData[col][id] = data; saveFallback();
}
async function storeUpdate(col, id, data){
  if(apiMode){ await apiCall('update', {collection:col, id:id, data:data}); return; }
  fallbackData[col] = fallbackData[col]||{};
  fallbackData[col][id] = Object.assign({}, fallbackData[col][id]||{}, data);
  saveFallback();
}
async function storeDelete(col, id){
  if(apiMode){ await apiCall('delete', {collection:col, id:id}); return; }
  if(fallbackData[col]) delete fallbackData[col][id];
  saveFallback();
}
async function storeAll(col){
  if(apiMode){ var r = await apiCall('all', {collection:col}); return r.docs || []; }
  var all = fallbackData[col]||{};
  return Object.keys(all).map(function(id){ return Object.assign({id:id}, all[id]); });
}

/* ============ 융합전공 이수 조건 ============
   계명대학교 "융합전공 이수 규정" 제4조·제5조·제7조 기준. */
var TRACK_NAME = '글로벌K-공연콘텐츠전공';
var PARTICIPATING_DEPTS = ['태권도학과', '연극뮤지컬과', '무용학과', '영어영문학과'];
// 핵심과목(제4조②, 최대 3과목)은 코드에 미리 넣지 않고 관리자 설정 화면에서
// 나중에 고를 수 있게 비워둔다. cvg_config/app 문서의 coreCourseCodes에 저장된다.
var CORE_COURSES = [];
// 2026년도 연계전공(융합전공) 교육과정표에 실린 개설 과목 목록. 편성표가 바뀌면 이 배열을 고쳐주세요.
var COURSE_CATALOG = [
  { code:'7567', name:'체조', credits:1 },
  { code:'8223', name:'몸짓과표현', credits:2 },
  { code:'4463', name:'무대기술법', credits:2 },
  { code:'4714', name:'공연예술의이해와감상', credits:2 },
  { code:'4693', name:'기초무대기술', credits:2 },
  { code:'4649', name:'극장실습(1)', credits:1 },
  { code:'5588', name:'필라테스(1)', credits:1 },
  { code:'0562', name:'심화영어회화(1)', credits:3 },

var DOUBLE_MAJOR_MIN = 33;      // 제7조① 복수전공: 33학점(핵심과목 포함) 이상
var MINOR_MIN = 15;             // 제7조② 부전공: 15학점(핵심과목 포함) 이상 (단일/2개 이상 동일)
var MINOR_PRIMARY_SINGLE = 54;  // 제7조② 부전공 1개 이수 시 제1전공 54학점 이상
var MINOR_PRIMARY_MULTI = 42;   // 제7조② 융합 부전공 2개 이상 이수 시 제1전공 각 42학점 이상
var APPLY_MIN_SEMESTERS = 3;    // 제5조 이수신청 자격: 인정학기 3학기 이상

var TRACK_TYPES = {
  double:      { label:'복수전공', convergenceMin: DOUBLE_MAJOR_MIN },
  minor_single:{ label:'부전공(1개)', convergenceMin: MINOR_MIN, primaryMin: MINOR_PRIMARY_SINGLE },
  minor_multi: { label:'부전공(2개 이상 동시이수)', convergenceMin: MINOR_MIN, primaryMin: MINOR_PRIMARY_MULTI }
};
function trackTypeOf(student){ return TRACK_TYPES[student && student.trackType] ? student.trackType : 'double'; }
function trackInfo(student){ return TRACK_TYPES[trackTypeOf(student)]; }
function courses(student){ return (student && student.courses) || []; }
function normName(s){ return String(s==null?'':s).replace(/\s+/g,''); }
function totalCredits(student){
  return courses(student).reduce(function(s,c){ return s + num(c.credits); }, 0);
}
function coreStatus(student){
  var have = courses(student).map(function(c){ return normName(c.name); });
  return CORE_COURSES.map(function(cc){
    return { name:cc.name, credits:cc.credits, done: have.indexOf(normName(cc.name)) >= 0 };
  });
}
function coreDoneCount(student){ return coreStatus(student).filter(function(x){ return x.done; }).length; }
function coreMet(student){ return coreDoneCount(student) >= CORE_COURSES.length; }
function convergenceMin(student){ return trackInfo(student).convergenceMin; }
function convergenceMet(student){ return coreMet(student) && totalCredits(student) >= convergenceMin(student); }
function primaryMin(student){ return trackInfo(student).primaryMin || null; }
function primaryMet(student){
  var min = primaryMin(student);
  return min==null ? true : num(student.primaryMajorCredits) >= min;
}
// 학칙 제44조①: 복수전공(융합전공 포함)으로 이수하는 경우, 제1전공 학과의 졸업논문이
// 필수과목이면 반드시 이수해야 한다. 부전공 이수자에게는 적용되지 않는다.
function thesisApplies(student){ return trackTypeOf(student)==='double' && !!student.thesisRequired; }
function thesisMet(student){ return !thesisApplies(student) || !!student.thesisDone; }
function allMet(student){ return convergenceMet(student) && primaryMet(student) && thesisMet(student); }
function eligibleToApply(student){ return num(student.recognizedSemesters) >= APPLY_MIN_SEMESTERS; }
function pct(cur, min){ return min>0 ? Math.min(100, Math.round(cur/min*100)) : 100; }

async function doLogin(role, id, pw){
  var col = role==='student' ? 'cvg_students' : 'cvg_admins';
  var doc = await storeGet(col, id);
  var label = role==='student' ? '학번' : '관리자 번호';
  if(!doc){ state.formError = '등록되지 않은 '+label+'이에요. 처음이시라면 비밀번호 설정하기를 눌러주세요.'; render(); return; }
  var hash = await sha256Hex(pw);
  if(hash !== doc.passwordHash){ state.formError = label+' 또는 비밀번호가 올바르지 않아요.'; render(); return; }
  state.formError=''; state.formOk='';
  if(role==='student'){
    setSession('student', { id:id, name:doc.name });
    state.cache.me = doc;
    state.view='home';
  } else {
    setSession('admin', { id:id, name:doc.name });
    state.view='list';

async function doRegisterStudent(id, name, dept, year, pw, pw2){
  if(!id || !name){ state.formError='학번과 이름을 입력해 주세요.'; render(); return; }
  if(pw.length<6){ state.formError='비밀번호는 6자 이상이어야 해요.'; render(); return; }

  var existing = await storeGet('cvg_students', id);
  if(existing){ state.formError='이미 등록된 학번이에요. 로그인해 주세요.'; render(); return; }
  var hash = await sha256Hex(pw);
  var doc = { name:name, dept:dept||'', year:year||'', passwordHash:hash, courses:[],
    trackType:'double', recognizedSemesters:'', primaryMajorCredits:0,
    microdegreeKey:'', microdegreeCredits:0, thesisRequired:false, thesisDone:false, createdAt:nowIso() };
  await storeSet('cvg_students', id, doc);

async function doRegisterAdmin(id, name, pw, pw2, code){

  if(pw.length<6){ state.formError='비밀번호는 6자 이상이어야 해요.'; render(); return; }
  if(pw!==pw2){ state.formError='비밀번호가 서로 달라요. 다시 확인해 주세요.'; render(); return; }
  var admins = await storeAll('cvg_admins');
  if(admins.length>0){
    var cfg = await storeGet('cvg_config','app');
    var required = cfg && cfg.adminCode ? cfg.adminCode : '';
    if(!required){ state.formError='관리자 등록이 잠겨 있어요. 기존 관리자에게 등록코드를 요청해 주세요.'; render(); return; }

  if(existing){ state.formError='이미 등록된 관리자 번호예요.'; render(); return; }

function progressBlock(student){
  var met = allMet(student);
  var info = trackInfo(student);
  var cvgCur = totalCredits(student), cvgMin = convergenceMin(student);
  var cvgOk = cvgCur >= cvgMin;
  var core = coreStatus(student);
  var coreOkCount = core.filter(function(x){ return x.done; }).length;
  var html = '';
  html += '<div class="statusband '+(met?'met':'unmet')+'">' +
    '<div class="mark">'+(met?'✓':'!')+'</div>' +
    '<div><b>'+(met?'융합전공 이수 조건 충족':'아직 이수 조건 미충족')+'</b>' +
    '<span>'+esc(info.label)+' · 인정학기 '+(eligibleToApply(student)?'신청 가능':'신청 자격 미충족(3학기 이상 필요)')+'</span></div>' +
  '</div>';
  if(!met){
    html += '<div class="notice-box">제1전공 졸업요건은 충족했지만 이 융합전공 요건을 아직 못 채웠다면, ' +
      '정해진 기간 내에 학사학위취득 유예를 신청할 수 있어요(최대 2회, 학칙 제69조의1). 신청하지 않으면 제1전공 학위만 수여돼요(학칙 제69조).</div>';
  }
  if(core.length){
    html += '<div class="catcard '+(coreMet(student)?'met':'')+'">' +
      '<div class="cthead"><b>핵심과목 이수</b><span>'+coreOkCount+' / '+core.length+'과목'+(coreMet(student)?' 충족':'')+'</span></div>' +
      '<div class="pbar"><i style="width:'+pct(coreOkCount, core.length)+'%"></i></div>' +
      '<div class="cm" style="margin-top:8px; font-size:11.5px; color:var(--text-muted);">' +
        core.map(function(c){ return (c.done?'✓ ':'· ') + esc(c.name); }).join(' &nbsp; ') +
      '</div>' +
    '</div>';
  }
  html +=
  '<div class="catcard '+(cvgOk?'met':'')+'">' +
    '<div class="cthead"><b>융합전공 이수학점</b><span>'+cvgCur+' / '+cvgMin+'학점'+(cvgOk?' 충족':'')+'</span></div>' +
    '<div class="pbar"><i style="width:'+pct(cvgCur,cvgMin)+'%"></i></div>' +
  '</div>';
  if(info.primaryMin){
    var pCur = num(student.primaryMajorCredits), pOk = pCur >= info.primaryMin;
    html += '<div class="catcard '+(pOk?'met':'')+'">' +
      '<div class="cthead"><b>제1전공 이수학점</b><span>'+pCur+' / '+info.primaryMin+'학점'+(pOk?' 충족':'')+'</span></div>' +
      '<div class="pbar"><i style="width:'+pct(pCur,info.primaryMin)+'%"></i></div>' +
    '</div>';
  }
  if(thesisApplies(student)){
    var tOk = !!student.thesisDone;
    html += '<div class="catcard '+(tOk?'met':'')+'">' +
      '<div class="cthead"><b>졸업논문(복수전공 필수과목)</b><span>'+(tOk?'이수 완료':'미이수')+'</span></div>' +
      '<div class="cm">학칙 제44조① · 제1전공 학과 졸업논문이 필수과목이라 복수전공 이수자도 반드시 이수해야 해요.</div>' +
    '</div>';
  }
  var mp = microdegreeProgram(student);
  if(mp.key){
    var mCur = num(student.microdegreeCredits), mOk = mCur >= mp.min;
    html += '<div class="catcard '+(mOk?'met':'')+'" style="margin-top:16px;">' +
      '<div class="cthead"><b>마이크로디그리 · '+esc(mp.name)+'</b><span>'+mCur+' / '+mp.min+'학점'+(mOk?' 충족':'')+'</span></div>' +
      '<div class="pbar"><i style="width:'+pct(mCur,mp.min)+'%"></i></div>' +
      (mp.note ? '<div class="cm" style="margin-top:6px;">'+esc(mp.note)+'</div>' : '') +
    '</div>';
  }
  return html;
}

async function saveCourse(form){
  var courseCode = form.querySelector('#cCourse').value;
  var catalogCourse = courseCode==='__custom__' ? null : courseInCatalog(courseCode);
  var name = catalogCourse ? catalogCourse.name : form.querySelector('#cName').value.trim();
  var credits = form.querySelector('#cCredits').value;
  var semester = form.querySelector('#cSemester').value.trim();
  if(!name){ state.formError='과목명을 입력해 주세요.'; render(); return; }

  var isAdmin = state.role==='admin';
  var col = 'cvg_students';
  var id = isAdmin ? state.detailId : state.studentSession.id;
  var student = isAdmin ? state.cache.detail : state.cache.me;
  var list = courses(student).slice();
  var courseCodeToSave = catalogCourse ? catalogCourse.code : null;

  if(state.editingCourseId){
    list = list.map(function(c){
      return c.id===state.editingCourseId ? { id:c.id, name:name, credits:num(credits), semester:semester, courseCode:courseCodeToSave } : c;
    });
  } else {
    list.push({ id:uid(), name:name, credits:num(credits), semester:semester, courseCode:courseCodeToSave });
  }
  await storeUpdate(col, id, { courses:list });
  student.courses = list;
  state.editingCourseId = null; state.formError='';
  state.view = isAdmin ? 'detail' : 'home';
  render();
}

async function changePassword(oldPw, newPw, newPw2){
  if(newPw.length<6){ state.formError='새 비밀번호는 6자 이상이어야 해요.'; render(); return; }
  if(newPw!==newPw2){ state.formError='새 비밀번호가 서로 달라요.'; render(); return; }
  var isAdmin = state.role==='admin';
  var col = isAdmin ? 'cvg_admins' : 'cvg_students';
  var id = isAdmin ? state.adminSession.id : state.studentSession.id;
  var doc = await storeGet(col, id);
  var oldHash = await sha256Hex(oldPw);
  if(oldHash !== doc.passwordHash){ state.formError='현재 비밀번호가 올바르지 않아요.'; render(); return; }
  var newHash = await sha256Hex(newPw);
  await storeUpdate(col, id, { passwordHash:newHash });
  state.formError=''; state.formOk='비밀번호를 바꿨어요.';
  state.view = isAdmin ? 'list' : 'home';
  render();
}

async function openDetail(id){
  state.detailId = id;
  state.cache.detail = await storeGet('cvg_students', id);
  state.view='detail'; state.formOk=''; state.formError='';
  render();
}
async function resetStudentPassword(){
  var tempPw = '000000';
  var hash = await sha256Hex(tempPw);
  await storeUpdate('cvg_students', state.detailId, { passwordHash:hash });
  state.formOk = '비밀번호를 '+tempPw+' 로 초기화했어요. 학생에게 알려주세요.';
  render();
}
async function deleteStudent(){
  if(!window.confirm('정말 이 학생을 삭제할까요? 되돌릴 수 없어요.')) return;
  await storeDelete('cvg_students', state.detailId);
  state.view='list'; state.detailId=null; state.cache.detail=null;
  await loadRoster();
  render();
}
async function saveAdminCode(code){
  await storeUpdate('cvg_config', 'app', { adminCode: code.trim() });
  state.cache.adminCode = code.trim();
  state.formOk = '등록코드를 저장했어요.';
  render();
}
async function saveCoreCourses(codes){
  await storeUpdate('cvg_config', 'app', { coreCourseCodes: codes });
  applyCoreCourseCodes(codes);
  state.formOk = '핵심과목을 저장했어요.';
  render();
}

document.addEventListener('submit', function(e){
  var f = e.target;
  if(f.id==='form-login'){
    e.preventDefault();
    doLogin(state.role, f.querySelector('#loginId').value.trim(), f.querySelector('#loginPw').value).catch(failWith);
  }
  if(f.id==='form-register'){
    e.preventDefault();
    doRegisterStudent(
      f.querySelector('#regId').value.trim(), f.querySelector('#regName').value.trim(),
      f.querySelector('#regDept').value.trim(), f.querySelector('#regYear').value.trim(),
      f.querySelector('#regPw').value, f.querySelector('#regPw2').value
    ).catch(failWith);
  }
  if(f.id==='form-register-admin'){
    e.preventDefault();
    doRegisterAdmin(
      f.querySelector('#raId').value.trim(), f.querySelector('#raName').value.trim(),
      f.querySelector('#raPw').value, f.querySelector('#raPw2').value, f.querySelector('#raCode').value.trim()
    ).catch(failWith);
  }
  if(f.id==='form-course'){
    e.preventDefault();
    saveCourse(f).catch(failWith);
  }
  if(f.id==='form-info'){
    e.preventDefault();
    saveInfo(f).catch(failWith);
  }
  if(f.id==='form-changepw'){
    e.preventDefault();
    changePassword(f.querySelector('#pwOld').value, f.querySelector('#pwNew').value, f.querySelector('#pwNew2').value).catch(failWith);
  }
  if(f.id==='form-admincode'){
    e.preventDefault();
    saveAdminCode(f.querySelector('#adminCode').value).catch(failWith);
  }
  if(f.id==='form-corecourses'){
    e.preventDefault();
    var codes = [0,1,2].map(function(i){ return f.querySelector('#coreSlot'+i).value; }).filter(function(v){ return v; });
    codes = codes.filter(function(v, i){ return codes.indexOf(v)===i; });
    saveCoreCourses(codes).catch(failWith);
  }
});

document.addEventListener('input', function(e){
  var bind = e.target.dataset && e.target.dataset.bind;
  if(!bind) return;
  state[bind] = e.target.value;
  render();
  var el = bind==='q' ? document.querySelector('[data-bind="q"]') : null;
  if(el){ el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
});

document.addEventListener('change', function(e){
  if(e.target.id !== 'cCourse') return;
  var form = e.target.closest('form');
  var wrap = form.querySelector('#cCustomWrap');
  var creditsInput = form.querySelector('#cCredits');
  if(e.target.value === '__custom__'){
    wrap.style.display = 'block';
  } else {
    wrap.style.display = 'none';
    var c = courseInCatalog(e.target.value);
    if(c) creditsInput.value = c.credits;
  }
});

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var act = el.dataset.action;
  state.formError='';
  if(act==='open-guide'){ state.mode='guide'; state.guideRole = state.role==='admin'?'admin':'student'; window.scrollTo(0,0); }
  else if(act==='close-guide'){ state.mode='app'; }
  else if(act==='set-guide-role'){ state.guideRole = el.dataset.role; window.scrollTo(0,0); }
  else if(act==='set-role'){ state.role = el.dataset.role; state.view='login'; state.formOk=''; }
  else if(act==='goto-register'){ state.view='register'; }
  else if(act==='goto-register-admin'){ state.view='register-admin'; }
  else if(act==='goto-login'){ state.view='login'; state.formOk=''; }
  else if(act==='goto-home'){ state.view='home'; state.editingCourseId=null; }
  else if(act==='goto-list'){
    state.view='list'; state.formOk='';
    loadRoster().then(render);
    render(); return;
  }
  else if(act==='goto-detail'){ state.view='detail'; state.editingCourseId=null; }
  else if(act==='goto-course-form'){ state.editingCourseId=null; state.view='course-form'; }
  else if(act==='goto-info-form'){ state.view='info-form'; }
  else if(act==='edit-course'){ state.editingCourseId = el.dataset.id; state.view='course-form'; }
  else if(act==='delete-course'){ deleteCourse(el.dataset.id).catch(failWith); return; }
  else if(act==='goto-profile'){ state.formOk=''; state.view='profile'; }
  else if(act==='goto-settings'){
    state.view='settings'; state.formOk='';
    storeGet('cvg_config','app').then(function(cfg){ state.cache.adminCode = cfg?cfg.adminCode:''; render(); });
    render(); return;
  }
  else if(act==='open-detail'){ openDetail(el.dataset.id).catch(failWith); return; }
  else if(act==='reset-password'){ resetStudentPassword().catch(failWith); return; }
  else if(act==='delete-student'){ deleteStudent().catch(failWith); return; }
  else if(act==='logout'){ setSession(state.role, null); state.view='login'; state.formOk=''; }
  render();
});

/* ============ 시작 ============ */
loadFallback();
loadSessions();
if(state.studentSession){ state.role='student'; state.view='home'; }
else if(state.adminSession){ state.role='admin'; state.view='list'; }
render();

(async function boot(){
  try{
    await loadCoreCourses();
    if(state.role==='student' && state.studentSession){ await loadMe(); }
    else if(state.role==='admin' && state.adminSession){ await loadRoster(); }
  }catch(e){ state.formError = errMsg(e); }
  render();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
})();
</script>
</body>
</html>
